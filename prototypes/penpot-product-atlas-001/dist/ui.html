<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LoveKGD Product Atlas</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #221a14; background: #fbf7ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; }
    h1 { margin: 0 0 5px; font-size: 21px; }
    .sub { margin: 0 0 16px; color: #6d6259; line-height: 1.4; }
    .card { border: 1px solid #e1d3c2; background: #fffdf8; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .meta { font-size: 12px; color: #6d6259; line-height: 1.55; overflow-wrap: anywhere; }
    .actions { display: grid; gap: 8px; }
    button { min-height: 44px; border-radius: 999px; border: 1px solid #98401f; padding: 8px 14px; font: 700 14px/1.2 inherit; cursor: pointer; background: #fffdf8; color: #793014; }
    button.primary { background: #a54821; color: white; }
    button:focus-visible { outline: 3px solid rgba(15,118,110,.55); outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { border-left: 5px solid #0f766e; }
    .status.error { border-left-color: #a92d2d; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; max-height: 210px; overflow: auto; margin: 8px 0 0; }
    textarea { width: 100%; min-height: 260px; resize: vertical; border: 1px solid #e1d3c2; border-radius: 10px; padding: 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .hidden { display: none; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .badge { padding: 3px 8px; border-radius: 999px; border: 1px solid #e1d3c2; font-size: 11px; }
  </style>
</head>
<body>
  <h1>LoveKGD Product Atlas</h1>
  <p class="sub">Отдельный guarded plugin для продуктовой доски. Он не импортирует Resource Graph дизайн-системы.</p>

  <section class="card">
    <div class="row"><strong>Catalog</strong><span id="catalog-state" class="badge">loading</span></div>
    <div id="catalog-meta" class="meta"></div>
  </section>

  <section class="card actions">
    <button id="inspect">Проверить актуальность</button>
    <button id="apply" class="primary">Обновить Product Atlas</button>
    <button id="prompt">Собрать системный промпт</button>
  </section>

  <section id="status-card" class="card status">
    <strong id="status-title">Готово к загрузке catalog</strong>
    <pre id="status-text"></pre>
  </section>

  <section id="prompt-card" class="card hidden">
    <div class="row"><strong>Системный review prompt</strong><button id="copy">Копировать</button></div>
    <textarea id="prompt-text" readonly></textarea>
  </section>

<script>
(() => {
  const ROOT = 'https://cdn.jsdelivr.net/gh/onedayonemasterpiece/lovekgd-design-system@main/prototypes/penpot-product-atlas-001';
  let catalog = null;
  const $ = (id) => document.getElementById(id);
  const send = (message) => parent.postMessage(message, '*');

  async function sha256(text) {
    const bytes = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(digest)].map((value) => value.toString(16).padStart(2, '0')).join('');
  }

  function setStatus(title, text = '', kind = '') {
    $('status-title').textContent = title;
    $('status-text').textContent = text;
    $('status-card').className = `card status${kind === 'error' ? ' error' : ''}`;
  }

  function enable(value) {
    ['inspect', 'apply', 'prompt'].forEach((id) => { $(id).disabled = !value; });
  }

  async function loadCatalog() {
    enable(false);
    try {
      const response = await fetch(`${ROOT}/catalog/catalog.json?ts=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`catalog_http_${response.status}`);
      const raw = await response.text();
      const parsed = JSON.parse(raw);
      parsed.catalogSha256 = await sha256(raw);
      catalog = parsed;
      $('catalog-state').textContent = parsed.catalogRevision;
      $('catalog-meta').textContent = `${parsed.catalogKind} · ${parsed.elements.length} elements · ${parsed.catalogSha256}`;
      setStatus('Catalog загружен', 'Plugin ещё не изменял Penpot-файл. Сначала можно выполнить preflight.');
      enable(true);
      send({ type: 'plugin-ready', catalog });
    } catch (error) {
      $('catalog-state').textContent = 'failed';
      setStatus('Catalog не загружен', String(error && error.message || error), 'error');
    }
  }

  $('inspect').onclick = () => catalog && send({ type: 'inspect-catalog', catalog });
  $('apply').onclick = () => catalog && send({ type: 'apply-catalog', catalog });
  $('prompt').onclick = () => catalog && send({ type: 'build-prompt', catalog });
  $('copy').onclick = async () => {
    await navigator.clipboard.writeText($('prompt-text').value);
    $('copy').textContent = 'Скопировано';
    setTimeout(() => { $('copy').textContent = 'Копировать'; }, 1200);
  };

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || typeof message !== 'object') return;
    if (message.type === 'status') setStatus(message.title || 'Статус', message.text || '', message.kind || '');
    if (message.type === 'plan') setStatus(
      message.changeCount ? 'Требуется обновление' : 'Product Atlas актуален',
      JSON.stringify(message, null, 2),
      message.guardError ? 'error' : '',
    );
    if (message.type === 'progress') setStatus(`Обновление: ${message.phase}`, `${message.completed || 0} / ${message.total || 0}\n${message.detail || ''}`);
    if (message.type === 'report') setStatus('Обновление завершено', JSON.stringify(message.result, null, 2));
    if (message.type === 'prompt') {
      $('prompt-card').classList.remove('hidden');
      $('prompt-text').value = message.text || '';
      setStatus('Промпт собран', `${message.commentCount || 0} комментариев из ${message.entityCount || 0} сущностей.`);
    }
  });

  loadCatalog();
})();
</script>
</body>
</html>
