name: One-shot consolidate design-system research and prompt

on:
  push:
    branches:
      - research/consta-documentation-patterns-20260819-review
    paths:
      - '.github/workflows/_one-shot-consolidate-design-system-docs.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/consta-documentation-patterns-20260819-review
          fetch-depth: 0

      - name: Patch documentation and machine controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one marker, found {count}: {old[:120]!r}')
              write(path, content.replace(old, new, 1))

          # Source register: add the exact historical PDF source and evidence state.
          path = 'docs/research/design-system-benchmark-2026-08/source-register.md'
          old = "| `S-ROSATOM-FIGMA` | Rosatom | https://www.figma.com/community/file/1144567424019815189 | `A/D` | current first-party page and embed return 404; historical index/cover only, no live node or checkpoint read-back |\n"
          new = old + "| `S-ROSATOM-STYLE-GUIDE-2022` | Rosatom digital-product style guide | `attachment:rosatom-style-guide.pdf` | `A` | exact 18-page September 2022 historical guide; SHA-256 `c045730142865fa4425bd4642d4f8e87ab9f50baf0722cd5ffaba14a18e00e7c`; current design/code parity not established |\n"
          replace_once(path, old, new)

          old = """Rosatom availability evidence:\n\n```yaml\nreference_state: UNPUBLISHED_OR_INACCESSIBLE\ncommunity_file_id: 1144567424019815189\nfirst_party_community_page: 404\nfirst_party_embed: 404\nhistorical_index_only: true\n```\n"""
          new = old + """\nRosatom historical document evidence:\n\n```yaml\nreference_state: HISTORICAL_DOCUMENT_READBACK\nsource_id: S-ROSATOM-STYLE-GUIDE-2022\nstated_edition: 09.2022\npages: 18\nsha256: c045730142865fa4425bd4642d4f8e87ab9f50baf0722cd5ffaba14a18e00e7c\ncurrent_parity: unverified\nanalysis_ref: 08-rosatom-style-guide-2022.md\n```\n"""
          replace_once(path, old, new)

          old = "8. Reverse-engineered checkpoint structure can support research inventory, but does not become an official Figma API contract or LoveKGD authority.\n"
          new = old + "9. An exact historical document may establish historical structure and terminology, but cannot establish current values, bindings, compatibility or lifecycle.\n"
          replace_once(path, old, new)

          # Benchmark overview: incorporate the exact historical guide and consolidated prompt.
          path = 'docs/research/design-system-benchmark-2026-08/README.md'
          old = "| Rosatom | current Community page and embed return 404; available only historical index card/cover |\n"
          new = old + "| Rosatom style guide, 09.2022 | exact 18-page historical PDF read; content, brand, foundations, responsive rules and component catalogue analysed; current parity remains unverified |\n"
          replace_once(path, old, new)

          old = "Полный результат: [07-direct-figma-readback-t2d2-rosatom.md](07-direct-figma-readback-t2d2-rosatom.md).\n"
          new = """Полный direct-Figma результат: [07-direct-figma-readback-t2d2-rosatom.md](07-direct-figma-readback-t2d2-rosatom.md).\n\nExact historical Rosatom guide: [08-rosatom-style-guide-2022.md](08-rosatom-style-guide-2022.md).\n"""
          replace_once(path, old, new)

          marker = "## Состав результата\n"
          addition = """### 14. Foundations включают content, brand, media и layout rules\n\nRosatom 2022 directly documents communication style, editorial standards, logo rules, color modes, typography, iconography, media ratios, breakpoints, grid, spacing, radii and opacity before the component catalogue. LoveKGD must model these as versioned foundation domains with owners, consumers and validation—not as decorative introductory pages.\n\n### 15. Static style guide is documentation, not executable authority\n\nA PDF or design board can preserve rationale and examples, but cannot prevent drift. Foundation and component pages must be generated from or validated against contracts, package exports, Penpot bindings, fixture registries and tests.\n\n### 16. Canonical naming must be semantic\n\nOpaque film/food/random mnemonics may be retained as human aliases, but canonical IDs describe role and are shared by code, Penpot manifests, docs and tests. Historical naming/value defects remain evidence and require explicit correction receipts.\n\n### 17. Responsive, media and brand rules require registries\n\nBreakpoints, containers, columns, gutters, media ratios, crop behavior, logo safe areas, icon geometry and asset rights are machine-readable contracts with exact consumers and compatibility. They are not copied wholesale from external systems.\n\n"""
          content = read(path)
          if marker not in content:
              raise RuntimeError(f'{path}: result marker missing')
          write(path, content.replace(marker, addition + marker, 1))

          old = "- [07-direct-figma-readback-t2d2-rosatom.md](07-direct-figma-readback-t2d2-rosatom.md) — direct public Figma metadata/canvas/checkpoint evidence;\n"
          new = old + "- [08-rosatom-style-guide-2022.md](08-rosatom-style-guide-2022.md) — exact historical Rosatom foundation/content/layout analysis;\n"
          replace_once(path, old, new)

          old = "- [Design-system development control v0.1](../../roadmaps/design-system-development-control-v0.1.md) — управляющий документ доработки;\n"
          new = old + "- [Design-system task operating prompt v0.1](../../design-system-task-operating-prompt.md) — reusable evidence-first prompt for current tasks;\n"
          replace_once(path, old, new)

          # System profile: replace the limited Rosatom profile with the exact historical analysis.
          path = 'docs/research/design-system-benchmark-2026-08/01-system-profiles.md'
          old = """## 16. Росатом\n\n**Evidence:** `C/B` — user-provided Figma file and official portal shell. `[S-ROSATOM-FIGMA] [S-ROSATOM-SITE]`\n\n### Observed\n\nPublic positioning separates style guide, Figma library and implementation preview. Portal content was not exposed to the current crawler.\n\n### Transferable pattern\n\nPortal should connect design resources and executable preview.\n\n### Risk / limit\n\nNo component/token/lifecycle claim is made from current evidence.\n\n### LoveKGD action\n\nKeep as target for later direct browser/Figma audit; do not use it for current detailed architecture decisions.\n"""
          new = """## 16. Росатом\n\n**Evidence:** `A/C/B` — exact September 2022 style-guide PDF, unavailable current Community file and official portal shell. `[S-ROSATOM-STYLE-GUIDE-2022] [S-ROSATOM-FIGMA] [S-ROSATOM-SITE]`\n\n### Observed\n\n- The 18-page guide connects Figma, Vue.js, React, the public portal and a support route.\n- Foundations precede components: communication style, editorial standards, brand/logo, Default/Dark palettes, typography, iconography, media ratios, breakpoints, grid, outer margins, spacing, radii and opacity.\n- The guide defines concrete responsive ranges, six/twelve-column grids, a 4 px spacing module, icon sizes/strokes and media aspect classes.\n- Page 17 is a broad visual component catalogue, not a full per-component dossier.\n- Color, typography and other scales use opaque mnemonic names and contain visible naming/value drift.\n- The current first-party Community page/embed return 404, so present-day Figma/code parity remains unverified.\n\n### Transferable pattern\n\nTreat content, brand, responsive layout, media and support as first-class foundation knowledge; connect design, implementation preview and owner/support entry points.\n\n### Risk / limit\n\nThe source is historical. Exact colors, breakpoints, fonts and components cannot be copied as current LoveKGD truth. Static PDF and a showroom do not establish machine contracts, accessibility, lifecycle or code parity.\n\n### LoveKGD action\n\nCreate versioned foundation domains and registries for content/terminology, brand assets, semantic tokens/modes, typography, iconography, media, responsive containers/grid, spacing/radius/opacity, motion and accessibility. Canonical IDs must be semantic; historical mnemonics are display/search aliases only. Every component/pattern/archetype binds exact foundation versions and receives a dossier rather than only a catalogue tile.\n"""
          replace_once(path, old, new)

          # Pattern matrix: add the Rosatom findings and recurring foundation patterns/failures.
          path = 'docs/research/design-system-benchmark-2026-08/02-pattern-matrix.md'
          old = "| Росатом | ◐ | ◐ | ◐ | ◐ | ◐ | ◐ | ◐ | multi-surface portal; deeper audit required |\n"
