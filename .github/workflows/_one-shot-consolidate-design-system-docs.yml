      - name: Validate changed documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool contracts/design-system-development-control.v0.1.json >/dev/null
          test -s docs/design-system-task-operating-prompt.md
          test -s docs/research/design-system-benchmark-2026-08/08-rosatom-style-guide-2022.md
          grep -q 'HISTORICAL_DOCUMENT_READBACK' contracts/design-system-development-control.v0.1.json
          grep -q 'foundation_domains' contracts/design-system-development-control.v0.1.json
          grep -q 'design-system-task-operating-prompt.md' docs/index.md
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('README.md'),
              Path('docs/index.md'),
              Path('docs/design-system-task-operating-prompt.md'),
              Path('docs/roadmaps/design-system-development-control-v0.1.md'),
              Path('docs/research/design-system-benchmark-2026-08/README.md'),
              Path('docs/research/design-system-benchmark-2026-08/07-direct-figma-readback-t2d2-rosatom.md'),
              Path('docs/research/design-system-benchmark-2026-08/08-rosatom-style-guide-2022.md'),
          ]
          missing = []
          pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for source in roots:
              text = source.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  if '://' in target or target.startswith('#'):
                      continue
                  clean = target.split('#', 1)[0]
                  resolved = (source.parent / clean).resolve()
                  if clean and not resolved.exists():
                      missing.append((str(source), target))
          if missing:
              raise SystemExit('Missing local links: ' + repr(missing))
          PY

