name: Replace corrective bootstrap workflows with canonical CI

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-corrective-20260824-r4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrective-sot-workflow-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-corrective-20260824-r4
          fetch-depth: 0

      - name: Require committed corrective outputs
        run: |
          set -euo pipefail
          test -f catalog/global-archetype-sot-v1/corrective-receipt.v1.json
          test -f scripts/global-archetype-sot-v1/build-corrective.mjs
          test -f tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          test -f tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          test "$(find catalog/global-archetype-sot-v1/archetype-contracts -name '*.semantic-contract.v1.json' | wc -l)" -eq 17

      - name: Restore parent workflows and install thin corrective CI
        shell: bash
        run: |
          set -euo pipefail
          git checkout da16dde8812220125a806bd5a03d5015357d4c07 -- .github/workflows
          cat > .github/workflows/global-archetype-sot-v1-corrective.yml <<'YAML'
          name: Corrective global archetype SoT

          on:
            push:
              branches:
                - feature/global-archetype-sot-v1-corrective-20260824-r4
              paths:
                - 'catalog/global-archetype-sot-v1/**'
                - 'scripts/global-archetype-sot-v1/**'
                - 'tests/global-archetype-sot-v1*.mjs'
                - '.github/workflows/global-archetype-sot-v1-corrective.yml'
            pull_request:
              branches:
                - feature/date-listing-shell-v1-20260823
              paths:
                - 'catalog/global-archetype-sot-v1/**'
                - 'scripts/global-archetype-sot-v1/**'
                - 'tests/global-archetype-sot-v1*.mjs'
                - '.github/workflows/global-archetype-sot-v1-corrective.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: corrective-global-archetype-sot-${{ github.ref }}
            cancel-in-progress: false

          jobs:
            verify:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - name: Checkout corrective branch
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
                  with:
                    fetch-depth: 0
                - name: Checkout pinned Astro source
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
                  with:
                    repository: onedayonemasterpiece/events-bot-new
                    ref: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
                    path: .external/events-bot-new
                    fetch-depth: 1
                - name: Set up Node 22
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 22.12.0
                - name: Prove byte-stable deterministic output
                  env:
                    EVENTS_BOT_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    ASTRO_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    CORRECTIVE_BASE_SHA: da16dde8812220125a806bd5a03d5015357d4c07
                  run: |
                    set -euo pipefail
                    git diff --quiet
                    node scripts/global-archetype-sot-v1/build-corrective.mjs
                    rm -rf .external
                    git diff --exit-code -- \
                      catalog/global-archetype-sot-v1 \
                      scripts/global-archetype-sot-v1 \
                      tests/global-archetype-sot-v1-semantic-completeness.test.mjs \
                      tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
                - name: Run semantic completeness
                  env:
                    EVENTS_BOT_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    ASTRO_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    CORRECTIVE_BASE_SHA: da16dde8812220125a806bd5a03d5015357d4c07
                  run: node tests/global-archetype-sot-v1-semantic-completeness.test.mjs
                - name: Run corrective boundaries
                  env:
                    EVENTS_BOT_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    ASTRO_ROOT: ${{ github.workspace }}/.external/events-bot-new
                    CORRECTIVE_BASE_SHA: da16dde8812220125a806bd5a03d5015357d4c07
                  run: node tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
                - name: Validate verified handoff and whitespace
                  env:
                    EVENTS_BOT_ROOT: ${{ github.workspace }}/.external/events-bot-new
                  run: |
                    node scripts/global-archetype-sot-v1/validate-handoff.mjs
                    git diff --check
          YAML
          git add -A .github/workflows
          git diff --cached --check
          git config user.name 'global-archetype-sot-bot'
          git config user.email 'global-archetype-sot-bot@users.noreply.github.com'
          git commit -m 'ci(ds): replace corrective bootstrap with canonical checks'

      - name: Push workflow-only cleanup
        shell: bash
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="${WORKFLOW_PAT:-${GH_PAT:-${REPO_PAT:-${CODEX_GITHUB_TOKEN:-${PERSONAL_ACCESS_TOKEN:-${FALLBACK_TOKEN}}}}}}"
          git push "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feature/global-archetype-sot-v1-corrective-20260824-r4
