name: Publish Penpot Resource Graph 004a.2

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/resource-graph-004a-native-resources
    paths:
      - '.github/workflows/penpot-resource-graph-004a-publish.yml'

permissions:
  contents: write

concurrency:
  group: penpot-resource-graph-004a2
  cancel-in-progress: false

jobs:
  build-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Resource Graph delivery branch
        uses: actions/checkout@v4
        with:
          ref: prototype/resource-graph-004a-native-resources
          fetch-depth: 0

      - name: Apply Penpot 2.17.1 typography compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('prototypes/penpot-resource-graph-004a')
          plugin_path = root / 'src/plugin.js.template'
          source = plugin_path.read_text(encoding='utf-8')

          if 'function setHostSafeFontWeight' not in source:
              anchor = '  function setHostSafeLetterSpacing(target, requested) {'
              helper = r'''  const HOST_FONT_WEIGHTS = Object.freeze([100, 200, 300, 400, 500, 600, 700, 800, 900]);
          const fontWeightWarnings = new Set();

          function nearestHostFontWeight(requested) {
            const numeric = Number(requested);
            if (!Number.isFinite(numeric)) return asString(requested || '500');
            let best = HOST_FONT_WEIGHTS[0];
            let bestDistance = Math.abs(numeric - best);
            for (const candidate of HOST_FONT_WEIGHTS.slice(1)) {
              const distance = Math.abs(numeric - candidate);
              if (distance < bestDistance || (distance === bestDistance && candidate > best)) {
                best = candidate;
                bestDistance = distance;
              }
            }
            return String(best);
          }

          function setHostSafeFontWeight(target, requested) {
            const requestedValue = asString(requested ?? '500').trim() || '500';
            const numeric = Number(requestedValue);
            const appliedValue = Number.isFinite(numeric)
              ? nearestHostFontWeight(requestedValue)
              : requestedValue;
            target.fontWeight = appliedValue;
            const fallback = appliedValue !== requestedValue;
            if (fallback) {
              try {
                mark(target, {
                  requestedFontWeight: requestedValue,
                  appliedFontWeight: appliedValue,
                  fontWeightCompatibilityFallback: 'penpot-2.17.1-discrete-inter-weights',
                });
              } catch {}
              const warningKey = `${requestedValue}->${appliedValue}`;
              if (!fontWeightWarnings.has(warningKey)) {
                fontWeightWarnings.add(warningKey);
                send({
                  type: 'warning',
                  message: `Penpot ${penpot.version || 'unknown'} поддерживает для Inter только дискретные веса 100–900 с шагом 100; ${requestedValue} отображается как ${appliedValue}. Исходное значение сохранено в Typography resource/metadata.`,
                });
              }
            }
            return { requested: requestedValue, applied: appliedValue, fallback };
          }

          '''
              if anchor not in source:
                  raise SystemExit('letter_spacing_helper_anchor_missing')
              source = source.replace(anchor, helper + anchor, 1)

          direct_shape = "    shape.fontWeight = asString(options.fontWeight || 500);"
          safe_shape = "    setHostSafeFontWeight(shape, options.fontWeight ?? 500);"
          if direct_shape in source:
              source = source.replace(direct_shape, safe_shape, 1)
          elif safe_shape not in source:
              raise SystemExit('shape_font_weight_anchor_missing')

          direct_typography = "      type.fontWeight = item.fontWeight;"
          safe_typography = "      setHostSafeFontWeight(type, item.fontWeight);"
          if direct_typography in source:
              source = source.replace(direct_typography, safe_typography, 1)
          elif safe_typography not in source:
              raise SystemExit('typography_font_weight_anchor_missing')

          source = source.replace(
              "penpot.ui.open('LoveKGD Resource Graph · 004a.1', UI_URL, { width: 540, height: 860 });",
              "penpot.ui.open('LoveKGD Resource Graph · 004a.2', UI_URL, { width: 540, height: 860 });",
              1,
          )
          plugin_path.write_text(source, encoding='utf-8')

          manifest_path = root / 'dist/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'LoveKGD Resource Graph — native resources 004a.2'
          manifest['description'] = 'Penpot 2.17.1-compatible Resource Graph with safe negative tracking and discrete Inter font-weight normalization; idempotent retry after partial 004a/004a.1 updates.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ui_path = root / 'dist/ui.html'
          ui = ui_path.read_text(encoding='utf-8')
          ui = ui.replace('LoveKGD Resource Graph 004a.1', 'LoveKGD Resource Graph 004a.2')
          ui = ui.replace('LoveKGD Resource Graph · 004a.1', 'LoveKGD Resource Graph · 004a.2')
          ui = ui.replace(
              'Исправленная поставка для Penpot 2.17.1: native Colors, Typographies, векторная библиотека иконок и core UI components. Повторный запуск безопасно продолжает частичное обновление 004a.',
              'Исправленная поставка для Penpot 2.17.1: negative tracking и нестандартные веса Inter переводятся в host-safe представление без потери исходных токенов. Повторный запуск продолжает частичное обновление 004a/004a.1.',
          )
          ui_path.write_text(ui, encoding='utf-8')
          PY

          grep -Fq 'function setHostSafeFontWeight' prototypes/penpot-resource-graph-004a/src/plugin.js.template
          grep -Fq 'setHostSafeFontWeight(shape, options.fontWeight ?? 500)' prototypes/penpot-resource-graph-004a/src/plugin.js.template
          grep -Fq 'setHostSafeFontWeight(type, item.fontWeight)' prototypes/penpot-resource-graph-004a/src/plugin.js.template
          grep -Fq '004a.2' prototypes/penpot-resource-graph-004a/dist/manifest.json

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: main
          path: .source/events-bot-new
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Rebuild the exact Git-backed catalog
        shell: bash
        run: |
          set -euo pipefail
          root='prototypes/penpot-resource-graph-004a'
          product_sha="$(git -C .source/events-bot-new rev-parse HEAD)"
          node "$root/scripts/build-catalog.mjs" \
            --product-dir .source/events-bot-new \
            --product-sha "$product_sha" \
            --out "$root/catalog/catalog.json"
          test -s "$root/catalog/catalog.json"

      - name: Persist source, UI, manifest and catalog
        shell: bash
        run: |
          set -euo pipefail
          root='prototypes/penpot-resource-graph-004a'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$root/src/plugin.js.template" \
            "$root/dist/ui.html" \
            "$root/dist/manifest.json" \
            "$root/catalog/catalog.json"
          if ! git diff --cached --quiet; then
            git commit -m 'resource graph 004a.2: normalize Penpot font weights safely'
          fi
          git rev-parse HEAD > /tmp/resource-graph-004a2-ui-sha

      - name: Build immutable plugin and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          root='prototypes/penpot-resource-graph-004a'
          ui_sha="$(cat /tmp/resource-graph-004a2-ui-sha)"
          sed "s/__UI_SHA__/$ui_sha/g" "$root/src/plugin.js.template" > "$root/dist/plugin.js"
          node --check "$root/dist/plugin.js"
          python3 - <<'PY'
          from pathlib import Path
          html = Path('prototypes/penpot-resource-graph-004a/dist/ui.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/resource-graph-004a2-ui.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/resource-graph-004a2-ui.js
          node "$root/scripts/validate.mjs" "$root"

      - name: Exercise all non-standard font weights used by the graph
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('prototypes/penpot-resource-graph-004a/dist/plugin.js', 'utf8');
          const start = source.indexOf('const HOST_FONT_WEIGHTS');
          const end = source.indexOf('\n\n  function createText', start);
          if (start < 0 || end < 0) throw new Error('font_weight_compatibility_helper_missing');
          const helperSource = source.slice(start, end);
          const warnings = [];
          const asString = (value) => value == null ? '' : String(value);
          const mark = (target, metadata) => { target.metadata = { ...(target.metadata || {}), ...metadata }; };
          const send = (message) => warnings.push(message);
          const penpot = { version: '2.17.1-RC5' };
          eval(`${helperSource}\n;globalThis.__setHostSafeFontWeight = setHostSafeFontWeight; globalThis.__setHostSafeLetterSpacing = setHostSafeLetterSpacing;`);

          const expected = new Map([
            ['650', '700'],
            ['750', '800'],
            ['850', '900'],
            ['950', '900'],
            ['900', '900'],
          ]);
          for (const [requested, applied] of expected) {
            const target = { _weight: null, set fontWeight(value) {
              if (!['100','200','300','400','500','600','700','800','900'].includes(String(value))) {
                throw new Error(`unsupported:${value}`);
              }
              this._weight = String(value);
            } };
            const result = globalThis.__setHostSafeFontWeight(target, requested);
            if (target._weight !== applied || result.applied !== applied) {
              throw new Error(`font_weight_mapping_failed:${requested}->${target._weight}`);
            }
            if (requested !== applied && target.metadata?.requestedFontWeight !== requested) {
              throw new Error(`font_weight_metadata_missing:${requested}`);
            }
          }

          const trackingTarget = { _tracking: null, set letterSpacing(value) {
            if (Number(value) < 0) throw new Error(`unsupported_tracking:${value}`);
            this._tracking = String(value);
          } };
          const tracking = globalThis.__setHostSafeLetterSpacing(trackingTarget, '-1.2');
          if (trackingTarget._tracking !== '0' || !tracking.fallback) throw new Error('negative_tracking_regression');

          if (!source.includes('setHostSafeFontWeight(shape, options.fontWeight ?? 500)')) throw new Error('create_text_not_guarded');
          if (!source.includes('setHostSafeFontWeight(type, item.fontWeight)')) throw new Error('typography_resource_not_guarded');
          if (source.includes('shape.fontWeight = asString(options.fontWeight || 500)')) throw new Error('unsafe_shape_assignment_present');
          if (source.includes('type.fontWeight = item.fontWeight')) throw new Error('unsafe_typography_assignment_present');
          if (warnings.length < 5) throw new Error(`compatibility_warnings_missing:${warnings.length}`);
          console.log(JSON.stringify({ ok: true, mappings: Object.fromEntries(expected), warnings: warnings.length }));
          NODE

      - name: Commit plugin and publish live ref
        shell: bash
        run: |
          set -euo pipefail
          root='prototypes/penpot-resource-graph-004a'
          git add "$root/dist/plugin.js"
          if ! git diff --cached --quiet; then
            git commit -m 'resource graph 004a.2: bind host-safe plugin to immutable UI and catalog'
          fi
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:prototype/resource-graph-004a-native-resources
          git push --force origin HEAD:resource-graph-004a-live
          printf '%s' "$final_sha" > /tmp/resource-graph-004a2-final-sha

      - name: Public delivery smoke
        shell: bash
        run: |
          set -euo pipefail
          root='prototypes/penpot-resource-graph-004a'
          ui_sha="$(cat /tmp/resource-graph-004a2-ui-sha)"
          final_sha="$(cat /tmp/resource-graph-004a2-final-sha)"
          work="$RUNNER_TEMP/resource-graph-004a2-public"
          mkdir -p "$work"

          fetch_public() {
            local url="$1" body="$2" headers="$3"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 90 \
                -D "$headers" -o "$body" "$url"; then
                return 0
              fi
              sleep 5
            done
            echo "public fetch failed: $url" >&2
            return 1
          }
          assert_cors() { tr -d '\r' < "$1" | grep -Eiq '^access-control-allow-origin:[[:space:]]*\*$'; }

          cdn="https://cdn.jsdelivr.net/gh/onedayonemasterpiece/lovekgd-design-system@${final_sha}/${root}/dist"
          fetch_public "$cdn/manifest.json" "$work/manifest.json" "$work/manifest.headers"
          fetch_public "$cdn/plugin.js" "$work/plugin.js" "$work/plugin.headers"
          fetch_public "$cdn/icon.svg" "$work/icon.svg" "$work/icon.headers"
          fetch_public "https://raw.githack.com/onedayonemasterpiece/lovekgd-design-system/${ui_sha}/${root}/dist/ui.html" "$work/ui.html" "$work/ui.headers"
          fetch_public "https://raw.githack.com/onedayonemasterpiece/lovekgd-design-system/${final_sha}/${root}/catalog/catalog.json" "$work/catalog.json" "$work/catalog.headers"

          for file in manifest plugin icon ui catalog; do assert_cors "$work/$file.headers"; done
          node --check "$work/plugin.js"
          node - "$work" "$ui_sha" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [work, uiSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(work, 'manifest.json'), 'utf8'));
          const plugin = fs.readFileSync(path.join(work, 'plugin.js'), 'utf8');
          const ui = fs.readFileSync(path.join(work, 'ui.html'), 'utf8');
          const catalog = JSON.parse(fs.readFileSync(path.join(work, 'catalog.json'), 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(manifest.version === 2, 'manifest_version');
          assert(manifest.name.includes('004a.2'), 'manifest_patch_revision');
          assert(plugin.includes(`const UI_SHA = '${uiSha}'`), 'ui_pin');
          assert(plugin.includes('function setHostSafeFontWeight'), 'font_weight_compatibility');
          assert(plugin.includes('function setHostSafeLetterSpacing'), 'letter_spacing_compatibility');
          assert(ui.includes('LoveKGD Resource Graph · 004a.2'), 'ui_patch_revision');
          assert(catalog.delivery === 'penpot-resource-graph-004a', 'catalog_delivery');
          assert(catalog.icons.length >= 40, 'icon_count');
          NODE

          {
            echo '### Resource Graph 004a.2 public delivery: PASS'
            echo
            echo "- immutable plugin commit: $final_sha"
            echo "- pinned UI commit: $ui_sha"
            echo '- Penpot 2.17.1 negative tracking compatibility: PASS'
            echo '- Penpot discrete Inter weights 650/750/850/950 normalization: PASS'
            echo '- public manifest/plugin/icon/UI/catalog HTTP + CORS + syntax + contract smoke: PASS'
            echo "- manifest: https://cdn.jsdelivr.net/gh/onedayonemasterpiece/lovekgd-design-system@${final_sha}/${root}/dist/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload catalog receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-graph-004a2-${{ github.run_id }}
          path: prototypes/penpot-resource-graph-004a/catalog/catalog.json
          if-no-files-found: warn
          retention-days: 30
