name: Final acceptance — global archetype corrective delta

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-corrective-20260824-r4
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823
    paths:
      - 'catalog/global-archetype-sot-v1/**'
      - 'scripts/global-archetype-sot-v1/**'
      - 'tests/global-archetype-sot-v1-*.test.mjs'
      - '.github/workflows/global-archetype-corrective-final-acceptance.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: global-archetype-corrective-final-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/global-archetype-sot-v1-corrective-20260824-r4
      BASE_BRANCH: feature/date-listing-shell-v1-20260823
      ASTRO_SHA: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
    steps:
      - name: Checkout final corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-corrective-20260824-r4
          fetch-depth: 0

      - name: Require materialized final outputs
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            catalog/global-archetype-sot-v1/byte-equality-proof.v1.json \
            catalog/global-archetype-sot-v1/source-lock.v1.json \
            catalog/global-archetype-sot-v1/penpot-materialization-plan.v1.json \
            catalog/global-archetype-sot-v1/reconciliation-proofs.v1.json \
            catalog/global-archetype-sot-v1/corrective-receipt.v1.json \
            catalog/global-archetype-sot-v1/sha256-manifest.v1.json \
            scripts/global-archetype-sot-v1/build-corrective.py \
            scripts/global-archetype-sot-v1/harden-corrective.py \
            tests/global-archetype-sot-v1-semantic-completeness.test.mjs \
            tests/global-archetype-sot-v1-corrective-boundaries.test.mjs; do
            test -f "$path" || { echo "Missing final output: $path" >&2; exit 1; }
          done

      - name: Checkout locked Astro source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
          path: .astro-source
          sparse-checkout: |
            site/src
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Run persistent semantic tests
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          node tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          node tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          git diff --check

      - name: Enforce strict semantic and composition boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const root = 'catalog/global-archetype-sot-v1';
          const contracts = readdirSync(`${root}/archetype-contracts`)
            .filter((name) => name.endsWith('.semantic-contract.v1.json'))
            .sort();
          assert.equal(contracts.length, 17);
          const forbiddenKey = /penpot|renderer|materialization.?ir/iu;
          const forbiddenValue = /\/penpot\/|materialization-ir\.v1\.json|renderer delta|renderer_delta/iu;
          const inspect = (value, trail = []) => {
            if (Array.isArray(value)) {
              value.forEach((item, index) => inspect(item, [...trail, index]));
              return;
            }
            if (!value || typeof value !== 'object') {
              if (typeof value === 'string') assert.equal(forbiddenValue.test(value), false, `forbidden semantic value at ${trail.join('.')}`);
              return;
            }
            for (const [key, item] of Object.entries(value)) {
              assert.equal(forbiddenKey.test(key), false, `forbidden semantic key ${[...trail, key].join('.')}`);
              inspect(item, [...trail, key]);
            }
          };
          for (const path of [
            `${root}/source-lock.v1.json`,
            `${root}/component-composition-graph.v1.json`,
            ...contracts.map((name) => `${root}/archetype-contracts/${name}`),
          ]) inspect(JSON.parse(readFileSync(path, 'utf8')), [path]);

          const plan = JSON.parse(readFileSync(`${root}/penpot-materialization-plan.v1.json`, 'utf8'));
          assert.equal(plan.materialization_scope, 'ui_only');
          assert.equal(plan.owner_pages.length, 17);
          for (const page of plan.owner_pages) {
            assert.ok(page.foundations.length >= 3, `${page.owner_page_key} lacks observed foundations`);
            assert.ok(page.visual_patterns.length > 0, `${page.owner_page_key} lacks real visual patterns`);
            for (const viewport of ['desktop', 'mobile']) {
              assert.ok(page.compositions[viewport].branch_ids.length > 0, `${page.owner_page_key}/${viewport} lacks a real responsive branch`);
              assert.ok(page.compositions[viewport].region_ids.length > 0, `${page.owner_page_key}/${viewport} lacks real semantic regions`);
            }
          }
          console.log(JSON.stringify({ status: 'PASS', contracts: contracts.length, owner_pages: plan.owner_pages.length, strict_semantic_boundary: true, real_compositions: true }, null, 2));
          NODE

      - name: Prove current latest parent and conflict-free merge tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          latest_parent="$(git rev-parse "origin/${BASE_BRANCH}")"
          git merge-base --is-ancestor "$latest_parent" HEAD
          test "$(git rev-list --count HEAD..origin/${BASE_BRANCH})" = 0
          test "$(node -p "JSON.parse(require('fs').readFileSync('catalog/global-archetype-sot-v1/manifest.v1.json','utf8')).corrective_parent_sha")" = "$latest_parent"
          git merge-tree --write-tree HEAD "origin/${BASE_BRANCH}" >/dev/null

      - name: Require the one final Draft PR to be mergeable
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          prs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls?state=open&head=onedayonemasterpiece:${TARGET_BRANCH}&base=${BASE_BRANCH}&per_page=100")"
          test "$(printf '%s' "$prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 1
          number="$(printf '%s' "$prs" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["number"])')"
          for attempt in $(seq 1 30); do
            pr="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls/${number}")"
            draft="$(printf '%s' "$pr" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["draft"]).lower())')"
            base="$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])')"
            mergeable="$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["mergeable"])')"
            test "$draft" = true
            test "$base" = "$BASE_BRANCH"
            if [[ "$mergeable" = True ]]; then
              echo "Draft PR #${number}: mergeable=true"
              exit 0
            fi
            if [[ "$mergeable" = False ]]; then
              echo "Draft PR #${number}: mergeable=false" >&2
              exit 1
            fi
            sleep 2
          done
          echo "GitHub did not resolve mergeability for Draft PR #${number}" >&2
          exit 1
