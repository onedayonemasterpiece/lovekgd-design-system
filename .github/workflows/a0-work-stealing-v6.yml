name: A0 work-stealing v6 bounded compile

on:
  push:
    branches:
      - a0/asp-production-conveyor-20260831
    paths:
      - tools/.a0_v6_chunks/**
      - .github/workflows/a0-work-stealing-v6.yml

permissions:
  contents: write

concurrency:
  group: a0-work-stealing-v6
  cancel-in-progress: false

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/asp-production-conveyor-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Reconstruct and compile bounded A0 repair and independent adapters
        run: |
          cat tools/.a0_v6_chunks/*.b64 > tools/a0_compile_work_stealing_v6.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('tools/a0_compile_work_stealing_v6.py')
          data = path.read_bytes()
          replacements = [
              (b')archetype_id] for x in CONTRACT_FILES]', b')["archetype_id"] for x in CONTRACT_FILES]'),
              (b'REUSE_CANNICAL_DATA', b'REUSE_CANONICAL_DATA'),
              (b'adapter_record_sha2556', b'adapter_record_sha256'),
              (b"),'focus page omission')\n    (lambda", b"),'focus page omission'),\n    (lambda"),
          ]
          for old, new in replacements:
              if old not in data:
                  raise SystemExit(f'missing expected transient corruption: {old!r}')
              data = data.replace(old, new, 1)
          path.write_bytes(data)
          print({'patched_sha256': hashlib.sha256(data).hexdigest()})
          PY
          python -m py_compile tools/a0_compile_work_stealing_v6.py
          python tools/a0_compile_work_stealing_v6.py
      - name: Re-run repository-relevant A0 tests
        run: |
          python tests/asp_production_conveyor_v3_a0_bundle_test.py
          python tests/asp_production_conveyor_v3_a0_candidate_adapters_test.py
          python tests/asp_production_conveyor_v3_a0_phase2_test.py
          python tests/asp_production_conveyor_v3_a0_wave2_source_fidelity_test.py
          python -m py_compile tests/asp_production_conveyor_v3_a0_*_test.py
          git diff --check
      - name: Commit persistent result and remove transient runner
        run: |
          rm -rf tools/a0_compile_work_stealing_v6.py tools/.a0_v6_chunks .github/workflows/a0-work-stealing-v6.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(a0): repair wave2 and publish work-stealing adapters"
          git push origin HEAD:a0/asp-production-conveyor-20260831
