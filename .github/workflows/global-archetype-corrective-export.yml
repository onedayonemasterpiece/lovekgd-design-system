name: Export corrective Git inputs

on:
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-corrective-20260824-r4
          path: current
          fetch-depth: 1

      - name: Checkout proven corrective staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-corrective-20260824
          path: staging
          fetch-depth: 1

      - name: Package Git inputs
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/global-archetype-corrective-git-inputs.tar.gz" \
            current/.github/workflows/global-archetype-corrective.yml \
            current/.github/workflows/global-archetype-corrective-materialize.yml \
            staging/catalog/global-archetype-sot-v1 \
            staging/scripts/global-archetype-sot-v1 \
            staging/tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          sha256sum "$RUNNER_TEMP/global-archetype-corrective-git-inputs.tar.gz" > "$RUNNER_TEMP/global-archetype-corrective-git-inputs.sha256"

      - name: Upload Git inputs
        uses: actions/upload-artifact@v4
        with:
          name: global-archetype-corrective-git-inputs
          path: |
            ${{ runner.temp }}/global-archetype-corrective-git-inputs.tar.gz
            ${{ runner.temp }}/global-archetype-corrective-git-inputs.sha256
          if-no-files-found: error
          retention-days: 3
