name: Finalize global archetype SoT v1

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-20260824-r4
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823

permissions:
  actions: read
  contents: write

concurrency:
  group: global-archetype-sot-v1-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 149cc9c56a1245e846c1abc614723078c3417cb7
      TARGET_BRANCH: feature/global-archetype-sot-v1-20260824-r4
      VERIFIED_ARTIFACT_ID: '9516848991'
      VERIFIED_TARBALL_SHA256: 2e76f651d38a8d9a81d53b67f802964fec0dc6a5c94e3d5e5f8fbdc4eb913871
    steps:
      - name: Checkout actual child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-20260824-r4
          fetch-depth: 0

      - name: Detect final SoT
        id: state
        shell: bash
        run: |
          if [[ -f catalog/global-archetype-sot-v1/route-archetype-registry.v1.json ]]; then
            echo 'materialized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialized=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize verified result
        if: steps.state.outputs.materialized == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          artifact_zip="$RUNNER_TEMP/global-archetype-sot-v1-final.zip"
          artifact_dir="$RUNNER_TEMP/global-archetype-sot-v1-final"
          mkdir -p "$artifact_dir"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          tarball="$artifact_dir/global-archetype-sot-v1-final.tar.gz"
          printf '%s  %s\n' "$VERIFIED_TARBALL_SHA256" "$tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C .
          rm -rf .bootstrap
          rm -f .github/workflows/global-archetype-sot-v1.yml
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('catalog/global-archetype-sot-v1/README.md'),
              Path('scripts/global-archetype-sot-v1/build.mjs'),
          ):
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Build and validate fail closed
        if: steps.state.outputs.materialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/global-archetype-sot-v1/build.mjs
          node --check scripts/global-archetype-sot-v1/validate.mjs
          node scripts/global-archetype-sot-v1/build.mjs
          node scripts/global-archetype-sot-v1/validate.mjs
          node tests/global-archetype-sot-v1.test.mjs
          git diff --check

      - name: Commit final SoT paths
        if: steps.state.outputs.materialized == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf node_modules
          git add -- \
            catalog/global-archetype-sot-v1 \
            scripts/global-archetype-sot-v1 \
            scripts/reconstruction-atlas/build-global-archetype-sot.mjs \
            tests/global-archetype-sot-v1.test.mjs
          git add -u -- .bootstrap
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --cached --name-only | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'global-archetype-sot-bot'
          git config user.email 'global-archetype-sot-bot@users.noreply.github.com'
          git commit -m 'feat(ds): assemble global archetype SoT v1'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
