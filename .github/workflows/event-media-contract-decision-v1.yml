name: Audit Frozen Event Media Contract Decision v1

on:
  push:
    paths:
      - '.github/workflows/event-media-contract-decision-v1.yml'
  pull_request:
    paths:
      - '.github/workflows/event-media-contract-decision-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-media-contract-decision-v1-frozen-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  EVENT_MEDIA_FROZEN_SHA: '20eab45534e2c64497e4db661e6a5ca8582229ea'
  EVENT_MEDIA_EVENTS_SHA: '66bc0d43e36299417626f992021cfb7299ddf704'

jobs:
  audit-frozen-pr32:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact audited PR 32 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EVENT_MEDIA_FROZEN_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          check-latest: false
      - name: Set up exact Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Install exact schema runtime
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Materialize full pinned events ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_MEDIA_FROZEN_SHA"
          events="$RUNNER_TEMP/events-bot-new"
          git init "$events"
          git -C "$events" remote add origin https://github.com/onedayonemasterpiece/events-bot-new.git
          git -C "$events" fetch --no-tags origin "$EVENT_MEDIA_EVENTS_SHA"
          git -C "$events" checkout --detach FETCH_HEAD
          test ! -f "$events/.git/shallow"
          test "$(git -C "$events" rev-parse HEAD)" = "$EVENT_MEDIA_EVENTS_SHA"
          echo "EVENT_MEDIA_EVENTS_ROOT=$events" >> "$GITHUB_ENV"
      - name: Validate unchanged frozen schemas receipt and mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-event-media-contract-decision-schemas-v1.py --root .
          node scripts/validate-event-media-contract-decision-v1.mjs --root . --events-repo "$EVENT_MEDIA_EVENTS_ROOT"
          node scripts/build-event-media-contract-decision-v1-receipt.mjs --root . --events-repo "$EVENT_MEDIA_EVENTS_ROOT"
          node tests/event-media-contract-decision-v1-negative.mjs
          node tests/event-media-contract-decision-v1-workflow-path-filters.mjs
          test -z "$(git status --porcelain)"
