name: Penpot review plugin 002A contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'prototypes/penpot-review-plugin-002a/**'
      - '.github/workflows/penpot-review-plugin-002a-smoke.yml'
  pull_request:
    paths:
      - 'prototypes/penpot-review-plugin-002a/**'
      - '.github/workflows/penpot-review-plugin-002a-smoke.yml'

permissions:
  contents: read

concurrency:
  group: penpot-review-plugin-002a-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate plugin and UI syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check prototypes/penpot-review-plugin-002a/dist/plugin.js
          node prototypes/penpot-review-plugin-002a/scripts/validate.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('prototypes/penpot-review-plugin-002a/dist/ui.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/u);
          if (!match) throw new Error('inline UI script missing');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/penpot-002a-ui.js', match[1]);
          NODE
          node --check "${RUNNER_TEMP}/penpot-002a-ui.js"

      - name: Verify live catalog and immutable SVG
        shell: bash
        run: |
          set -euo pipefail
          catalog_url='https://raw.githack.com/onedayonemasterpiece/lovekgd-design-system/penpot-catalog-live/prototypes/penpot-review-plugin-002a/catalog/catalog.json'
          mkdir -p "${RUNNER_TEMP}/penpot-002a"

          fetch_asset() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 45 \
                --output "$output" "${url}?ci=${GITHUB_RUN_ID}-${attempt}"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          fetch_asset "$catalog_url" "${RUNNER_TEMP}/penpot-002a/catalog.json"
          artifact_url="$(node -e "const c=require(process.argv[1]); process.stdout.write(c.elements[0].artifact.url)" "${RUNNER_TEMP}/penpot-002a/catalog.json")"
          fetch_asset "$artifact_url" "${RUNNER_TEMP}/penpot-002a/specimen.svg"

          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const root = process.env.RUNNER_TEMP + '/penpot-002a';
          const catalog = JSON.parse(fs.readFileSync(root + '/catalog.json', 'utf8'));
          const svg = fs.readFileSync(root + '/specimen.svg', 'utf8').replaceAll('\r\n', '\n');
          if (catalog.schemaVersion !== 2) throw new Error('catalog schema');
          if (catalog.catalogRevision !== '002a-r1') throw new Error('unexpected catalog revision');
          if (catalog.elements[0].version !== '0.0.2') throw new Error('unexpected element version');
          const hash = crypto.createHash('sha256').update(svg, 'utf8').digest('hex');
          if (hash !== catalog.elements[0].artifact.sha256) throw new Error(`artifact hash mismatch: ${hash}`);
          if (!svg.includes('core.button.smoke') || !svg.includes('LIVE CATALOG')) throw new Error('specimen contract');
          console.log(JSON.stringify({status:'PASS', catalogRevision:catalog.catalogRevision, version:catalog.elements[0].version, hash}));
          NODE
