name: Figma Community direct inspection

on:
  push:
    branches:
      - research/consta-documentation-patterns-20260819-review
    paths:
      - '.github/workflows/figma-community-inspection.yml'
      - 'scripts/research/inspect_figma_community_archive.py'
      - 'scripts/research/capture_grida_community_viewer.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/figma-community-inspection.yml'
      - 'scripts/research/inspect_figma_community_archive.py'
      - 'scripts/research/capture_grida_community_viewer.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe archived public Community snapshots
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .tmp/figma-community
          : > .tmp/figma-community/available-ids.txt
          : > .tmp/figma-community/status.tsv
          for id in 1144567424019815189 1509554620086084342; do
            dir=".tmp/figma-community/${id}"
            mkdir -p "$dir"
            meta_url="https://figma-community-files.s3.us-west-1.amazonaws.com/${id}/meta.json"
            file_url="https://figma-community-files.s3.us-west-1.amazonaws.com/${id}/file.json.gz"
            export_url="https://figma-community-images.s3.us-west-1.amazonaws.com/${id}/exports/meta.json"
            meta_status=$(curl --location --silent --show-error --output "$dir/meta.json" --write-out '%{http_code}' "$meta_url" || true)
            file_status=$(curl --location --silent --show-error --output "$dir/file.json.gz" --write-out '%{http_code}' "$file_url" || true)
            export_status=$(curl --location --silent --show-error --output "$dir/exports-meta.json" --write-out '%{http_code}' "$export_url" || true)
            available=false
            if [ "$file_status" = "200" ] && [ -s "$dir/file.json.gz" ]; then
              available=true
              echo "$id" >> .tmp/figma-community/available-ids.txt
            fi
            if [ "$export_status" != "200" ]; then
              printf '{"map":{}}\n' > "$dir/exports-meta.json"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$meta_status" "$file_status" "$export_status" "$available" \
              >> .tmp/figma-community/status.tsv
          done
          python - <<'PY'
          import json
          from pathlib import Path
          files = {}
          for line in Path('.tmp/figma-community/status.tsv').read_text().splitlines():
              file_id, meta_http, file_http, exports_http, available = line.split('\t')
              files[file_id] = {
                  'meta_http': meta_http,
                  'file_http': file_http,
                  'exports_http': exports_http,
                  'available': available == 'true',
              }
          Path('.tmp/figma-community/download-status.json').write_text(
              json.dumps({'files': files}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({'files': files}, ensure_ascii=False, indent=2))
          PY

      - name: Inspect archive nodes when available
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r id; do
            [ -n "$id" ] && args+=(--file-id "$id")
          done < .tmp/figma-community/available-ids.txt
          mkdir -p .tmp/figma-community-inspection
          cp .tmp/figma-community/download-status.json .tmp/figma-community-inspection/download-status.json
          if [ ${#args[@]} -gt 0 ]; then
            python scripts/research/inspect_figma_community_archive.py \
              --input .tmp/figma-community \
              --output .tmp/figma-community-inspection \
              "${args[@]}"
          else
            printf '# Figma Community archive probe\n\nBoth legacy public archive objects are currently unavailable. See `download-status.json`.\n' \
              > .tmp/figma-community-inspection/index.md
          fi

      - name: Install read-only browser probe
        run: |
          python -m pip install --disable-pip-version-check selenium
          google-chrome --version || chromium --version
          chromedriver --version || true

      - name: Capture rendered public viewers and network responses
        run: |
          python scripts/research/capture_grida_community_viewer.py \
            --seconds 55 \
            --output .tmp/grida-viewer-capture \
            --url https://code.grida.co/community/file/1144567424019815189 \
            --url https://code.grida.co/community/file/1509554620086084342

      - name: Summarize browser evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.tmp/grida-viewer-capture')
          report = {'files': {}}
          for directory in sorted(p for p in root.iterdir() if p.is_dir()):
              body = (directory / 'body-text.txt').read_text(encoding='utf-8', errors='replace')
              responses = json.loads((directory / 'network-responses.json').read_text(encoding='utf-8'))
              candidates = [r for r in responses if r.get('interesting')]
              saved = [r for r in candidates if r.get('saved_body')]
              report['files'][directory.name] = {
                  'body_preview': body[:1000],
                  'response_count': len(responses),
                  'interesting_response_count': len(candidates),
                  'saved_response_bodies': len(saved),
                  'candidate_urls': [r.get('url') for r in candidates[:100]],
              }
          (root / 'capture-summary.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          lines = ['# Grida Community viewer capture', '']
          for file_id, data in report['files'].items():
              lines += [
                  f'## {file_id}', '',
                  f"- network responses: {data['response_count']}",
                  f"- interesting responses: {data['interesting_response_count']}",
                  f"- saved response bodies: {data['saved_response_bodies']}",
                  '', '```text', data['body_preview'], '```', '',
              ]
          (root / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Validate generated evidence envelope
        shell: bash
        run: |
          set -euo pipefail
          test -s .tmp/figma-community-inspection/index.md
          test -s .tmp/figma-community-inspection/download-status.json
          test -s .tmp/grida-viewer-capture/capture-summary.json
          test -s .tmp/grida-viewer-capture/1144567424019815189/viewport.png
          test -s .tmp/grida-viewer-capture/1509554620086084342/viewport.png

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: figma-community-direct-inspection
          path: |
            .tmp/figma-community-inspection
            .tmp/grida-viewer-capture
          if-no-files-found: error
          retention-days: 14
