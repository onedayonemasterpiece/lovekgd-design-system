name: F0 typography self-contained plugin bundle repair

on:
  push:
    branches:
      - f0/self-contained-plugin-bundle-final-builder-20260902
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: f0-self-contained-plugin-bundle-final-builder-20260902
  cancel-in-progress: false

jobs:
  repair-typography:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact repair builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config --global user.name "F0 Plugin Bundle Builder"
          git config --global user.email "f0-plugin-bundle-builder@users.noreply.github.com"

      - name: Expand and verify typography repair
        run: |
          gzip -dc tools/f0-self-contained-bundles/build-self-contained-plugin-bundles-typography-repair.mjs.gz > /tmp/build-self-contained-plugin-bundles-typography-repair.mjs
          test "$(sha256sum tools/f0-self-contained-bundles/build-self-contained-plugin-bundles-typography-repair.mjs.gz | cut -d' ' -f1)" = "ddce10566c540edc2e2592548aa28c84d957d6fea46312c3db39eababb9d538a"
          node --check /tmp/build-self-contained-plugin-bundles-typography-repair.mjs

      - name: Convert and publish both Typography bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: node /tmp/build-self-contained-plugin-bundles-typography-repair.mjs

      - name: Upload exact seven-package proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-self-contained-plugin-bundle-results-typography-repair
          path: artifacts/f0-self-contained-plugin-bundle-results.json
          if-no-files-found: warn
