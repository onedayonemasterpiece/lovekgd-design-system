name: Product Atlas 001 contract smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/product-atlas-001.plugin.json'
      - 'docs/product-atlas-penpot-extension.md'
      - 'prototypes/penpot-product-atlas-001/**'
      - '.github/workflows/penpot-product-atlas-001-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'contracts/product-atlas-001.plugin.json'
      - 'docs/product-atlas-penpot-extension.md'
      - 'prototypes/penpot-product-atlas-001/**'
      - '.github/workflows/penpot-product-atlas-001-smoke.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate separate Product Atlas plugin
        shell: bash
        run: |
          set -euo pipefail
          node --check prototypes/penpot-product-atlas-001/dist/plugin.js
          node prototypes/penpot-product-atlas-001/scripts/validate.mjs
          python -m json.tool contracts/product-atlas-001.plugin.json >/dev/null
          python -m json.tool prototypes/penpot-product-atlas-001/dist/manifest.json >/dev/null
          python -m json.tool prototypes/penpot-product-atlas-001/catalog/catalog.json >/dev/null
