name: A0 page-wave bootstrap
on:
  push:
    branches:
      - a0/asp-penpot-page-wave-v1-20260901
permissions:
  contents: write
concurrency:
  group: a0-page-wave-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand exact A0 page-wave payload
        shell: bash
        run: |
          set -euo pipefail
          cat .a0-page-wave-bootstrap.part{01..16} | base64 -d > /tmp/a0-page-wave.tar.gz
          echo '785e2d33886959b5b648f1580a796b508a5e1166bad6c9af19941c3aea6b8bcc  /tmp/a0-page-wave.tar.gz' | sha256sum -c -
          tar -xzf /tmp/a0-page-wave.tar.gz
      - name: Fresh-checkout unit tests
        run: node --test tests/asp-production-conveyor-v3/a0/page-wave-v1/page-wave.test.js
      - name: Publish generated page wave
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'a0-page-wave-bot'
          git config user.email 'a0-page-wave-bot@users.noreply.github.com'
          git add catalog/asp-production-conveyor-v3/a0/page-wave-v1 scripts/asp-production-conveyor-v3/a0/page-wave-v1 tests/asp-production-conveyor-v3/a0/page-wave-v1/page-wave.test.js
          if git diff --cached --quiet; then
            echo 'Payload already published.'
            exit 0
          fi
          git commit -m 'feat(a0): publish 18 small-page native executor units'
          git push origin "HEAD:${GITHUB_REF_NAME}"
