name: Validate global archetype corrective delta

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-corrective-20260824
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823
    paths:
      - 'catalog/global-archetype-sot-v1/**'
      - 'scripts/global-archetype-sot-v1/**'
      - 'tests/global-archetype-sot-v1-semantic-completeness.test.mjs'
      - '.github/workflows/global-archetype-corrective-validate.yml'

permissions:
  contents: read

concurrency:
  group: global-archetype-corrective-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout corrective child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Checkout locked Astro source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
          path: .astro-source
          sparse-checkout: |
            site/src
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Verify actual latest feature parent is included
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/date-listing-shell-v1-20260823
          latest_parent="$(git rev-parse origin/feature/date-listing-shell-v1-20260823)"
          git merge-base --is-ancestor "$latest_parent" HEAD
          test "$(git rev-list --count HEAD..origin/feature/date-listing-shell-v1-20260823)" = 0
          manifest_parent="$(node -p "JSON.parse(require('fs').readFileSync('catalog/global-archetype-sot-v1/manifest.v1.json','utf8')).corrective_parent_sha")"
          test "$manifest_parent" = "$latest_parent"

      - name: Run evidence-bound semantic completeness gates
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          node tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          git diff --check

      - name: Prove protected and unrelated parent work is untouched
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse origin/feature/date-listing-shell-v1-20260823)"
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --name-only "$parent"...HEAD | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          if git diff --name-only "$parent"...HEAD -- docs AGENTS.md receipts/penpot | grep -q .; then
            echo 'Operating docs or unrelated Visual Reconstruction work changed' >&2
            exit 1
          fi

      - name: Print final corrective manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = 'catalog/global-archetype-sot-v1';
          const manifest = JSON.parse(readFileSync(`${root}/manifest.v1.json`, 'utf8'));
          const receipt = JSON.parse(readFileSync(`${root}/corrective-receipt.v1.json`, 'utf8'));
          const hashes = JSON.parse(readFileSync(`${root}/sha256-manifest.v1.json`, 'utf8'));
          console.log(JSON.stringify({
            status: 'PASS',
            corrective_parent_sha: manifest.corrective_parent_sha,
            astro_commit: manifest.astro_commit,
            route_registry: manifest.route_registry,
            changed_contracts: receipt.changed_contracts,
            high_risk_state_evidence: receipt.high_risk_state_evidence,
            component_identity_gate: receipt.component_identity_gate,
            sha256_manifest_file_count: Object.keys(hashes.files).length,
          }, null, 2));
          NODE
