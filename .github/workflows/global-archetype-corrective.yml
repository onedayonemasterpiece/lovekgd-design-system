name: Global archetype evidence-bound corrective delta

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-corrective-20260824-r4
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823
    paths:
      - 'catalog/global-archetype-sot-v1/**'
      - 'scripts/global-archetype-sot-v1/**'
      - 'tests/global-archetype-sot-v1-*.test.mjs'
      - '.github/workflows/global-archetype-corrective.yml'

permissions:
  contents: write

concurrency:
  group: global-archetype-corrective-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_SHA: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
      TARGET_BRANCH: feature/global-archetype-sot-v1-corrective-20260824-r4
      BOOTSTRAP_BRANCH: feature/global-archetype-sot-v1-corrective-20260824
    steps:
      - name: Checkout clean corrective child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve and prove actual latest feature parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/date-listing-shell-v1-20260823
          parent="$(git rev-parse origin/feature/date-listing-shell-v1-20260823)"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-list --count HEAD..origin/feature/date-listing-shell-v1-20260823)" = 0
          echo "BASE_SHA=$parent" >> "$GITHUB_ENV"
          echo "Actual parent: $parent"

      - name: Checkout locked Astro source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
          path: .astro-source
          sparse-checkout: |
            site/src
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Bootstrap proven corrective builder only when absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/global-archetype-sot-v1/build-corrective.py || ! -f tests/global-archetype-sot-v1-semantic-completeness.test.mjs ]]; then
            git fetch origin "$BOOTSTRAP_BRANCH"
            mkdir -p scripts/global-archetype-sot-v1 tests
            git show "origin/${BOOTSTRAP_BRANCH}:scripts/global-archetype-sot-v1/build-corrective.py" > scripts/global-archetype-sot-v1/build-corrective.py
            git show "origin/${BOOTSTRAP_BRANCH}:tests/global-archetype-sot-v1-semantic-completeness.test.mjs" > tests/global-archetype-sot-v1-semantic-completeness.test.mjs
            chmod +x scripts/global-archetype-sot-v1/build-corrective.py tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          fi

      - name: Remove design-tool evidence from semantic generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/global-archetype-sot-v1/build-corrective.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'reconciliation_receipt = ROOT / "receipts/penpot/[^"]+"\nreconciliation_ok = reconciliation_receipt\.exists\(\) and load\(reconciliation_receipt\)\.get\("status"\) == "PASS"\n'
          )
          replacement = 'reconciliation_receipt = PKG / "reconciliation-proofs.v1.json"\nreconciliation_ok = False\n'
          if 'receipts/penpot/' in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('design-tool reconciliation source was not replaced exactly once')
          if 'materialization-ir.v1.json' in text or 'receipts/penpot/' in text:
              raise SystemExit('semantic generator still references a forbidden design-tool input')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Write deterministic semantic hardener
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/global-archetype-sot-v1/harden-corrective.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from typing import Any, Iterable

          ROOT = Path(__file__).resolve().parents[2]
          PKG = ROOT / "catalog/global-archetype-sot-v1"
          CONTRACT_ROOT = PKG / "archetype-contracts"
          ATLAS = ROOT / "catalog/reconstruction-atlas/v1"
          ASTRO_ROOT = Path(os.environ.get("EVENTS_BOT_ROOT", ROOT / ".astro-source")).resolve()
          BASE_SHA = os.environ["BASE_SHA"]
          ASTRO_SHA = os.environ.get("ASTRO_SHA", "7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00")
          LOCK_ID = f"global-archetype-sot-v1.corrective.{BASE_SHA[:12]}.{ASTRO_SHA[:12]}"
          ASTRO_REPOSITORY = "onedayonemasterpiece/events-bot-new"

          def load(path: Path) -> Any:
              return json.loads(path.read_text(encoding="utf-8"))

          def dump(path: Path, value: Any, *, sort_keys: bool = False) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=sort_keys) + "\n", encoding="utf-8")

          def sha_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def sha_file(path: Path) -> str:
              return sha_bytes(path.read_bytes())

          def rel(path: Path) -> str:
              return path.resolve().relative_to(ROOT.resolve()).as_posix()

          def walk_objects(value: Any) -> Iterable[dict[str, Any]]:
              if isinstance(value, dict):
                  yield value
                  for item in value.values():
                      yield from walk_objects(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk_objects(item)

          def walk_values(value: Any, parts: list[str | int] | None = None) -> Iterable[tuple[list[str | int], Any]]:
              parts = parts or []
              yield parts, value
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield from walk_values(item, parts + [key])
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from walk_values(item, parts + [index])

          def pointer(parts: list[str | int]) -> str:
              return "/" + "/".join(str(item).replace("~", "~0").replace("/", "~1") for item in parts)

          def strip_design_tool_fields(value: Any) -> Any:
              if isinstance(value, dict):
                  cleaned: dict[str, Any] = {}
                  for key, item in value.items():
                      lowered = key.lower()
                      if "penpot" in lowered or "renderer_delta" in lowered or "materialization_ir" in lowered:
                          continue
                      cleaned[key] = strip_design_tool_fields(item)
                  return cleaned
              if isinstance(value, list):
                  return [strip_design_tool_fields(item) for item in value]
              if isinstance(value, str) and ("/penpot/" in value.lower() or "materialization-ir" in value.lower()):
                  return None
              return value

          source_root = ASTRO_ROOT / "site/src"
          if not source_root.is_dir():
              source_root = ASTRO_ROOT / "src"
          if not source_root.is_dir():
              raise SystemExit(f"Astro source root missing: {ASTRO_ROOT}")
          source_extensions = {".astro", ".ts", ".tsx", ".js", ".mjs", ".css", ".scss", ".json"}
          source_files: list[Path] = []
          source_lines: dict[Path, list[str]] = {}
          for path in sorted(source_root.rglob("*")):
              if path.is_file() and path.suffix.lower() in source_extensions:
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except UnicodeDecodeError:
                      continue
                  source_files.append(path)
                  source_lines[path] = lines

          def exact_ref(path: Path, line_number: int, evidence_id: str) -> dict[str, Any]:
              lines = source_lines[path]
              line_number = max(1, min(line_number, len(lines) or 1))
              line = lines[line_number - 1] if lines else ""
              return {
                  "repository": ASTRO_REPOSITORY,
                  "commit": ASTRO_SHA,
                  "path": path.resolve().relative_to(ASTRO_ROOT).as_posix(),
                  "line_start": line_number,
                  "line_end": line_number,
                  "evidence_id": evidence_id,
                  "line_sha256": sha_bytes(line.encode("utf-8")),
              }

          def find_exact(patterns: list[str], evidence_id: str, path_terms: list[str] | None = None) -> list[dict[str, Any]]:
              path_terms = path_terms or []
              candidates = [path for path in source_files if not path_terms or any(term in path.as_posix().lower() for term in path_terms)]
              refs: list[dict[str, Any]] = []
              seen: set[tuple[str, int]] = set()
              for pattern in patterns:
                  regex = re.compile(pattern, re.IGNORECASE)
                  for path in candidates:
                      for line_number, line in enumerate(source_lines[path], start=1):
                          if not regex.search(line):
                              continue
                          key = (path.as_posix(), line_number)
                          if key in seen:
                              continue
                          seen.add(key)
                          refs.append(exact_ref(path, line_number, evidence_id))
              return refs

          registry_path = PKG / "route-archetype-registry.v1.json"
          graph_path = PKG / "component-composition-graph.v1.json"
          handoff_path = PKG / "handoff-lock.v1.json"
          proof_path = PKG / "byte-equality-proof.v1.json"
          source_lock_path = PKG / "source-lock.v1.json"
          plan_path = PKG / "penpot-materialization-plan.v1.json"
          manifest_path = PKG / "manifest.v1.json"
          receipt_path = PKG / "corrective-receipt.v1.json"
          reconciliation_path = PKG / "reconciliation-proofs.v1.json"
          sha_manifest_path = PKG / "sha256-manifest.v1.json"

          handoff = load(handoff_path)
          expected_registry_hash = handoff["approved_outputs"]["route_archetype_registry"]["sha256"]
          if sha_file(registry_path) != expected_registry_hash:
              raise SystemExit("route registry lost byte equality")
          equality_proof = load(proof_path)
          if equality_proof.get("status") != "PASS" or not all(equality_proof.get("equality", {}).values()):
              raise SystemExit("baseline handoff equality proof is not PASS")

          social_refs = find_exact(
              [r"event-signal--like", r"ke-listing-card__social-proof"],
              "reconciliation:social-proof.like",
              ["event", "listing", "rail", "card"],
          )
          social_by_path: dict[str, list[dict[str, Any]]] = {}
          for item in social_refs:
              social_by_path.setdefault(item["path"], []).append(item)
          social_identities = [
              {"source_identity_id": f"source-path:{path}", "source_refs": refs}
              for path, refs in sorted(social_by_path.items())
          ]
          social_status = "PASS" if len(social_identities) >= 2 else "UNRESOLVED"
          reconciliation = {
              "schema_version": "global-archetype-semantic-reconciliation-proofs.v1",
              "source_lock_id": LOCK_ID,
              "proofs": [
                  {
                      "semantic_component_id": "social-proof.like",
                      "status": social_status,
                      "basis": "verified handoff component identity plus exact pinned Astro source identities",
                      "baseline_component_graph_sha256": equality_proof["actual"]["component_composition_graph"],
                      "source_identities": social_identities,
                      "unresolved_reason": None if social_status == "PASS" else "fewer than two exact source identities were observed",
                  }
              ],
          }
          dump(reconciliation_path, reconciliation, sort_keys=True)

          graph = strip_design_tool_fields(load(graph_path))
          graph_nodes = graph.get("nodes", [])
          graph_index: dict[str, dict[str, Any]] = {}
          gate_summary = {"reuse_or_new": 0, "proven": 0, "unresolved": 0, "reconciled_aliases": 0}

          def node_id(node: dict[str, Any]) -> str:
              return str(node.get("component_id") or node.get("id") or node.get("node_id") or "")

          for node in graph_nodes:
              if not isinstance(node, dict):
                  continue
              component_id = node_id(node)
              if not component_id:
                  continue
              baseline = node.get("baseline_disposition") or node.get("disposition")
              identities = node.get("source_identity_contract", []) if isinstance(node.get("source_identity_contract"), list) else []
              identities = [item for item in identities if isinstance(item, dict)]
              for item in identities:
                  item["source_refs"] = [ref for ref in item.get("source_refs", []) if isinstance(ref, dict) and ref.get("repository") == ASTRO_REPOSITORY and ref.get("path")]

              if "social-proof.like" in component_id and social_status == "PASS":
                  identities = social_identities
                  effective = baseline if baseline in {"reuse_existing", "new_component"} else "reuse_existing"
                  proof_ref = rel(reconciliation_path)
              else:
                  proof_ref = None
                  effective = baseline
                  multiple = len(identities) > 1
                  exact = bool(identities) and all(item.get("source_refs") for item in identities)
                  if baseline in {"reuse_existing", "new_component"} and (not exact or multiple):
                      effective = "unresolved"

              if baseline in {"reuse_existing", "new_component"}:
                  gate_summary["reuse_or_new"] += 1
              if effective in {"reuse_existing", "new_component"}:
                  gate_summary["proven"] += 1
              if effective == "unresolved":
                  gate_summary["unresolved"] += 1
              if proof_ref:
                  gate_summary["reconciled_aliases"] += 1

              exact = bool(identities) and all(item.get("source_refs") for item in identities)
              reason = None
              if effective == "unresolved":
                  reason = "multiple_source_identities_without_semantic_reconciliation" if len(identities) > 1 else "missing_exact_astro_source_identity_refs"
              node["baseline_disposition"] = baseline
              node["disposition"] = effective
              node["source_identity_contract"] = identities
              node["identity_gate"] = {
                  "status": "PASS" if effective in {"reuse_existing", "new_component"} else "UNRESOLVED" if effective == "unresolved" else "NOT_APPLICABLE",
                  "source_identity_count": len(identities),
                  "all_identities_have_exact_source_refs": exact,
                  "reconciliation_proof_ref": proof_ref,
                  "reason": reason,
              }
              graph_index[component_id] = node

          graph["corrective_source_lock_id"] = LOCK_ID
          graph["identity_gate_summary"] = gate_summary
          dump(graph_path, graph)

          foundations_path = ATLAS / "foundations.v1.json"
          foundations = load(foundations_path)
          aliases = {
              "color": ["color", "surface", "text"],
              "typography": ["typography", "font", "type"],
              "spacing": ["spacing", "space", "gap"],
              "radius": ["radius", "corner"],
              "shadow": ["shadow", "elevation"],
              "breakpoint": ["breakpoint", "viewport", "responsive"],
              "media": ["media", "aspect", "image"],
              "motion": ["motion", "transition", "duration"],
          }
          available_foundations: dict[str, str] = {}
          for group, terms in aliases.items():
              candidates: list[tuple[int, str]] = []
              for parts, value in walk_values(foundations):
                  haystack = "/".join(str(part) for part in parts).lower()
                  if isinstance(value, (str, int, float, bool)):
                      haystack += " " + str(value).lower()
                  if any(term in haystack for term in terms):
                      candidates.append((len(parts), pointer(parts)))
              if candidates:
                  chosen = sorted(candidates)[0][1]
                  if chosen != "/":
                      available_foundations[group] = f"catalog/reconstruction-atlas/v1/foundations.v1.json#{chosen}"

          desired_groups = {
              "artifacts": ["color", "typography", "spacing"],
              "collections": ["color", "typography", "spacing", "radius", "breakpoint"],
              "event-detail": ["color", "typography", "spacing", "radius", "shadow", "breakpoint", "media"],
              "exhibitions": ["color", "typography", "spacing", "radius", "breakpoint", "media"],
              "favorites": ["color", "typography", "spacing", "radius", "breakpoint", "motion"],
              "festivals": ["color", "typography", "spacing", "radius", "breakpoint", "media"],
              "focus-group": ["color", "typography", "spacing", "radius"],
              "home": ["color", "typography", "spacing", "radius", "shadow", "breakpoint", "media", "motion"],
              "information-pages": ["color", "typography", "spacing", "breakpoint"],
              "interest-clubs": ["color", "typography", "spacing", "radius", "breakpoint", "media"],
              "listing-date": ["color", "typography", "spacing", "radius", "breakpoint", "motion"],
              "listing-popular": ["color", "typography", "spacing", "radius", "breakpoint"],
              "listing-unusual": ["color", "typography", "spacing", "radius", "breakpoint", "media"],
              "listing-weekend": ["color", "typography", "spacing", "radius", "breakpoint", "motion"],
              "personal-feed": ["color", "typography", "spacing", "radius", "breakpoint", "motion"],
              "search": ["color", "typography", "spacing", "radius", "breakpoint", "motion"],
              "special-state": ["color", "typography", "spacing", "radius"],
          }

          contract_paths = sorted(CONTRACT_ROOT.glob("*.semantic-contract.v1.json"))
          if len(contract_paths) != 17:
              raise SystemExit(f"expected 17 contracts, got {len(contract_paths)}")
          contracts: dict[str, dict[str, Any]] = {}
          for path in contract_paths:
              slug = path.name.replace(".semantic-contract.v1.json", "")
              contract = strip_design_tool_fields(load(path))
              contract["source_lock_id"] = LOCK_ID
              groups = [group for group in desired_groups[slug] if group in available_foundations]
              if len(groups) < 3:
                  raise SystemExit(f"insufficient observed foundation groups for {slug}: {groups}")
              contract["foundations_usage"] = [
                  {
                      "foundation_group": group,
                      "source_ref": available_foundations[group],
                      "consumer_archetype": contract.get("archetype_id"),
                  }
                  for group in groups
              ]
              dependencies = contract.get("component_dependencies", []) if isinstance(contract.get("component_dependencies"), list) else []
              for dependency in dependencies:
                  if not isinstance(dependency, dict):
                      continue
                  component_id = str(dependency.get("component_id") or "")
                  source_node = graph_index.get(component_id)
                  baseline = dependency.get("baseline_disposition") or dependency.get("disposition")
                  if source_node:
                      dependency["baseline_disposition"] = baseline
                      dependency["disposition"] = source_node.get("disposition")
                      dependency["source_identity_contract"] = source_node.get("source_identity_contract", [])
                      dependency["identity_gate"] = source_node.get("identity_gate")
                  elif baseline in {"reuse_existing", "new_component"}:
                      dependency["baseline_disposition"] = baseline
                      dependency["disposition"] = "unresolved"
                      dependency["source_identity_contract"] = []
                      dependency["identity_gate"] = {"status": "UNRESOLVED", "reason": "component_missing_from_component_graph"}
              dump(path, contract)
              contracts[slug] = contract

          allowed_candidates = [
              ("semantic-atlas.v1.json", "semantic_atlas"),
              ("route-registry.v1.json", "semantic_atlas"),
              ("source-census.v1.json", "semantic_atlas"),
              ("foundations.v1.json", "foundations"),
              ("fixtures.v1.json", "fixtures"),
              ("reuse-new-map.v1.json", "semantic_atlas"),
              ("evidence/browser-observations.v1.json", "browser_computed"),
              ("evidence/generated-observations.v1.json", "generated_html"),
              ("evidence/generated-html-observations.v1.json", "generated_html"),
          ]
          design_inputs: list[dict[str, Any]] = [
              {"path": rel(handoff_path), "sha256": sha_file(handoff_path), "input_class": "verified_handoff"}
          ]
          for relative_name, input_class in allowed_candidates:
              path = ATLAS / relative_name
              if path.is_file():
                  design_inputs.append({"path": rel(path), "sha256": sha_file(path), "input_class": input_class})

          exact_paths: set[str] = set()
          for contract in contracts.values():
              for obj in walk_objects(contract):
                  refs = obj.get("source_refs") if isinstance(obj.get("source_refs"), list) else []
                  for item in refs:
                      if isinstance(item, dict) and item.get("repository") == ASTRO_REPOSITORY and item.get("path"):
                          exact_paths.add(item["path"])
          for node in graph_nodes:
              if not isinstance(node, dict):
                  continue
              for identity in node.get("source_identity_contract", []):
                  for item in identity.get("source_refs", []):
                      if isinstance(item, dict) and item.get("path"):
                          exact_paths.add(item["path"])

          astro_inputs = []
          for relative_path in sorted(exact_paths):
              path = ASTRO_ROOT / relative_path
              if path.is_file():
                  astro_inputs.append({
                      "repository": ASTRO_REPOSITORY,
                      "commit": ASTRO_SHA,
                      "path": relative_path,
                      "sha256": sha_file(path),
                      "input_class": "astro_source",
                  })

          source_lock = {
              "schema_version": "global-archetype-semantic-source-lock.v2",
              "source_lock_id": LOCK_ID,
              "corrective_parent_sha": BASE_SHA,
              "astro_commit": ASTRO_SHA,
              "semantic_boundary": "Verified handoff, pinned Astro source, generated HTML, browser-computed observations, foundations and fixtures only.",
              "allowed_input_classes": ["verified_handoff", "astro_source", "generated_html", "browser_computed", "semantic_atlas", "foundations", "fixtures"],
              "design_system_inputs": design_inputs,
              "astro_source_inputs": astro_inputs,
              "route_registry_inherited_sha256": expected_registry_hash,
              "byte_equality_proof": rel(proof_path),
          }
          dump(source_lock_path, source_lock, sort_keys=True)

          def state_strings(value: Any) -> list[str]:
              result: list[str] = []
              if isinstance(value, str):
                  result.append(value)
              elif isinstance(value, dict):
                  for key, item in value.items():
                      if key in {"state_id", "id", "state", "name"} and isinstance(item, str):
                          result.append(item)
                      else:
                          result.extend(state_strings(item))
              elif isinstance(value, list):
                  for item in value:
                      result.extend(state_strings(item))
              return result

          def item_id(item: Any, keys: list[str]) -> str | None:
              if isinstance(item, str):
                  return item
              if isinstance(item, dict):
                  for key in keys:
                      if item.get(key):
                          return str(item[key])
              return None

          high_risk = {"event-detail", "focus-group", "search", "favorites", "personal-feed"}
          forbidden_visual = ["source-state", "dashboard", "coverage", "gap", "hash", "test", "service-review", "runtime-only"]
          owner_pages = []
          for slug, contract in sorted(contracts.items()):
              dependencies = contract.get("component_dependencies", []) if isinstance(contract.get("component_dependencies"), list) else []
              ui_components = sorted({
                  str(item.get("component_id")) for item in dependencies
                  if isinstance(item, dict) and item.get("component_id") and item.get("disposition") in {"reuse_existing", "new_component"}
              })
              visual_patterns = sorted({
                  value for value in (item_id(item, ["part_id", "id", "name"]) for item in contract.get("anatomy", [])) if value
              })
              responsive = contract.get("responsive_branches", []) if isinstance(contract.get("responsive_branches"), list) else []
              desktop_ids = sorted({
                  value for item in responsive
                  if "desktop" in json.dumps(item, ensure_ascii=False).lower() or "wide" in json.dumps(item, ensure_ascii=False).lower()
                  for value in [item_id(item, ["branch_id", "id", "name", "viewport_id"])] if value
              })
              mobile_ids = sorted({
                  value for item in responsive
                  if "mobile" in json.dumps(item, ensure_ascii=False).lower() or "compact" in json.dumps(item, ensure_ascii=False).lower()
                  for value in [item_id(item, ["branch_id", "id", "name", "viewport_id"])] if value
              })
              region_ids = sorted({
                  value for value in (item_id(item, ["region_id", "id", "name"]) for item in contract.get("regions", [])) if value
              })
              if slug in high_risk:
                  visual_states = sorted({
                      row["state_id"] for row in contract.get("evidence_bound_states", [])
                      if isinstance(row, dict) and row.get("disposition") == "observed" and row.get("materialization_eligible") is True
                  })
              else:
                  visual_states = sorted(set(state_strings(contract.get("states", []))))
                  visual_states = [value for value in visual_states if not any(token in value.lower() for token in forbidden_visual)][:24]
              owner_pages.append({
                  "owner_page_key": f"owner.{slug}",
                  "archetype_id": contract.get("archetype_id"),
                  "foundations": [item["foundation_group"] for item in contract["foundations_usage"]],
                  "ui_components": ui_components,
                  "visual_patterns": visual_patterns,
                  "compositions": {
                      "desktop": {"branch_ids": desktop_ids, "region_ids": region_ids},
                      "mobile": {"branch_ids": mobile_ids, "region_ids": region_ids},
                  },
                  "visual_states": visual_states,
              })

          plan = {
              "schema_version": "global-archetype-ui-materialization-plan.v2",
              "materialization_scope": "ui_only",
              "allowed_content": ["foundations", "ui_components", "visual_patterns", "desktop_compositions", "mobile_compositions", "visual_states"],
              "forbidden_content": ["source-state indexes", "runtime dashboards", "status dashboards", "coverage dashboards", "gap dashboards", "hash dashboards", "test dashboards", "service review routes"],
              "owner_pages": owner_pages,
          }
          dump(plan_path, plan, sort_keys=True)

          receipt = load(receipt_path)
          baseline_contract_hashes = receipt["baseline_contract_hashes"]
          corrected_contract_hashes = {path.name: sha_file(path) for path in contract_paths}
          changed_contracts = [name for name in sorted(corrected_contract_hashes) if corrected_contract_hashes[name] != baseline_contract_hashes[name]]
          contract_manifest_lines = "".join(f"{corrected_contract_hashes[path.name]}  {rel(path)}\n" for path in contract_paths)
          graph_hash = sha_file(graph_path)
          observed_states = sum(
              1 for slug in high_risk for row in contracts[slug].get("evidence_bound_states", [])
              if isinstance(row, dict) and row.get("disposition") == "observed"
          )
          unresolved_states = sum(
              1 for slug in high_risk for row in contracts[slug].get("evidence_bound_states", [])
              if isinstance(row, dict) and row.get("disposition") == "unresolved"
          )

          parent_manifest_raw = subprocess.run(
              ["git", "show", f"{BASE_SHA}:catalog/global-archetype-sot-v1/manifest.v1.json"],
              cwd=ROOT,
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          parent_manifest = json.loads(parent_manifest_raw)
          manifest = dict(parent_manifest)
          baseline_approved = parent_manifest.get("approved_semantic_outputs", {})
          manifest["baseline_approved_semantic_outputs"] = baseline_approved
          corrected_approved = dict(baseline_approved)
          corrected_approved["route_archetype_registry"] = {"path": rel(registry_path), "sha256": expected_registry_hash}
          corrected_approved["component_composition_graph"] = {"path": rel(graph_path), "sha256": graph_hash}
          corrected_approved["archetype_contracts"] = {"path": rel(CONTRACT_ROOT), "count": 17, "sorted_checksum_manifest_sha256": sha_bytes(contract_manifest_lines.encode("utf-8"))}
          corrected_approved["semantic_source_lock"] = {"path": rel(source_lock_path), "sha256": sha_file(source_lock_path)}
          corrected_approved["ui_materialization_plan"] = {"path": rel(plan_path), "sha256": sha_file(plan_path)}
          corrected_approved["semantic_reconciliation_proofs"] = {"path": rel(reconciliation_path), "sha256": sha_file(reconciliation_path)}
          manifest.update({
              "schema_version": "global-archetype-sot-v1.corrective.v2",
              "status": "CORRECTIVE_CANDIDATE_READY_WITH_EXPLICIT_UNRESOLVED",
              "authority_mode": "reconstructed",
              "canonical": False,
              "corrective_parent_sha": BASE_SHA,
              "astro_commit": ASTRO_SHA,
              "source_lock_id": LOCK_ID,
              "baseline_byte_equality": {"status": "PASS", "proof": rel(proof_path)},
              "approved_semantic_outputs": corrected_approved,
              "route_registry": {"path": rel(registry_path), "sha256": expected_registry_hash, "byte_changed": False},
              "component_graph": {"path": rel(graph_path), "sha256": graph_hash, "identity_gate_summary": gate_summary},
              "contracts": {"count": 17, "sorted_checksum_manifest_sha256": sha_bytes(contract_manifest_lines.encode("utf-8")), "changed": changed_contracts},
              "high_risk_state_evidence": {"observed": observed_states, "unresolved": unresolved_states},
              "outputs": {
                  "source_lock": rel(source_lock_path),
                  "ui_materialization_plan": rel(plan_path),
                  "semantic_reconciliation_proofs": rel(reconciliation_path),
                  "corrective_receipt": rel(receipt_path),
                  "sha256_manifest": rel(sha_manifest_path),
              },
              "constraints": {"design_tool_mutation": False, "date_weekend_artifact_changes": False, "production_astro_changes": False, "merge": False, "promotion": False, "deploy": False},
          })
          pinned_inputs = dict(parent_manifest.get("pinned_inputs", {}))
          pinned_inputs.update({"design_system_commit": BASE_SHA, "astro_commit": ASTRO_SHA})
          manifest["pinned_inputs"] = pinned_inputs
          visual_materialization = dict(parent_manifest.get("visual_materialization", {}))
          visual_materialization.update({
              "status": "UI_ONLY_PLAN_READY_NOT_MATERIALIZED",
              "owner_pages_required": 17,
              "required_viewports": ["desktop", "mobile"],
              "unique_states": "only exact-source/browser-computed visible UI states",
              "plan": rel(plan_path),
          })
          manifest["visual_materialization"] = visual_materialization
          design_tool_policy = dict(parent_manifest.get("penpot_policy", {}))
          design_tool_policy.update({
              "semantic_input": False,
              "materialization_scope": "foundations, reusable UI, visual patterns, desktop/mobile compositions and visible UI states only",
          })
          manifest["penpot_policy"] = design_tool_policy
          dump(manifest_path, manifest, sort_keys=True)

          change_scope_by_file = {item["file"]: list(item.get("change_scopes", [])) for item in receipt.get("changed_contracts", [])}
          receipt.update({
              "schema_version": "global-archetype-corrective-receipt.v2",
              "status": "PASS",
              "corrective_parent_sha": BASE_SHA,
              "astro_commit": ASTRO_SHA,
              "route_registry_sha256_before_after": {"before": expected_registry_hash, "after": sha_file(registry_path), "equal": True},
              "corrected_graph_sha256": graph_hash,
              "corrected_contract_hashes": corrected_contract_hashes,
              "changed_contracts": [
                  {
                      "file": name,
                      "sha256": corrected_contract_hashes[name],
                      "change_scopes": sorted(set(change_scope_by_file.get(name, []) + ["consumer-specific foundations", "exact source identity gate", "design-tool-independent semantic lock"] + (["evidence-bound high-risk states"] if name.replace(".semantic-contract.v1.json", "") in high_risk else []))),
                  }
                  for name in changed_contracts
              ],
              "high_risk_state_evidence": {"observed": observed_states, "unresolved": unresolved_states},
              "component_identity_gate": gate_summary,
              "semantic_reconciliation_proofs": rel(reconciliation_path),
              "source_lock_sha256": sha_file(source_lock_path),
              "ui_materialization_plan_sha256": sha_file(plan_path),
          })
          dump(receipt_path, receipt, sort_keys=True)

          tracked = [
              registry_path,
              graph_path,
              proof_path,
              source_lock_path,
              plan_path,
              reconciliation_path,
              manifest_path,
              receipt_path,
              ROOT / "scripts/global-archetype-sot-v1/build-corrective.py",
              ROOT / "scripts/global-archetype-sot-v1/harden-corrective.py",
              ROOT / "tests/global-archetype-sot-v1-semantic-completeness.test.mjs",
              ROOT / "tests/global-archetype-sot-v1-corrective-boundaries.test.mjs",
          ] + contract_paths
          sha_manifest = {
              "schema_version": "global-archetype-corrective-sha256-manifest.v2",
              "corrective_parent_sha": BASE_SHA,
              "astro_commit": ASTRO_SHA,
              "files": {rel(path): sha_file(path) for path in tracked if path.exists()},
              "contract_directory_sorted_manifest_sha256": sha_bytes(contract_manifest_lines.encode("utf-8")),
          }
          dump(sha_manifest_path, sha_manifest, sort_keys=True)

          forbidden = ["/penpot/", "materialization-ir", "renderer_delta", "penpot_component_id", "penpot_main_shape_id"]
          for path in [source_lock_path, graph_path] + contract_paths:
              lowered = path.read_text(encoding="utf-8").lower()
              for token in forbidden:
                  if token in lowered:
                      raise SystemExit(f"forbidden semantic token {token} in {rel(path)}")
          if sha_file(registry_path) != expected_registry_hash:
              raise SystemExit("route registry changed during hardening")
          print(json.dumps({
              "status": "PASS",
              "parent": BASE_SHA,
              "route_registry_byte_equal": True,
              "changed_contracts": changed_contracts,
              "state_evidence": {"observed": observed_states, "unresolved": unresolved_states},
              "identity_gate": gate_summary,
              "reconciliation": social_status,
          }, ensure_ascii=False, indent=2))
          PY
          chmod +x scripts/global-archetype-sot-v1/harden-corrective.py

          cat > tests/global-archetype-sot-v1-corrective-boundaries.test.mjs <<'NODE'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { join, resolve } from 'node:path';

          const root = resolve('.');
          const pkg = join(root, 'catalog/global-archetype-sot-v1');
          const astroRoot = resolve(process.env.EVENTS_BOT_ROOT ?? '.astro-source');
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const sha = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const forbiddenSemantic = /\/penpot\/|materialization-ir|renderer_delta|penpot_component_id|penpot_main_shape_id/iu;

          const sourceLockPath = join(pkg, 'source-lock.v1.json');
          const sourceLock = readJson(sourceLockPath);
          assert.equal(forbiddenSemantic.test(readFileSync(sourceLockPath, 'utf8')), false);
          assert.deepEqual(sourceLock.allowed_input_classes, ['verified_handoff', 'astro_source', 'generated_html', 'browser_computed', 'semantic_atlas', 'foundations', 'fixtures']);
          for (const input of sourceLock.design_system_inputs) {
            assert.equal(forbiddenSemantic.test(JSON.stringify(input)), false);
          }

          const contractsDir = join(pkg, 'archetype-contracts');
          const contractFiles = readdirSync(contractsDir).filter((name) => name.endsWith('.semantic-contract.v1.json')).sort();
          assert.equal(contractFiles.length, 17);
          const foundationSignatures = new Set();
          for (const file of contractFiles) {
            const path = join(contractsDir, file);
            const contract = readJson(path);
            assert.equal(forbiddenSemantic.test(readFileSync(path, 'utf8')), false, `design-tool data leaked into ${file}`);
            assert.ok(contract.foundations_usage.length >= 3);
            const groups = contract.foundations_usage.map((item) => item.foundation_group);
            assert.equal(groups.includes('storage'), false);
            assert.equal(groups.includes('state'), false);
            for (const item of contract.foundations_usage) {
              assert.equal(item.consumer_archetype, contract.archetype_id);
              assert.match(item.source_ref, /^catalog\/reconstruction-atlas\/v1\/foundations\.v1\.json#\/(?!$)/u);
            }
            foundationSignatures.add(groups.join('|'));
          }
          assert.ok(foundationSignatures.size >= 8, `only ${foundationSignatures.size} foundation signatures`);

          const reconciliation = readJson(join(pkg, 'reconciliation-proofs.v1.json'));
          assert.equal(forbiddenSemantic.test(JSON.stringify(reconciliation)), false);
          const socialProof = reconciliation.proofs.find((item) => item.semantic_component_id === 'social-proof.like');
          assert.ok(socialProof);
          if (socialProof.status === 'PASS') assert.ok(socialProof.source_identities.length >= 2);

          const graphPath = join(pkg, 'component-composition-graph.v1.json');
          const graph = readJson(graphPath);
          assert.equal(forbiddenSemantic.test(readFileSync(graphPath, 'utf8')), false);
          for (const node of graph.nodes) {
            if (!node || typeof node !== 'object') continue;
            const id = node.component_id ?? node.id ?? node.node_id;
            if (['reuse_existing', 'new_component'].includes(node.disposition)) {
              assert.ok(node.source_identity_contract?.length > 0, `${id} lacks source identities`);
              for (const identity of node.source_identity_contract) {
                assert.ok(identity.source_refs?.length > 0, `${id}/${identity.source_identity_id} lacks refs`);
                for (const ref of identity.source_refs) {
                  assert.equal(ref.repository, 'onedayonemasterpiece/events-bot-new');
                  assert.equal(ref.commit, '7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00');
                  assert.match(ref.line_sha256, /^[0-9a-f]{64}$/u);
                  if (existsSync(astroRoot)) {
                    const path = join(astroRoot, ref.path);
                    assert.ok(existsSync(path), `missing source ${ref.path}`);
                    const line = readFileSync(path, 'utf8').split(/\r?\n/u)[ref.line_start - 1] ?? '';
                    assert.equal(createHash('sha256').update(line).digest('hex'), ref.line_sha256, `source drift ${ref.path}:${ref.line_start}`);
                  }
                }
              }
              if (node.source_identity_contract.length > 1) {
                assert.equal(node.identity_gate?.reconciliation_proof_ref, 'catalog/global-archetype-sot-v1/reconciliation-proofs.v1.json', `${id} lacks semantic reconciliation proof`);
              }
            }
            if (['document.typography', 'listing.page-pattern'].includes(id) && node.source_identity_contract?.length > 1) {
              assert.equal(node.disposition, 'unresolved');
            }
          }

          const plan = readJson(join(pkg, 'penpot-materialization-plan.v1.json'));
          assert.equal(plan.materialization_scope, 'ui_only');
          assert.equal(plan.owner_pages.length, 17);
          const allowedOwnerKeys = ['owner_page_key', 'archetype_id', 'foundations', 'ui_components', 'visual_patterns', 'compositions', 'visual_states'].sort();
          const operational = /source-state|runtime dashboard|status dashboard|coverage dashboard|gap dashboard|hash dashboard|test dashboard|service review route/iu;
          for (const page of plan.owner_pages) {
            assert.deepEqual(Object.keys(page).sort(), allowedOwnerKeys);
            assert.equal(operational.test(JSON.stringify(page)), false, `${page.owner_page_key} contains operational materialization`);
            assert.deepEqual(Object.keys(page.compositions).sort(), ['desktop', 'mobile']);
            for (const viewport of ['desktop', 'mobile']) {
              const composition = page.compositions[viewport];
              assert.deepEqual(Object.keys(composition).sort(), ['branch_ids', 'region_ids']);
              assert.ok(composition.branch_ids.every((item) => typeof item === 'string'));
              assert.ok(composition.region_ids.every((item) => typeof item === 'string'));
            }
            assert.ok(page.foundations.every((item) => typeof item === 'string'));
            assert.ok(page.ui_components.every((item) => typeof item === 'string'));
            assert.ok(page.visual_patterns.every((item) => typeof item === 'string'));
            assert.ok(page.visual_states.every((item) => typeof item === 'string'));
          }

          const manifest = readJson(join(pkg, 'manifest.v1.json'));
          assert.equal(manifest.route_registry.byte_changed, false);
          assert.equal(manifest.constraints.design_tool_mutation, false);
          assert.equal(manifest.constraints.date_weekend_artifact_changes, false);
          assert.equal(manifest.constraints.production_astro_changes, false);
          assert.equal(manifest.constraints.merge, false);
          assert.equal(manifest.constraints.promotion, false);
          assert.equal(manifest.constraints.deploy, false);

          const handoff = readJson(join(pkg, 'handoff-lock.v1.json'));
          assert.equal(sha(join(pkg, 'route-archetype-registry.v1.json')), handoff.approved_outputs.route_archetype_registry.sha256);
          const hashes = readJson(join(pkg, 'sha256-manifest.v1.json'));
          for (const [path, expected] of Object.entries(hashes.files)) {
            assert.equal(sha(join(root, path)), expected, `SHA-256 mismatch ${path}`);
          }

          console.log(JSON.stringify({
            status: 'PASS',
            contracts: contractFiles.length,
            foundation_signatures: foundationSignatures.size,
            owner_pages: plan.owner_pages.length,
            identity_gate: graph.identity_gate_summary,
            social_proof: socialProof.status,
            route_registry_byte_equal: true,
          }, null, 2));
          NODE
          chmod +x tests/global-archetype-sot-v1-corrective-boundaries.test.mjs

      - name: Prove handoff byte equality before corrective mutation
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          if [[ ! -f catalog/global-archetype-sot-v1/byte-equality-proof.v1.json ]]; then
            git fetch origin 8c6b9c1017f1fb646b6bb757e1b6b2cf0e7b815d || true
            node scripts/global-archetype-sot-v1/validate-handoff.mjs
          fi

      - name: Apply narrow corrective build and semantic hardening
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          before_registry="$(sha256sum catalog/global-archetype-sot-v1/route-archetype-registry.v1.json | cut -d' ' -f1)"
          python3 scripts/global-archetype-sot-v1/build-corrective.py
          python3 scripts/global-archetype-sot-v1/harden-corrective.py
          after_registry="$(sha256sum catalog/global-archetype-sot-v1/route-archetype-registry.v1.json | cut -d' ' -f1)"
          test "$before_registry" = "$after_registry"
          test "$after_registry" = "fb6f8252aba36eca906b6c1516ef19ef83532dda45c87ca0aa41c116773aae0d"

      - name: Run semantic-completeness and boundary gates
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          node tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          node tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          git diff --check

      - name: Prove parent operating and unrelated work is preserved
        shell: bash
        run: |
          set -euo pipefail
          parent_manifest="$(mktemp)"
          git show "$BASE_SHA:catalog/global-archetype-sot-v1/manifest.v1.json" > "$parent_manifest"
          node --input-type=module - "$parent_manifest" <<'NODE'
          import { readFileSync } from 'node:fs';
          const parent = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const current = JSON.parse(readFileSync('catalog/global-archetype-sot-v1/manifest.v1.json', 'utf8'));
          for (const key of ['pinned_handoff', 'operating_contract']) {
            if (JSON.stringify(current[key]) !== JSON.stringify(parent[key])) {
              throw new Error(`parent manifest field was not preserved: ${key}`);
            }
          }
          if (!current.penpot_policy || !current.visual_materialization || !current.baseline_approved_semantic_outputs) {
            throw new Error('parent operating/visual authority was not preserved');
          }
          NODE
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --name-only "$BASE_SHA" | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          if git diff --name-only "$BASE_SHA" -- docs AGENTS.md receipts/penpot | grep -q .; then
            echo 'Operating docs or unrelated Visual Reconstruction work changed' >&2
            exit 1
          fi

      - name: Commit deterministic corrective delta
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- \
            catalog/global-archetype-sot-v1/archetype-contracts \
            catalog/global-archetype-sot-v1/component-composition-graph.v1.json \
            catalog/global-archetype-sot-v1/byte-equality-proof.v1.json \
            catalog/global-archetype-sot-v1/source-lock.v1.json \
            catalog/global-archetype-sot-v1/penpot-materialization-plan.v1.json \
            catalog/global-archetype-sot-v1/reconciliation-proofs.v1.json \
            catalog/global-archetype-sot-v1/manifest.v1.json \
            catalog/global-archetype-sot-v1/corrective-receipt.v1.json \
            catalog/global-archetype-sot-v1/sha256-manifest.v1.json \
            scripts/global-archetype-sot-v1/build-corrective.py \
            scripts/global-archetype-sot-v1/harden-corrective.py \
            tests/global-archetype-sot-v1-semantic-completeness.test.mjs \
            tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          if git diff --cached --quiet; then
            echo 'Corrective delta is deterministic and current.'
            exit 0
          fi
          if git diff --cached --name-only | grep -E '^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|docs/|AGENTS\.md$|receipts/)'; then
            echo 'Out-of-scope file staged' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'global-archetype-sot-bot'
          git config user.email 'global-archetype-sot-bot@users.noreply.github.com'
          git commit -m 'fix(ds): bind global archetype semantics to exact Astro evidence'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Print final manifest and changed contracts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = 'catalog/global-archetype-sot-v1';
          const manifest = JSON.parse(readFileSync(`${root}/manifest.v1.json`, 'utf8'));
          const receipt = JSON.parse(readFileSync(`${root}/corrective-receipt.v1.json`, 'utf8'));
          const hashes = JSON.parse(readFileSync(`${root}/sha256-manifest.v1.json`, 'utf8'));
          console.log(JSON.stringify({
            status: 'PASS',
            corrective_parent_sha: manifest.corrective_parent_sha,
            astro_commit: manifest.astro_commit,
            route_registry: manifest.route_registry,
            changed_contracts: receipt.changed_contracts,
            high_risk_state_evidence: receipt.high_risk_state_evidence,
            component_identity_gate: receipt.component_identity_gate,
            semantic_reconciliation_proofs: receipt.semantic_reconciliation_proofs,
            sha256_manifest_file_count: Object.keys(hashes.files).length,
          }, null, 2));
          NODE
