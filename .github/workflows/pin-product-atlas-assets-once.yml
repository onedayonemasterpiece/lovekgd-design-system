name: Pin Product Atlas assets once

on:
  push:
    branches:
      - fix/product-atlas-immutable-assets-20260807
    paths:
      - '.github/workflows/pin-product-atlas-assets-once.yml'

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/product-atlas-immutable-assets-20260807
          fetch-depth: 0

      - name: Pin UI and catalog assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          asset_sha = '45f62ce3ea0bd665f972a213c23aef37273f9fb7'

          plugin = Path('prototypes/penpot-product-atlas-001/dist/plugin.js')
          value = plugin.read_text(encoding='utf-8')
          old = "  const UI_URL = `https://cdn.jsdelivr.net/gh/${REPOSITORY}@main/${ROOT_PATH}/dist/ui.html`;"
          repository_ref = '$' + '{REPOSITORY}'
          asset_ref = '$' + '{ASSET_SHA}'
          root_ref = '$' + '{ROOT_PATH}'
          new = (
              f"  const ASSET_SHA = '{asset_sha}';\n"
              f"  const UI_URL = `https://cdn.jsdelivr.net/gh/{repository_ref}@{asset_ref}/{root_ref}/dist/ui.html`;"
          )
          if old not in value and f"const ASSET_SHA = '{asset_sha}'" not in value:
              raise SystemExit('plugin mutable UI URL anchor missing')
          value = value.replace(old, new, 1)
          plugin.write_text(value, encoding='utf-8')

          ui = Path('prototypes/penpot-product-atlas-001/dist/ui.html')
          value = ui.read_text(encoding='utf-8')
          old = "  const ROOT = 'https://cdn.jsdelivr.net/gh/onedayonemasterpiece/lovekgd-design-system@main/prototypes/penpot-product-atlas-001';"
          new = f"  const ROOT = 'https://cdn.jsdelivr.net/gh/onedayonemasterpiece/lovekgd-design-system@{asset_sha}/prototypes/penpot-product-atlas-001';"
          if old not in value and asset_sha not in value:
              raise SystemExit('UI mutable catalog URL anchor missing')
          value = value.replace(old, new, 1)
          ui.write_text(value, encoding='utf-8')

          status = Path('prototypes/penpot-product-atlas-001/STATUS.md')
          value = status.read_text(encoding='utf-8')
          marker = 'IMMUTABLE ASSET SOURCE:'
          if marker not in value:
              value += f"\nIMMUTABLE ASSET SOURCE: `{asset_sha}`\n\nThe plugin bundle loads UI and catalog from this exact commit; the remaining gate is real Penpot host acceptance.\n"
          status.write_text(value, encoding='utf-8')

          readme = Path('prototypes/penpot-product-atlas-001/README.md')
          value = readme.read_text(encoding='utf-8')
          marker = '## Immutable asset boundary'
          if marker not in value:
              value += f"\n## Immutable asset boundary\n\nThe installed plugin bundle loads its UI and catalog from exact repository commit `{asset_sha}` rather than mutable `main`. Install the manifest from the final plugin commit used for the host-smoke session.\n"
          readme.write_text(value, encoding='utf-8')
          PY

          node --check prototypes/penpot-product-atlas-001/dist/plugin.js
          node prototypes/penpot-product-atlas-001/scripts/validate.mjs
          grep -F '45f62ce3ea0bd665f972a213c23aef37273f9fb7' prototypes/penpot-product-atlas-001/dist/plugin.js
          grep -F '45f62ce3ea0bd665f972a213c23aef37273f9fb7' prototypes/penpot-product-atlas-001/dist/ui.html

          rm -f .github/workflows/pin-product-atlas-assets-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            prototypes/penpot-product-atlas-001/dist/plugin.js \
            prototypes/penpot-product-atlas-001/dist/ui.html \
            prototypes/penpot-product-atlas-001/README.md \
            prototypes/penpot-product-atlas-001/STATUS.md \
            .github/workflows/pin-product-atlas-assets-once.yml
          git commit -m 'fix: pin Product Atlas UI and catalog to immutable assets'
          git push origin HEAD:fix/product-atlas-immutable-assets-20260807
