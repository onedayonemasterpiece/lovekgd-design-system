name: A0 direct-plugin route buffer R2

on:
  push:
    branches:
      - a0/direct-plugin-route-buffer-r2-20260902

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: a0-direct-plugin-route-buffer-r2
  cancel-in-progress: false

jobs:
  build-lanes:
    if: "${{ github.event.head_commit.message == 'ci(a0): bootstrap direct-plugin route buffer R2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [lane-1, lane-2, lane-3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            862bb09cf61750bd5afce26d84207a501f7ec733 \
            bc8ee45489812a346d2731f97908803e8ec01ba5 \
            10fc2ccbd6e7e2e47bcc5870f71af84ce200f888 \
            4edc859861fba3f18fab0e65e9d2e8c0a7394bdb \
            9e8edbed95eb40807059e6c6f10af74beeaee683 \
            4ee9651c97da4e46b0fda4e244f9d5dea634e063 \
            663be702d481972cb2e8863af500f1c35dda1d8c \
            be4918e5d8e1c1bba5da478acfd08f8035cfc1a5 \
            62f26df36b8199e4b8899b9252f796b1fa5e9d42 \
            674d793cfc761b39e6cebe087aae6450ded910d6 \
            864e83b4fb3efb50a018e1f37db6c67da2730485 \
            bf436751607c335111656576317cd9a18af9baee
          test "$(git rev-parse 862bb09cf61750bd5afce26d84207a501f7ec733^{tree})" = 9cf76a269e8febfb56fbdc93a1f0a73a74a2bd46
          test "$(git rev-parse 663be702d481972cb2e8863af500f1c35dda1d8c^{tree})" = cf9a1e6a5e0a84aea5636334dbd3be4961039b75
          test "$(git rev-parse be4918e5d8e1c1bba5da478acfd08f8035cfc1a5^{tree})" = da1f5c305c75d467af5e4e26f8a996b8c243d74f
          test "$(git rev-parse 62f26df36b8199e4b8899b9252f796b1fa5e9d42^{tree})" = 23bc8ef208c9e68e76890183fdda15c1a60f5fbd

      - name: Build lane twice and prove deterministic bytes
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/asp-production-conveyor-v3/a0/direct-plugin-route-bundles-r2/build.py.part* > /tmp/a0-direct-plugin-r2-build.py
          test "$(sha256sum /tmp/a0-direct-plugin-r2-build.py | awk '{print $1}')" = a88fab26258868855ac796e0db18cce63c2d025b4f859bc8c1a2ac84f1ac6b95
          python3 /tmp/a0-direct-plugin-r2-build.py \
            build-lane --lane '${{ matrix.lane }}' --repo "$GITHUB_WORKSPACE" \
            --out "/tmp/a0-r2-build-1/${{ matrix.lane }}"
          python3 /tmp/a0-direct-plugin-r2-build.py \
            build-lane --lane '${{ matrix.lane }}' --repo "$GITHUB_WORKSPACE" \
            --out "/tmp/a0-r2-build-2/${{ matrix.lane }}"
          diff -ru "/tmp/a0-r2-build-1/${{ matrix.lane }}" "/tmp/a0-r2-build-2/${{ matrix.lane }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane }}
          path: /tmp/a0-r2-build-1/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 3

  publish:
    if: "${{ github.event.head_commit.message == 'ci(a0): bootstrap direct-plugin route buffer R2' }}"
    needs: build-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact inputs and current branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'a0-direct-plugin-r2-bot'
          git config user.email 'a0-direct-plugin-r2-bot@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B "$GITHUB_REF_NAME" "refs/remotes/origin/$GITHUB_REF_NAME"
          for commit in \
            862bb09cf61750bd5afce26d84207a501f7ec733 \
            bc8ee45489812a346d2731f97908803e8ec01ba5 \
            10fc2ccbd6e7e2e47bcc5870f71af84ce200f888 \
            4edc859861fba3f18fab0e65e9d2e8c0a7394bdb \
            9e8edbed95eb40807059e6c6f10af74beeaee683 \
            4ee9651c97da4e46b0fda4e244f9d5dea634e063 \
            663be702d481972cb2e8863af500f1c35dda1d8c \
            be4918e5d8e1c1bba5da478acfd08f8035cfc1a5 \
            62f26df36b8199e4b8899b9252f796b1fa5e9d42 \
            674d793cfc761b39e6cebe087aae6450ded910d6 \
            864e83b4fb3efb50a018e1f37db6c67da2730485 \
            bf436751607c335111656576317cd9a18af9baee; do
            git cat-file -e "${commit}^{commit}"
          done

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/a0-r2-artifacts

      - name: Test, publish each standalone bundle, and freeze terminal buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/asp-production-conveyor-v3/a0/direct-plugin-route-bundles-r2/build.py.part* > /tmp/a0-direct-plugin-r2-build.py
          test "$(sha256sum /tmp/a0-direct-plugin-r2-build.py | awk '{print $1}')" = a88fab26258868855ac796e0db18cce63c2d025b4f859bc8c1a2ac84f1ac6b95
          python3 /tmp/a0-direct-plugin-r2-build.py \
            publish --repo "$GITHUB_WORKSPACE" --artifacts /tmp/a0-r2-artifacts

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          terminal='catalog/asp-production-conveyor-v3/a0/direct-plugin-route-bundles-r2/A0_DIRECT_PLUGIN_ROUTE_BUFFER_READY.r2.json'
          {
            echo '## A0 direct-plugin route buffer R2'
            echo
            echo "- state: \`$(jq -r .state "$terminal")\`"
            echo "- bundles ready: \`$(jq -r .bundles_ready "$terminal")\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- final head: \`$(git rev-parse HEAD)\`"
            echo "- final tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            echo '- Penpot reads/mutations: `0/0`'
            echo '- next owner: `D0_CONTINUOUS_INTAKE`'
          } >> "$GITHUB_STEP_SUMMARY"
