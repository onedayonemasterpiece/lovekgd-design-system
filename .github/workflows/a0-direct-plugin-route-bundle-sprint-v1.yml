name: A0 direct plugin route-bundle sprint v1

on:
  push:
    branches:
      - a0/direct-plugin-route-bundle-sprint-bootstrap-v1-20260902

permissions:
  contents: write
  issues: write

concurrency:
  group: a0-direct-plugin-route-bundle-sprint-v1
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact immutable source commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            862bb09cf61750bd5afce26d84207a501f7ec733 \
            4edc859861fba3f18fab0e65e9d2e8c0a7394bdb \
            9e8edbed95eb40807059e6c6f10af74beeaee683 \
            4ee9651c97da4e46b0fda4e244f9d5dea634e063 \
            0fbfd4839343de71d5128b2e9c2ad232dde6abf4 \
            9c2f0578cc58c2e490248a66bfe6e8297ab9410c
          for commit in \
            862bb09cf61750bd5afce26d84207a501f7ec733 \
            4edc859861fba3f18fab0e65e9d2e8c0a7394bdb \
            9e8edbed95eb40807059e6c6f10af74beeaee683 \
            4ee9651c97da4e46b0fda4e244f9d5dea634e063 \
            0fbfd4839343de71d5128b2e9c2ad232dde6abf4 \
            9c2f0578cc58c2e490248a66bfe6e8297ab9410c; do
            git cat-file -e "${commit}^{commit}"
          done

      - name: Decode and verify deterministic generator
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/PARTS.SHA256 <<'EOF'
          0c8a66d94bf15c04c0ac1e2be11e2a96ef31a9b97d24f27941ce1d62eccbcdda  .a0-direct-plugin-bootstrap/part-00-00.b64
          d4b0c017686fd344bdd450b6cb2e588261d23d3f69fea07ec6fa5ae9827b857b  .a0-direct-plugin-bootstrap/part-00-01.b64
          76017e50af862ffa09f34f76655693c3d58e81f56e424abeb559ae355ec5e3f4  .a0-direct-plugin-bootstrap/part-00-02.b64
          213d3ec300e0dbbae237aba0b8ac91eb060b237b8fb3863f09ce219ba65b9ca8  .a0-direct-plugin-bootstrap/part-00-03.b64
          18bc51d70631a21b0c0760501f8de4f3febbd226ff6895f37084d26d0c9f48f9  .a0-direct-plugin-bootstrap/part-00-04.b64
          d1a028f230483984fe82d6c39f6df0c4ef9b2489b384a7210a121c0327471d2c  .a0-direct-plugin-bootstrap/part-00-05.b64
          5323854b417ad89a539614cfe42521867e998ebca7ffc73c52f307c63791030d  .a0-direct-plugin-bootstrap/part-00-06.b64
          90fa588a7d7bd2f83941c51500f5b9f158bcaa83e9f210dd9dccb6923ec90bcc  .a0-direct-plugin-bootstrap/part-00-07.b64
          df0a505540652885f791842782e58f8ca7e41a7078d61c1b2d59f92aff442ef0  .a0-direct-plugin-bootstrap/part-01.b64
          46d1a799f7f628245c36b62cdd4b07cd3bfee62576a9f8ed4ddd467d2f550cf5  .a0-direct-plugin-bootstrap/part-02.b64
          b645070daa1b3dfc1882e595d55be679f9de8604d4d59e2d8806931a383e8a7e  .a0-direct-plugin-bootstrap/part-03.b64
          454ff0743cf3d4ae995a56ef34b4739d80173955935230924e82824088aeaa8a  .a0-direct-plugin-bootstrap/part-04.b64
          EOF
          sha256sum -c /tmp/PARTS.SHA256
          cat \
            .a0-direct-plugin-bootstrap/part-00-00.b64 \
            .a0-direct-plugin-bootstrap/part-00-01.b64 \
            .a0-direct-plugin-bootstrap/part-00-02.b64 \
            .a0-direct-plugin-bootstrap/part-00-03.b64 \
            .a0-direct-plugin-bootstrap/part-00-04.b64 \
            .a0-direct-plugin-bootstrap/part-00-05.b64 \
            .a0-direct-plugin-bootstrap/part-00-06.b64 \
            .a0-direct-plugin-bootstrap/part-00-07.b64 \
            .a0-direct-plugin-bootstrap/part-01.b64 \
            .a0-direct-plugin-bootstrap/part-02.b64 \
            .a0-direct-plugin-bootstrap/part-03.b64 \
            .a0-direct-plugin-bootstrap/part-04.b64 \
            | tr -d '\n' | base64 -d > /tmp/direct_plugin_sprint.py.gz
          echo '7040fa06a64ca4c704ed0ec5cf1a5ad1cfc035691a295644d5c35809b46c4f7a  /tmp/direct_plugin_sprint.py.gz' | sha256sum -c -
          gzip -dc /tmp/direct_plugin_sprint.py.gz > /tmp/direct_plugin_sprint.py
          echo 'a335ef466bc8a933e7b7facf06dd30d394346274fe4d386734b0f979fd77b6f9  /tmp/direct_plugin_sprint.py' | sha256sum -c -
          python3 -m py_compile /tmp/direct_plugin_sprint.py

      - name: Run three bounded lanes and aggregate terminal buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/direct_plugin_sprint.py --orchestrate --repo "$GITHUB_WORKSPACE"

      - name: Upload terminal remote readback
        uses: actions/upload-artifact@v4
        with:
          name: a0-direct-plugin-route-buffer-result
          path: a0-direct-plugin-route-buffer-result.json
          retention-days: 3
          if-no-files-found: error
