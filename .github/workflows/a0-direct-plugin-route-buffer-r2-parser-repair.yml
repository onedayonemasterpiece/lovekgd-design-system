name: A0 direct-plugin route buffer R2 parser repair

on:
  push:
    branches:
      - a0/direct-plugin-route-buffer-r2-20260902

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: a0-direct-plugin-route-buffer-r2-parser-repair
  cancel-in-progress: false

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci(a0): repair direct-plugin R2 conformance parser' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact immutable inputs and current branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'a0-direct-plugin-r2-bot'
          git config user.email 'a0-direct-plugin-r2-bot@users.noreply.github.com'
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B "$GITHUB_REF_NAME" "refs/remotes/origin/$GITHUB_REF_NAME"
          for commit in \
            862bb09cf61750bd5afce26d84207a501f7ec733 \
            bc8ee45489812a346d2731f97908803e8ec01ba5 \
            10fc2ccbd6e7e2e47bcc5870f71af84ce200f888 \
            4edc859861fba3f18fab0e65e9d2e8c0a7394bdb \
            9e8edbed95eb40807059e6c6f10af74beeaee683 \
            4ee9651c97da4e46b0fda4e244f9d5dea634e063 \
            663be702d481972cb2e8863af500f1c35dda1d8c \
            be4918e5d8e1c1bba5da478acfd08f8035cfc1a5 \
            62f26df36b8199e4b8899b9252f796b1fa5e9d42 \
            674d793cfc761b39e6cebe087aae6450ded910d6 \
            864e83b4fb3efb50a018e1f37db6c67da2730485 \
            bf436751607c335111656576317cd9a18af9baee; do
            git cat-file -e "${commit}^{commit}"
          done
          test "$(git rev-parse 862bb09cf61750bd5afce26d84207a501f7ec733^{tree})" = 9cf76a269e8febfb56fbdc93a1f0a73a74a2bd46
          test "$(git rev-parse 663be702d481972cb2e8863af500f1c35dda1d8c^{tree})" = cf9a1e6a5e0a84aea5636334dbd3be4961039b75
          test "$(git rev-parse be4918e5d8e1c1bba5da478acfd08f8035cfc1a5^{tree})" = da1f5c305c75d467af5e4e26f8a996b8c243d74f
          test "$(git rev-parse 62f26df36b8199e4b8899b9252f796b1fa5e9d42^{tree})" = 23bc8ef208c9e68e76890183fdda15c1a60f5fbd

      - name: Download the already successful three bounded lane artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33670091322
          pattern: repaired-*
          merge-multiple: false
          path: /tmp/a0-r2-repaired

      - name: Normalize lane artifact directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a0-r2-artifacts
          for lane in lane-1 lane-2 lane-3; do
            test -d "/tmp/a0-r2-repaired/repaired-${lane}"
            mv "/tmp/a0-r2-repaired/repaired-${lane}" "/tmp/a0-r2-artifacts/${lane}"
            test "$(jq -r .ready_count /tmp/a0-r2-artifacts/${lane}/lane-index.r2.json)" -gt 0
          done

      - name: Reconstruct transparent builder with bounded parser repair
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/asp-production-conveyor-v3/a0/direct-plugin-route-bundles-r2/build.py.part* > /tmp/a0-direct-plugin-r2-build.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/a0-direct-plugin-r2-build.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'ATLAS_EXTENSION_PATH = "catalog/asp-production-conveyor-v3/atlas-v2/extensions/atlas-extension-r2-1.v1.json"',
              'ATLAS_EXTENSION_PATH = "catalog/asp-production-conveyor-v3/atlas-v2/extensions/r2-1/atlas-extension-map.r2-1.json"',
          )
          source = source.replace(
              '    old_path = OLD_MANIFEST.format(lane=lane, slug=slug)\n',
              '    old_slug = {"popular-listing": "popular", "unusual-listing": "unusual"}.get(slug, slug)\n    old_path = OLD_MANIFEST.format(lane=lane, slug=old_slug)\n',
          )
          source = source.replace(
              '    print(pretty(index))\n\n\ndef api',
              '    print(pretty(index))\n    if not ready:\n        raise AssertionError(f"LANE_ZERO_READY:{lane}:{blocked}")\n\n\ndef api',
          )
          old = 'json.loads(conformance_raw.splitlines()[-1])'
          assert source.count(old) == 2, source.count(old)
          source = source.replace(old, 'json.loads(conformance_raw)')
          path.write_text(source, encoding='utf-8')
          PY
          test "$(sha256sum /tmp/a0-direct-plugin-r2-build.py | awk '{print $1}')" = d898cc8e2d723018f7312da2b0514f7959fc9bd1a5b51a7d26ea395f8a24ddfd
          python3 -m py_compile /tmp/a0-direct-plugin-r2-build.py

      - name: Run D0 conformance, publish each bundle, and freeze terminal buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/a0-direct-plugin-r2-build.py publish \
            --repo "$GITHUB_WORKSPACE" --artifacts /tmp/a0-r2-artifacts

      - name: Durable summary
        shell: bash
        run: |
          set -euo pipefail
          terminal='catalog/asp-production-conveyor-v3/a0/direct-plugin-route-bundles-r2/A0_DIRECT_PLUGIN_ROUTE_BUFFER_READY.r2.json'
          test -f "$terminal"
          {
            echo '## A0 direct-plugin route buffer R2'
            echo
            echo "- state: \`$(jq -r .state "$terminal")\`"
            echo "- bundles ready: \`$(jq -r .bundles_ready "$terminal")\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- final head: \`$(git rev-parse HEAD)\`"
            echo "- final tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            echo '- Penpot reads/mutations: `0/0`'
            echo '- next owner: `D0_CONTINUOUS_INTAKE`'
          } >> "$GITHUB_STEP_SUMMARY"
