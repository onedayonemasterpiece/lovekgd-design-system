name: V0 morning review evidence transfer

on:
  push:
    branches:
      - v0/atlas-visual-preflight-evidence-20260901

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Atlas R2 evidence
        uses: actions/checkout@v4
        with:
          ref: 0fbfd4839343de71d5128b2e9c2ad232dde6abf4
          path: atlas
          persist-credentials: false

      - name: Checkout exact ActionNav durable evidence
        uses: actions/checkout@v4
        with:
          ref: 7ea99dd8c9e20ab7ffad1c8cadb3df175e6a071b
          path: actionnav
          persist-credentials: false

      - name: Assemble bounded review bundle
        shell: bash
        run: |
          set -euo pipefail
          src="atlas/reports/asp-production-conveyor-v3/atlas-v2/rendered"
          dst="bundle/atlas"
          mkdir -p "$dst" bundle/action-nav
          for name in \
            r2-action-nav \
            r2-medallions-densest \
            r2-typography-densest \
            r2-controls-buttons \
            r2-archetype-home \
            r2-composed-ready \
            r2-composed-exception \
            r2-owner-review-index
          do
            cp "$src/$name.png" "$dst/"
            cp "$src/$name.svg" "$dst/"
          done
          cp "$src/source-bound-evidence-8of8.v1.json" "$dst/"
          cp "$src/source-bound-evidence-8of8.validation.v1.json" "$dst/"
          cp "$src/layout-measurements.v2.json" "$dst/"
          cp "$src/overlap-bounds-report.v2.json" "$dst/"
          cp -a actionnav/reports/asp-production-conveyor-v3/action-nav-r2-review/. bundle/action-nav/
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS
          du -ah bundle | sort -h | tail -40

      - name: Upload bounded evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0-morning-review-evidence-20260902
          path: bundle
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
