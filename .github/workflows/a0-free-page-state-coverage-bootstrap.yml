name: A0 Free page and tablet state coverage bootstrap
on:
  push:
    branches: [a0/free-page-state-coverage-r1-20260901]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'chore(a0): bootstrap free-page state-coverage sprint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - shell: bash
        run: |
          set -euo pipefail
          cat .a0-bootstrap/payload.data.* | base64 -d > /tmp/payload.tar.gz
          echo '5ff7ee0ea584d040118e55ad59b3ca2b12a0f527ea519686ccd0ce29bf788dfb  /tmp/payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/payload.tar.gz
          cat .a0-bootstrap/publish.part* > /tmp/a0-publish.sh
          bash /tmp/a0-publish.sh
