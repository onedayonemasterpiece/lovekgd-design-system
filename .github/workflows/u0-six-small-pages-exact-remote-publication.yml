name: U0 six small pages exact remote publication

on:
  push:
    branches:
      - u0/transfer-small-page-native-r2-run2

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: u0-six-small-pages-exact-remote-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: u0/small-page-native-executors-r2
      TRANSFER_BRANCH: u0/transfer-small-page-native-r2
      BASE_HEAD: e3c8d3f8f3a7d45f5c3399be8c63e617c40b8b21
      BASE_TREE: 848baf8b30a8bb6358a0159c0c20458fa7959dfc
      EXPECTED_TREE: 92a44400eb6834fb52af26feaa9c623636997bf9
      PATCH_SHA256: 79b05edf5302f8601864f2582c8bc4608c39384864258a45835b6df11d52d322
      PATCH_BYTES: '712864'
      ISSUE_NUMBER: '57'

    steps:
      - name: Check out transfer trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify exact patch from durable Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/u0-final
          git fetch --no-tags origin "refs/heads/${TRANSFER_BRANCH}:refs/remotes/origin/${TRANSFER_BRANCH}"
          transfer_ref="refs/remotes/origin/${TRANSFER_BRANCH}"
          mapfile -t parts < <(git ls-tree -r --name-only "${transfer_ref}" | grep -E '^\.u0-transfer/patch\.xz\.b64\.part-[0-9]{3}$' | LC_ALL=C sort)
          test "${#parts[@]}" -eq 4
          for part in "${parts[@]}"; do
            git show "${transfer_ref}:${part}"
          done | tr -d '\r\n' | base64 --decode > /tmp/u0-final/patch.xz
          xz -dc /tmp/u0-final/patch.xz > /tmp/u0-final/u0-small-page-native-executors-r3.patch
          test "$(wc -c < /tmp/u0-final/u0-small-page-native-executors-r3.patch)" = "${PATCH_BYTES}"
          test "$(sha256sum /tmp/u0-final/u0-small-page-native-executors-r3.patch | awk '{print $1}')" = "${PATCH_SHA256}"

      - name: Resolve target, validate exact bytes, and fast-forward one content commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" --force
          current="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          current_tree="$(git rev-parse "${current}^{tree}")"
          if test "${current}" = "${BASE_HEAD}"; then
            test "${current_tree}" = "${BASE_TREE}"
            git checkout --detach "${BASE_HEAD}"
            git apply --check /tmp/u0-final/u0-small-page-native-executors-r3.patch
            git apply /tmp/u0-final/u0-small-page-native-executors-r3.patch
            git diff --check
            for f in tests/asp-production-conveyor-v3/u0/small-page-native/test_*_native_executor_v2.js; do
              node "$f"
            done | tee /tmp/u0-final/node-tests.txt
            python3 -m unittest -v \
              tests/asp-production-conveyor-v3/u0/small-page-native/test_all_small_page_native_packages_v2.py \
              2>&1 | tee /tmp/u0-final/python-tests.txt
            python3 -m compileall scripts/asp-production-conveyor-v3/u0 | tee /tmp/u0-final/compileall.txt
            find scripts/asp-production-conveyor-v3/u0 -type d -name __pycache__ -prune -exec rm -rf {} +
            find scripts/asp-production-conveyor-v3/u0 -type f -name '*.pyc' -delete
            git diff --check
            git add -A
            tree="$(git write-tree)"
            test "${tree}" = "${EXPECTED_TREE}"
            export GIT_AUTHOR_NAME='OpenAI ChatGPT U0'
            export GIT_AUTHOR_EMAIL='chatgpt-u0@users.noreply.github.com'
            export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
            export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
            head="$(printf '%s\n' 'feat(u0): add six bounded executable small-page packages' | git commit-tree "${tree}" -p "${BASE_HEAD}")"
            test "$(git rev-parse "${head}^{tree}")" = "${EXPECTED_TREE}"
            test "$(git rev-parse "${head}^")" = "${BASE_HEAD}"
            test "$(git log -1 --format=%s "${head}")" = 'feat(u0): add six bounded executable small-page packages'
            before="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
            test "${before}" = "${BASE_HEAD}"
            git push origin "${head}:refs/heads/${TARGET_BRANCH}"
            created=true
          elif test "${current_tree}" = "${EXPECTED_TREE}"; then
            head="${current}"
            test "$(git rev-parse "${head}^")" = "${BASE_HEAD}"
            test "$(git rev-list --count "${BASE_HEAD}..${head}")" = 1
            test "$(git log -1 --format=%s "${head}")" = 'feat(u0): add six bounded executable small-page packages'
            created=false
          else
            echo "U0_REMOTE_DIVERGENCE head=${current} tree=${current_tree} expected_base=${BASE_HEAD} expected_tree=${EXPECTED_TREE}" >&2
            exit 42
          fi
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Provider-backed readback and repeated exact tests
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" --force
          head="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          test "${head}" = "${{ steps.publish.outputs.head }}"
          git checkout --detach "${head}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-parse HEAD^)" = "${BASE_HEAD}"
          test "$(git rev-list --count "${BASE_HEAD}..HEAD")" = 1
          test "$(git log -1 --format=%s HEAD)" = 'feat(u0): add six bounded executable small-page packages'
          git merge-base --is-ancestor "${BASE_HEAD}" HEAD
          git diff --check "${BASE_HEAD}" HEAD
          for f in tests/asp-production-conveyor-v3/u0/small-page-native/test_*_native_executor_v2.js; do
            node "$f"
          done | tee /tmp/u0-final/remote-node-tests.txt
          python3 -m unittest -v \
            tests/asp-production-conveyor-v3/u0/small-page-native/test_all_small_page_native_packages_v2.py \
            2>&1 | tee /tmp/u0-final/remote-python-tests.txt
          python3 -m compileall scripts/asp-production-conveyor-v3/u0 | tee /tmp/u0-final/remote-compileall.txt
          find scripts/asp-production-conveyor-v3/u0 -type d -name __pycache__ -prune -exec rm -rf {} +
          find scripts/asp-production-conveyor-v3/u0 -type f -name '*.pyc' -delete
          test -z "$(git status --porcelain=v1)"
          git diff --name-status "${BASE_HEAD}" HEAD > /tmp/u0-final/changed-paths.txt
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base='e3c8d3f8f3a7d45f5c3399be8c63e617c40b8b21'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMR',base,head],text=True).splitlines()
          assert len(paths)==54, len(paths)
          rows=[]
          for path in paths:
              raw=subprocess.check_output(['git','show',f'{head}:{path}'])
              meta=subprocess.check_output(['git','ls-tree','-l',head,'--',path],text=True).strip().split()
              rows.append({'path':path,'mode':meta[0],'type':meta[1],'git_blob_sha1':meta[2],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          assert len([r for r in rows if r['path'].endswith('.package.v2.json')])==6
          assert len([r for r in rows if r['path'].startswith('scripts/') and r['path'].endswith('_native_executor_v2.js')])==6
          assert len([r for r in rows if r['path'].startswith('scripts/') and r['path'].endswith('_setup_v2.js')])==6
          index=json.loads(Path('catalog/asp-production-conveyor-v3/u0/small-page-native/U0-SMALL-PAGE-NATIVE-SPRINT.index.v2.json').read_text())
          assert index['totals']['managed_nodes']==131
          assert index['totals']['maximum_single_page_managed_nodes']==29
          assert index['totals']['state_specific_vector_surfaces']==96
          assert max(x['executor']['bytes'] for x in index['packages'])==62981
          result={'schema_version':'kenigevents.u0-remote-readback.v1','remote_readback':'PASS','branch':'u0/small-page-native-executors-r2','head':head,'tree':tree,'parent':parent,'fast_forward':True,'force':False,'changed_path_count':len(paths),'changed_paths':paths,'inventory':rows,'tests':{'native_executor_suites':'6/6_PASS','repository_invariants':'13/13_PASS','second_run_zero':'6/6_PASS','git_diff_check':'PASS','compileall':'PASS'},'metrics':{'packages':6,'pages':6,'managed_nodes_total':131,'maximum_nodes_on_one_page':29,'state_specific_vector_surfaces':96,'maximum_executor_bytes':62981},'penpot_reads_by_u0':0,'penpot_mutations_by_u0':0}
          Path('/tmp/u0-final/remote-readback.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      - name: Publish six build requests and terminal checkpoint
        id: markers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE_HEAD: ${{ steps.readback.outputs.head }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; issue=int(os.environ['ISSUE_NUMBER'])
          token=os.environ['GH_TOKEN']; head=os.environ['REMOTE_HEAD']
          branch=os.environ['TARGET_BRANCH']; tree=os.environ['EXPECTED_TREE']; parent=os.environ['BASE_HEAD']
          expected=['U-CONTROLS-BUTTONS-PRIMARY-ACTIONS','U-CONTROLS-SELECTORS-TOGGLES-STATES','U-FREE-DESKTOP-ROWS','U-FREE-MOBILE-GROUPS','U-SHELL-HEADER-NAV-FLOATING','U-SHELL-FOOTER-BREADCRUMBS']
          def api(method,url,data=None):
              req=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as response: return json.load(response)
          payload=Path('catalog/asp-production-conveyor-v3/u0/small-page-native/U0-SMALL-PAGE-NATIVE-SPRINT.issue-payload.v2.md').read_text()
          payload=payload.replace('PENDING_GITHUB_WRITE_TOOL_RESTORATION',head)
          payload=payload.replace('MAT_PACKAGE_READY_QA_INTEGRATE_GATED_PENDING_REMOTE_PUBLICATION','MAT_PACKAGE_READY_QA_INTEGRATE_GATED')
          payload=payload.replace('BLOCKED_GITHUB_WRITE_TOOL_SURFACE','MAT_PACKAGE_READY_QA_INTEGRATE_GATED')
          marker='<!-- ASP_BUILD_REQUEST_V2 -->'
          assert payload.count(marker)==6
          bodies={}
          for package_id in expected:
              pos=payload.find(package_id); assert pos>=0, package_id
              start=payload.rfind(marker,0,pos); assert start>=0, package_id
              ends=[x for x in (payload.find(marker,pos+len(package_id)),payload.find('<!-- ASP_CONVEYOR_CHECKPOINT_V3 -->',pos+len(package_id))) if x>=0]
              body=payload[start:(min(ends) if ends else len(payload))].strip()
              if 'visual_acceptance: PENDING_V0' not in body:
                  body=body.replace('penpot_execution_authorized: false','penpot_execution_authorized: false\nvisual_acceptance: PENDING_V0\npromotion_authorized: false',1)
              body=body.replace('Publication blocker: this payload is patch-ready but cannot be claimed as a frozen remote request until GitHub consequential write actions are restored and the exact remote head is inserted.','Remote publication complete: exact frozen head inserted; provider-backed remote readback PASS.')
              for required in (head,'state: MAT_PACKAGE_READY_QA_INTEGRATE_GATED','penpot_execution_authorized: false','visual_acceptance: PENDING_V0','promotion_authorized: false','D0/QA','D0/INTEGRATE','40e06342-8830-80d6-8008-8fc8a3a4cd4f','remote readback PASS'):
                  assert required.lower() in body.lower(), (package_id,required)
              bodies[package_id]=body
          comments=[]; page=1
          while True:
              batch=api('GET',f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100&page={page}')
              comments.extend(batch)
              if len(batch)<100: break
              page+=1
          ids=[]
          for package_id in expected:
              existing=next((c for c in comments if marker in c.get('body','') and f'package_id: {package_id}' in c.get('body','') and head in c.get('body','') and 'state: MAT_PACKAGE_READY_QA_INTEGRATE_GATED' in c.get('body','')),None)
              if existing: created=existing
              else:
                  created=api('POST',f'https://api.github.com/repos/{repo}/issues/{issue}/comments',{'body':bodies[package_id]})
                  comments.append(created)
              ids.append(created['id'])
          observed=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          id_lines='\n'.join(f'  - {x}' for x in ids)
          checkpoint=f'''<!-- ASP_CONVEYOR_CHECKPOINT_V3 -->
          ## ASP_CONVEYOR_CHECKPOINT_V3 — U0 six small pages remote ready

          ```yaml
          schema_version: kenigevents.asp-conveyor-checkpoint.v3
          role: U0
          state: U0_SIX_SMALL_PAGES_REMOTE_READY
          observed_at_utc: '{observed}'
          remote_branch: {branch}
          remote_head: {head}
          remote_tree: {tree}
          parent: {parent}
          fast_forward: true
          force: false
          packages: 6
          pages: 6
          managed_nodes_total: 131
          maximum_nodes_on_one_page: 29
          state_specific_vector_surfaces: 96
          native_executor_suites: 6/6_PASS
          repository_invariants: 13/13_PASS
          second_run_zero: 6/6_PASS
          remote_readback: PASS
          penpot_reads_by_u0: 0
          penpot_mutations_by_u0: 0
          next_owner: D0_QA_INTEGRATE_BATCH_WAVE
          build_request_comment_ids:
          {id_lines}
          ```'''
          checkpoint='\n'.join(line[10:] if line.startswith('          ') else line for line in checkpoint.splitlines())
          existing=next((c for c in comments if '<!-- ASP_CONVEYOR_CHECKPOINT_V3 -->' in c.get('body','') and 'state: U0_SIX_SMALL_PAGES_REMOTE_READY' in c.get('body','') and head in c.get('body','')),None)
          if existing: checkpoint_id=existing['id']
          else: checkpoint_id=api('POST',f'https://api.github.com/repos/{repo}/issues/{issue}/comments',{'body':checkpoint})['id']
          terminal={'schema_version':'kenigevents.u0-six-small-pages-remote-terminal.v1','remote_branch':branch,'remote_head':head,'remote_tree':tree,'parent':parent,'fast_forward':True,'force':False,'build_request_comment_ids':ids,'checkpoint_comment_id':checkpoint_id,'remote_readback':'PASS','packages':6,'pages':6,'managed_nodes_total':131,'maximum_nodes_on_one_page':29,'state_specific_vector_surfaces':96,'native_executor_suites':'6/6_PASS','repository_invariants':'13/13_PASS','second_run_zero':'6/6_PASS','penpot_reads_by_u0':0,'penpot_mutations_by_u0':0,'next_owner':'D0_QA_INTEGRATE_BATCH_WAVE'}
          Path('/tmp/u0-final/terminal.json').write_text(json.dumps(terminal,indent=2)+'\n')
          Path('/tmp/u0-final/comment-ids.txt').write_text('\n'.join(map(str,ids+[checkpoint_id]))+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('build_request_ids='+','.join(map(str,ids))+'\n')
              out.write(f'checkpoint_id={checkpoint_id}\n')
          PY

      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: u0-six-small-pages-remote-terminal
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/u0-final/remote-readback.json
            /tmp/u0-final/changed-paths.txt
            /tmp/u0-final/remote-node-tests.txt
            /tmp/u0-final/remote-python-tests.txt
            /tmp/u0-final/remote-compileall.txt
            /tmp/u0-final/terminal.json
            /tmp/u0-final/comment-ids.txt

      - name: Summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## U0 terminal publication
          - remote head: `${{ steps.readback.outputs.head }}`
          - remote tree: `${EXPECTED_TREE}`
          - parent: `${BASE_HEAD}`
          - fast-forward: `true`
          - force: `false`
          - build requests: `${{ steps.markers.outputs.build_request_ids }}`
          - checkpoint: `${{ steps.markers.outputs.checkpoint_id }}`
          - Penpot reads/mutations by U0: `0/0`
          EOF
