name: Validate and normalize global archetype corrective PR

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-corrective-20260824-r4
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823
    paths:
      - 'catalog/global-archetype-sot-v1/**'
      - 'scripts/global-archetype-sot-v1/**'
      - 'tests/global-archetype-sot-v1-*.test.mjs'
      - '.github/workflows/global-archetype-corrective-pr-hygiene.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: global-archetype-corrective-pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/global-archetype-sot-v1-corrective-20260824-r4
      BASE_BRANCH: feature/date-listing-shell-v1-20260823
      ASTRO_SHA: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
    steps:
      - name: Checkout final corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: feature/global-archetype-sot-v1-corrective-20260824-r4
          fetch-depth: 0

      - name: Require materialized corrective outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            catalog/global-archetype-sot-v1/byte-equality-proof.v1.json
            catalog/global-archetype-sot-v1/source-lock.v1.json
            catalog/global-archetype-sot-v1/penpot-materialization-plan.v1.json
            catalog/global-archetype-sot-v1/reconciliation-proofs.v1.json
            catalog/global-archetype-sot-v1/corrective-receipt.v1.json
            catalog/global-archetype-sot-v1/sha256-manifest.v1.json
            scripts/global-archetype-sot-v1/build-corrective.py
            scripts/global-archetype-sot-v1/harden-corrective.py
            tests/global-archetype-sot-v1-semantic-completeness.test.mjs
            tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing final output: $path" >&2; exit 1; }
          done

      - name: Checkout locked Astro source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 7774004b48f1dd7ffe6eaa3a77d4bd4799d92c00
          path: .astro-source
          sparse-checkout: |
            site/src
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Prove latest parent and semantic gates
        shell: bash
        env:
          EVENTS_BOT_ROOT: ${{ github.workspace }}/.astro-source
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          latest_parent="$(git rev-parse "origin/${BASE_BRANCH}")"
          git merge-base --is-ancestor "$latest_parent" HEAD
          test "$(git rev-list --count HEAD..origin/${BASE_BRANCH})" = 0
          manifest_parent="$(node -p "JSON.parse(require('fs').readFileSync('catalog/global-archetype-sot-v1/manifest.v1.json','utf8')).corrective_parent_sha")"
          test "$manifest_parent" = "$latest_parent"
          node tests/global-archetype-sot-v1-semantic-completeness.test.mjs
          node tests/global-archetype-sot-v1-corrective-boundaries.test.mjs
          git diff --check

      - name: Prove protected and unrelated parent work is untouched
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "origin/${BASE_BRANCH}")"
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --name-only "$parent"...HEAD | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          if git diff --name-only "$parent"...HEAD -- docs AGENTS.md receipts/penpot | grep -q .; then
            echo 'Operating docs or unrelated Visual Reconstruction work changed' >&2
            exit 1
          fi

      - name: Create or update the one final Draft PR
        if: github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          current_prs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls?state=open&head=onedayonemasterpiece:${TARGET_BRANCH}&base=${BASE_BRANCH}&per_page=100")"
          current_count="$(printf '%s' "$current_prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [[ "$current_count" -eq 0 ]]; then
            create_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "title": "fix(ds): evidence-bind global archetype SoT corrective delta",
              "head": os.environ["TARGET_BRANCH"],
              "base": os.environ["BASE_BRANCH"],
              "draft": True,
              "body": "Corrective PR body will be populated after fail-closed validation.",
          }))
          PY
          )"
            current_prs="[$(curl --fail --silent --show-error -X POST "${auth[@]}" "${api}/pulls" -d "$create_payload")]"
          elif [[ "$current_count" -ne 1 ]]; then
            echo "Expected zero or one final PR, found ${current_count}" >&2
            exit 1
          fi
          pr_number="$(printf '%s' "$current_prs" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["number"])')"

          body_file="$RUNNER_TEMP/final-pr-body.md"
          python3 - <<'PY' > "$body_file"
          import json
          from pathlib import Path
          root = Path('catalog/global-archetype-sot-v1')
          manifest = json.loads((root / 'manifest.v1.json').read_text())
          receipt = json.loads((root / 'corrective-receipt.v1.json').read_text())
          hashes = json.loads((root / 'sha256-manifest.v1.json').read_text())
          proof = json.loads((root / 'byte-equality-proof.v1.json').read_text())
          changed = receipt.get('changed_contracts', [])
          print('## Final corrective delta — fail-closed PASS')
          print()
          print('This is a narrow correction over the already integrated semantic core; the global SoT was not rebuilt from zero.')
          print()
          print('### Locks')
          print()
          print(f'- latest design-system feature parent: `{manifest["corrective_parent_sha"]}`')
          print(f'- pinned production Astro: `{manifest["astro_commit"]}`')
          print(f'- semantic source lock: `{manifest["source_lock_id"]}`')
          print(f'- verified handoff head: `{proof["verified_handoff_head"]}`')
          print()
          print('### Baseline byte equality')
          print()
          print(f'- route registry: `{proof["actual"]["route_archetype_registry"]}`')
          print(f'- component graph: `{proof["actual"]["component_composition_graph"]}`')
          print(f'- 17-contract checksum manifest: `{proof["actual"]["archetype_contracts_sorted_manifest"]}`')
          print('- route registry remains byte-identical after the correction.')
          print()
          print('### Corrective boundaries')
          print()
          print('- Semantic source lock excludes design-tool IR, IDs, evidence and renderer data.')
          print('- Materialization plan is UI-only: foundations, reusable UI, visual patterns, desktop/mobile compositions and visible UI states.')
          print('- Unproved requested states remain explicit `unresolved`.')
          print('- Every effective reuse/new disposition has exact source identities and refs; multi-identity candidates require a Git semantic reconciliation proof.')
          print('- Consumer-specific foundations are recorded for all 17 archetypes.')
          print()
          print('### Changed contracts')
          print()
          for item in changed:
              scopes = ', '.join(item.get('change_scopes', []))
              print(f'- `{item["file"]}` — `{item["sha256"]}` — {scopes}')
          print()
          print('### Summary')
          print()
          print(f'- high-risk state evidence: `{json.dumps(receipt.get("high_risk_state_evidence", {}), ensure_ascii=False)}`')
          print(f'- component identity gate: `{json.dumps(receipt.get("component_identity_gate", {}), ensure_ascii=False)}`')
          print(f'- corrective SHA-256 manifest files: `{len(hashes.get("files", {}))}`')
          print()
          print('### Constraints')
          print()
          print('- no Penpot mutation;')
          print('- no Date/Weekend artifact changes;')
          print('- no production Astro changes;')
          print('- no merge, promotion or deploy;')
          print('- Draft PR only.')
          PY
          patch_payload="$(python3 - "$body_file" <<'PY'
          import json,sys
          print(json.dumps({"title": "fix(ds): evidence-bind global archetype SoT corrective delta", "body": open(sys.argv[1], encoding="utf-8").read(), "draft": True, "maintainer_can_modify": True}))
          PY
          )"
          curl --fail --silent --show-error -X PATCH "${auth[@]}" "${api}/pulls/${pr_number}" -d "$patch_payload" >/dev/null

          for staging in \
            feature/global-archetype-sot-v1-corrective-20260824 \
            feature/global-archetype-sot-v1-corrective-20260824-r2 \
            feature/global-archetype-sot-v1-corrective-20260824-r3 \
            feature/global-archetype-sot-v1-20260824-r4; do
            staging_prs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls?state=open&head=onedayonemasterpiece:${staging}&per_page=100")"
            printf '%s' "$staging_prs" | python3 -c 'import json,sys; [print(p["number"]) for p in json.load(sys.stdin)]' | while read -r number; do
              [[ -z "$number" ]] && continue
              comment_payload="$(python3 - "$TARGET_BRANCH" <<'PY'
          import json,sys
          print(json.dumps({"body": f"Superseded by the validated clean corrective child branch `{sys.argv[1]}`. Closing without merge."}))
          PY
          )"
              curl --fail --silent --show-error -X POST "${auth[@]}" "${api}/issues/${number}/comments" -d "$comment_payload" >/dev/null
              curl --fail --silent --show-error -X PATCH "${auth[@]}" "${api}/pulls/${number}" -d '{"state":"closed"}' >/dev/null
            done
          done

          final_prs="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls?state=open&head=onedayonemasterpiece:${TARGET_BRANCH}&base=${BASE_BRANCH}&per_page=100")"
          test "$(printf '%s' "$final_prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 1
          final_number="$(printf '%s' "$final_prs" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["number"])')"
          test "$final_number" = "$pr_number"
          echo "Final Draft PR: ${api%/repos/*}/${GITHUB_REPOSITORY}/pull/${pr_number}"
