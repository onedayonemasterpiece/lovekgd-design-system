name: Validate Historical Project Normalization Synthesis v1

on:
  push:
    paths:
      - 'catalog/normalization/**'
      - 'contracts/**normalization**'
      - 'docs/normalization/**'
      - 'receipts/normalization/**'
      - 'scripts/**/*normalization*'
      - '.github/workflows/project-normalization-synthesis-v1.yml'
  pull_request:
    paths:
      - 'catalog/normalization/**'
      - 'contracts/**normalization**'
      - 'docs/normalization/**'
      - 'receipts/normalization/**'
      - 'scripts/**/*normalization*'
      - '.github/workflows/project-normalization-synthesis-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Checkout exact read-only product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: 66bc0d43e36299417626f992021cfb7299ddf704
          path: _pinned-events-readonly
          fetch-depth: 1

      - name: Revalidate the published v1 at its immutable merge commit
        shell: bash
        run: |
          set -euo pipefail
          historical="$RUNNER_TEMP/project-normalization-synthesis-v1"
          git worktree add --detach "$historical" 317938bc72cf7a47ea798b2614d92d3d285dd97a
          test "$(git -C "$historical" rev-parse HEAD:catalog/component-decoder/decoder-v1-snapshot-20260808T124842-4786ac53bc)" = \
            'e77fc2457fadfdffb46ed2d90304ebb91e89a715'
          node "$historical/scripts/validate-component-decoder-snapshot.mjs" \
            "$historical/catalog/component-decoder/decoder-v1-snapshot-20260808T124842-4786ac53bc"
          node "$historical/scripts/validate-behavioral-decoder-supplement-v1-1.mjs" \
            "$historical/catalog/component-decoder/behavioral-supplement-v1.1-snapshot-20260808T124842-4786ac53bc"
          node "$historical/scripts/validate-project-normalization-synthesis-v1.mjs" "$historical" \
            --events-repo "$GITHUB_WORKSPACE/_pinned-events-readonly"

      - name: Prove the current branch did not mutate immutable Decoder v1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:catalog/component-decoder/decoder-v1-snapshot-20260808T124842-4786ac53bc)" = \
            'e77fc2457fadfdffb46ed2d90304ebb91e89a715'
          test -z "$(git -C _pinned-events-readonly status --porcelain)"
