name: Validate Event Card Taxonomy Candidate v1
on:
  pull_request:
    paths:
      - 'catalog/normalization/families/event-preview-representations/event-card-taxonomy-candidate-v1.json'
      - 'catalog/normalization/families/event-preview-representations/screenshot-consumer-bindings-v1.json'
      - 'catalog/normalization/families/event-preview-representations/event-card-visual-spec-candidate-v1.json'
      - 'contracts/normalization/event-card-*.schema.json'
      - 'scripts/validate-event-card-taxonomy-candidate-v1.*'
      - 'tests/event-card-taxonomy-candidate-v1-negative.mjs'
      - '.github/workflows/event-card-taxonomy-candidate-v1.yml'
  push:
    paths:
      - 'catalog/normalization/families/event-preview-representations/event-card-taxonomy-candidate-v1.json'
      - 'catalog/normalization/families/event-preview-representations/screenshot-consumer-bindings-v1.json'
      - 'catalog/normalization/families/event-preview-representations/event-card-visual-spec-candidate-v1.json'
      - 'contracts/normalization/event-card-*.schema.json'
      - 'scripts/validate-event-card-taxonomy-candidate-v1.*'
      - 'tests/event-card-taxonomy-candidate-v1-negative.mjs'
      - '.github/workflows/event-card-taxonomy-candidate-v1.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install jsonschema
      - run: python3 scripts/validate-event-card-taxonomy-candidate-v1.py --root .
      - run: node tests/event-card-taxonomy-candidate-v1-negative.mjs
