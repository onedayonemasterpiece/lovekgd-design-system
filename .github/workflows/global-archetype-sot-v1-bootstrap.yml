name: Bootstrap global archetype SoT v1

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-20260824-r3
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823

permissions:
  contents: write

concurrency:
  group: global-archetype-sot-v1-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 149cc9c56a1245e846c1abc614723078c3417cb7
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify payload and materialize source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          archive="$RUNNER_TEMP/global-archetype-sot-v1.tar.gz"
          cat .bootstrap/global-archetype-sot-v1-v2/chunk-* | base64 --decode > "$archive"
          printf '%s  %s\n' a025652a9332785c402c6c4fdaefeee8ccb71bf7f02bae16a3e6d652c02d123e "$archive" | sha256sum --check --strict
          tar -tzf "$archive"
          tar -xzf "$archive" -C .
          rm -rf .bootstrap .github/workflows/global-archetype-sot-v1-bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('catalog/global-archetype-sot-v1/README.md'),
              Path('scripts/global-archetype-sot-v1/build.mjs'),
          ):
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Build and run fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/global-archetype-sot-v1/build.mjs
          node --check scripts/global-archetype-sot-v1/validate.mjs
          node scripts/global-archetype-sot-v1/build.mjs
          node scripts/global-archetype-sot-v1/validate.mjs
          node tests/global-archetype-sot-v1.test.mjs
          git diff --check

      - name: Pack verified clean result
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/global-archetype-sot-v1-final.tar.gz"
          tar -czf "$artifact" \
            .github/workflows/global-archetype-sot-v1.yml \
            catalog/global-archetype-sot-v1 \
            scripts/global-archetype-sot-v1 \
            scripts/reconstruction-atlas/build-global-archetype-sot.mjs \
            tests/global-archetype-sot-v1.test.mjs
          sha256sum "$artifact" | tee "$RUNNER_TEMP/global-archetype-sot-v1-final.sha256"

      - name: Upload verified result
        uses: actions/upload-artifact@v4
        with:
          name: global-archetype-sot-v1-final
          path: |
            ${{ runner.temp }}/global-archetype-sot-v1-final.tar.gz
            ${{ runner.temp }}/global-archetype-sot-v1-final.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified result to the real child branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf node_modules
          git add -- \
            .github/workflows/global-archetype-sot-v1.yml \
            catalog/global-archetype-sot-v1 \
            scripts/global-archetype-sot-v1 \
            scripts/reconstruction-atlas/build-global-archetype-sot.mjs \
            tests/global-archetype-sot-v1.test.mjs
          git add -u -- .bootstrap .github/workflows/global-archetype-sot-v1-bootstrap.yml
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --cached --name-only | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'global-archetype-sot-bot'
          git config user.email 'global-archetype-sot-bot@users.noreply.github.com'
          git commit -m 'feat(ds): assemble global archetype SoT v1'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
