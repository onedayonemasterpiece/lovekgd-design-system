name: Bootstrap global archetype SoT v1

on:
  push:
    branches:
      - feature/global-archetype-sot-v1-20260824-r3
  pull_request:
    branches:
      - feature/date-listing-shell-v1-20260823

permissions:
  contents: write

concurrency:
  group: global-archetype-sot-v1-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack-build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 149cc9c56a1245e846c1abc614723078c3417cb7
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify payload and materialize source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          cat > "$RUNNER_TEMP/parts.sha256" <<'CHECKSUMS'
          4d81a17e7273b1b1629fa7e25d647f30da5ce69d6389f623137427b491c112aa  .bootstrap/global-archetype-sot-v1/part-00
          ade3b8db7b3b7c570ea21ad640827606270360ac8c3e7f1e008e4bcdaf13a88a  .bootstrap/global-archetype-sot-v1/part-01
          227c4b86ffef8faae1e0b05dbf1ca36eb68c34305a15537fdfb69d461ab9f0bd  .bootstrap/global-archetype-sot-v1/part-02
          CHECKSUMS
          sha256sum --check --strict "$RUNNER_TEMP/parts.sha256"

          archive="$RUNNER_TEMP/global-archetype-sot-v1.tar.gz"
          cat .bootstrap/global-archetype-sot-v1/part-* | base64 --decode > "$archive"
          printf '%s  %s\n' a025652a9332785c402c6c4fdaefeee8ccb71bf7f02bae16a3e6d652c02d123e "$archive" | sha256sum --check --strict
          tar -tzf "$archive"
          tar -xzf "$archive" -C .
          rm -rf .bootstrap .github/workflows/global-archetype-sot-v1-bootstrap.yml

      - name: Build and run fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/global-archetype-sot-v1/build.mjs
          node --check scripts/global-archetype-sot-v1/validate.mjs
          node scripts/global-archetype-sot-v1/build.mjs
          node scripts/global-archetype-sot-v1/validate.mjs
          node tests/global-archetype-sot-v1.test.mjs
          git diff --check

      - name: Commit clean source and generated SoT
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          protected='^(catalog/page-archetypes/(date-listing-shell-v1|weekend-listing-v1)/|tests/(date-listing-shell-v1|weekend-listing-v1)\.test\.mjs$|receipts/(penpot|ui-conformance)/(date-listing|date-listing-shell-v1|weekend|weekend-listing-v1)(/|-))'
          if git diff --cached --name-only | grep -E "$protected"; then
            echo 'Protected Date/Weekend artifact changed' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'global-archetype-sot-bot'
          git config user.email 'global-archetype-sot-bot@users.noreply.github.com'
          git commit -m 'feat(ds): assemble global archetype SoT v1'
          git push origin "HEAD:${TARGET_BRANCH}"
