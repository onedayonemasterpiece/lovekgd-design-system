name: Publish Runtime-Derived Design System 005 from latest pages

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/runtime-derived-005-latest-pages
    paths:
      - 'prototypes/penpot-runtime-derived-005/**'
      - '.github/workflows/penpot-runtime-derived-005.yml'

permissions:
  contents: write

concurrency:
  group: penpot-runtime-derived-005
  cancel-in-progress: true

jobs:
  build-runtime-inventory-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout design-system delivery branch
        uses: actions/checkout@v4
        with:
          ref: prototype/runtime-derived-005-latest-pages
          fetch-depth: 0

      - name: Checkout newest product main
        uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: main
          path: .source/events-bot-new
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: .source/events-bot-new/site/package-lock.json

      - name: Build, decode every latest page, validate and publish
        shell: bash
        run: bash prototypes/penpot-runtime-derived-005/scripts/ci-run.sh

      - name: Upload runtime inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: penpot-runtime-derived-005-${{ github.run_id }}
          path: prototypes/penpot-runtime-derived-005/catalog/receipt.json
          if-no-files-found: warn
          retention-days: 30
