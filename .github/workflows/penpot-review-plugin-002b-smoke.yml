name: Penpot current mirror prototype 002B contract

on:
  pull_request:
    paths:
      - 'prototypes/penpot-review-plugin-002b/**'
      - '.github/workflows/penpot-review-plugin-002b-smoke.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/penpot-review-plugin-002b-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check Penpot runtime and UI script
        shell: bash
        run: |
          set -euo pipefail
          node --check prototypes/penpot-review-plugin-002b/dist/plugin-current.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('prototypes/penpot-review-plugin-002b/dist/ui.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/penpot-002b-ui.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/penpot-002b-ui.js

      - name: Validate compressed load corpus and structural Wave B
        run: node prototypes/penpot-review-plugin-002b/scripts/validate-compressed.mjs

      - name: Reproduce Wave A and Wave B source JSON
        shell: bash
        run: |
          set -euo pipefail
          node prototypes/penpot-review-plugin-002b/scripts/generate-catalog.mjs --out /tmp/catalog-a.json
          WAVE=B node prototypes/penpot-review-plugin-002b/scripts/generate-catalog.mjs --out /tmp/catalog-b.json
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          pairs = [
              ('prototypes/penpot-review-plugin-002b/catalog/catalog.json.gz.b64', '/tmp/committed-a.json'),
              ('prototypes/penpot-review-plugin-002b/catalog/catalog.wave-b.json.gz.b64', '/tmp/committed-b.json'),
          ]
          for source, target in pairs:
              encoded = Path(source).read_text(encoding='utf-8').strip()
              Path(target).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          cmp /tmp/catalog-a.json /tmp/committed-a.json
          cmp /tmp/catalog-b.json /tmp/committed-b.json

      - name: Verify immutable UI delivery
        shell: bash
        run: |
          set -euo pipefail
          ui_sha="$(sed -n "s/.*const UI_SHA = '\([0-9a-f]\{40\}\)'.*/\1/p" prototypes/penpot-review-plugin-002b/dist/plugin-current.js)"
          test -n "$ui_sha"
          url="https://raw.githack.com/onedayonemasterpiece/lovekgd-design-system/${ui_sha}/prototypes/penpot-review-plugin-002b/dist/ui.html"
          headers="$(curl --silent --show-error --location --fail --retry 3 --max-time 30 --head "$url")"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^content-type: *text/html'
