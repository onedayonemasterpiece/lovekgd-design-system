notes:
  - known_baseline is descriptive and may advance without changing this profile.
  - This profile specializes the canonical contract and does not restate or override global policy.
  - A UI SoT may reference bytes stored elsewhere, but it must centrally own immutable content-addressed bindings.
  - No Penpot materialization is authorized until asset and geometry blockers are resolved.
