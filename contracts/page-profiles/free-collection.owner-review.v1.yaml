reference_case:
  scenario_mobile: free-collection-september-mobile-v3
  fixture_corpus: ui-reference-events.v2
  fixture_order:
    - event.real.8006
    - event.real.8200
    - event.real.2182
    - event.real.6711
    - event.real.7609
  reference_iso: 2026-08-29T14:00:00+02:00
  timezone: Europe/Kaliningrad
  locale: ru-RU

required_review_surfaces:
  desktop:
    viewport: 1280xauto
    states: [top, scrolled, full]
  mobile:
    viewport: 390x844
    states: [top, scrolled, full]

local_acceptance:
  inherited_global_contract_gates: true
  factual_exactness:
    expected_event_count: 5
    all_events_free_in_reference_case: true
    exact_fields:
      - fixture_id
      - order
      - grouping
      - content
      - date
      - time
      - admission
      - place
      - counts
      - image
      - crop_and_focal_intent
    stale_or_cross_fixture_data_allowed: false
  visual_regions:
    - media_crop
    - title_and_text_wrapping
    - metadata
    - calendar_and_utility_actions
    - feedback_and_social_proof
    - shell_and_mobile_navigation
  interaction_semantics:
    - calendar
    - not_interested
    - share
    - like_or_interest
    - mobile_navigation
  immutable_asset_identity_required: true
  exact_geometry_proof_required: true
  fallback_icons_allowed: false
  approximate_geometry_allowed: false
  cancelled_or_unreceipted_run_allowed: false

asset_bindings:
  status: BLOCKED_UNRESOLVED_ASSET_IDENTITY
  required_slots:
    - asset_id: icon.action.not_interested
      semantic_slot: card.utility.not_interested
      registry_status: UNRESOLVED_BLOCKING
    - asset_id: icon.action.calendar_add
      semantic_slot: card.primary_action.calendar_add
      registry_status: UNRESOLVED_BLOCKING
    - asset_id: icon.action.share
      semantic_slot: card.social.share
      registry_status: UNRESOLVED_BLOCKING
    - asset_id: icon.action.favorite
      semantic_slot: card.social.favorite
      registry_status: UNRESOLVED_BLOCKING
  acceptance:
    exact_source_path_required: true
    immutable_commit_required: true
    git_blob_sha1_or_sha256_required: true
    svg_view_box_required: true
    nominal_icon_box_required: true
    fill_stroke_contract_required: true
    astro_consumer_binding_required: true
    penpot_consumer_binding_required: true
    owner_disposition_required: true

geometry_proof:
  status: BLOCKED_UNRESOLVED_GEOMETRY
  authority: pinned_astro_computed_style_and_source
  critical_regions:
    - event_card_outer_surface
    - event_card_media_mask
    - admission_pill
    - calendar_primary_action
    - not_interested_action
    - social_action_row
    - share_control
    - favorite_control
  required_context:
    - astro_repository
    - astro_commit
    - source_component_path
    - selector_or_state_identity
    - scenario_id
    - viewport
    - dpr
    - font_set
    - locale
    - fixture_id
    - reference_clock
  required_properties:
    - width
    - height
    - border_radius_top_left
    - border_radius_top_right
    - border_radius_bottom_right
    - border_radius_bottom_left
    - border_width
    - border_style
    - overflow
    - clipping_or_mask
    - padding
    - gap
    - alignment
    - aspect_ratio
    - icon_box
    - icon_text_gap
    - resolved_token_name_and_value
  proof_status:
    event_card_outer_surface: unresolved
    event_card_media_mask: unresolved
    admission_pill: unresolved
    calendar_primary_action: unresolved
    not_interested_action: unresolved
    social_action_row: unresolved
    share_control: unresolved
    favorite_control: unresolved

materialization:
  status: BLOCKED
  allowed_to_mutate_penpot: false
  blockers:
    - asset-bindings-not-content-addressed
    - geometry-not-proven-from-pinned-astro-computed-style
    - materialization-provenance-receipt-missing
    - stop-cancel-semantics-not-proven
    - owner-rejected-current-frame
  resume_condition:
    - resolve all required asset identities
    - record exact geometry proof for every critical region
    - start a new explicitly identified materialization run
    - prove active lease and cancellation checks
    - emit a complete provenance receipt

provenance_receipt_requirements:
  required: true
  fields:
    - run_id
    - actor_type
    - actor_id
    - triggered_by
    - astro_repository
    - astro_commit
    - route
    - scenario
    - viewport
    - ui_sot_repository
    - ui_sot_commit
    - requirements_contract_hash
    - page_profile_hash
    - asset_registry_hash
    - materializer_name
    - materializer_version
    - materializer_commit
    - started_at
    - completed_at
    - final_state
    - penpot_file_id
    - penpot_page_id
    - penpot_frame_ids
    - mutation_count
    - mutated_object_ids
    - asset_binding_digest
    - geometry_proof_digest
    - validation_result
    - owner_review_state
  missing_receipt_result: NON_ACCEPTED_EVIDENCE

run_control:
  states: [ACTIVE, CANCEL_REQUESTED, CANCELLED, COMPLETED, FAILED, STALE]
  owner_stop_prevents_later_mutations: true
  queued_writes_recheck_active_run_lease: true
  post_cancel_mutation_is_invalid: true
  stale_run_may_promote_frame: false
  continued_mutation_proves_executor_identity: false

owner_review_incident:
  incident_id: free-collection-penpot-visual-drift-2026-08-30
  date: '2026-08-30'
  owner_decision: REJECTED
  observed:
    - Иконки не соответствуют Astro и ранее согласованному визуальному языку дизайн-системы.
    - Использованы визуально общие или подменённые символы без доказанной asset identity.
    - Скругления, pill-формы и геометрия карточки заметно расходятся с референсом.
    - После owner stop наблюдались дальнейшие изменения Penpot.
  diagnosis:
    - The previous profile named semantic interactions but did not bind exact graphical asset bytes.
    - The previous profile did not require per-region computed-style geometry proof before mutation.
    - Executor identity and cancellation state were not proven by a materialization receipt.
  attribution:
    codex_or_other_executor_proven: false
    note: >
      Continued mutations are evidence of missing provenance/run control, not
      proof that Codex or any named actor performed them.
  consequence:
    current_penpot_snapshot_approved: false
    current_penpot_snapshot_may_be_used_as_visual_truth: false
    owner_review_may_resume: false

