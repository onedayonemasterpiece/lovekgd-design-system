    astro-icon-fragment-to-standalone-svg.v1:
      - select only the Icon.astro conditional branch named by source_symbol
      - preserve path and polygon order and all geometry attributes byte-for-byte
      - use the exact runtime viewBox selected by Icon.astro
      - wrap with xmlns and fill=currentColor
      - do not simplify, redraw, normalize coordinates, convert fill to stroke, or substitute a library icon
      - serialize UTF-8 with LF and one final newline
    mobile-bottom-nav-inline-svg-to-standalone-svg.v1:
      - select only the inline SVG child for the exact data-mobile-nav-section
      - preserve path order and all geometry/fill-rule/clip-rule attributes
      - preserve viewBox 0 0 24 24 and render within the current 21px consumer box
      - wrap with xmlns and fill=currentColor
      - do not simplify, redraw, normalize coordinates, convert fill to stroke, or substitute a library icon
      - serialize UTF-8 with LF and one final newline
  fallback_policy: forbidden
  unresolved_binding_result: BLOCKED_UNRESOLVED_ASSET_IDENTITY
  mutate_accepted_penpot_frame_when_unresolved: false
  forbidden_substitutions:
    - emoji
    - unicode_glyph
    - penpot_builtin_icon
    - generic_icon_library
    - manually_redrawn_similar_icon
    - placeholder_svg
    - semantic_search_candidate_without_approval

