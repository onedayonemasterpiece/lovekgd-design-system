    final_visual_skin: deferred_to_owner_generative_design
    implementation_stage: schematic_composition_actions_states_and_accessibility
    primary_secondary_and_page_context_navigation_must_not_duplicate: true
    island_navigation_notification_stacking_owned_together: true
    preserve_working_mobile_navigation_during_migration: true
    navigation_does_not_inherit_notification_auto_dismiss_timer: true
    approval_is_implementation_or_browser_acceptance: false
    amendment:
      before: desktop_dock_was_a_recommendation_awaiting_owner_choice
      after: bottom_floating_island_navigation_approved_on_both_device_classes
      reason: explicit_owner_confirmation_and_floating_island_format_clarification
      consequences: CODE_implements_shared_shell_variants_VISUAL_and_MATERIALS_use_approved_form_REVIEW_checks_both
      type: BOUNDED_STAGE_AMENDMENT
      approved: explicit_owner_reply_2026_09_05
  amendment:
    before: no_Penpot_mutation_and_runtime_only_agent_routing_with_insufficient_visible_completion_criteria
    after: visible_convergence_required_bounded_four_native_catalogs_shared_bottom_surfaces_and_CODE_delivery
