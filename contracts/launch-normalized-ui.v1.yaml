schema: kenigevents.launch-normalized-ui.v1
version: 1.6.0
status: ACTIVE
coordination_issue: onedayonemasterpiece/events-bot-new#621
parallel_roles_doc: docs/launch-normalization/PARALLEL-WINDOWS.md
consultant_doc: docs/launch-normalization/CONSULTANT-K0.md
status_doc: docs/launch-normalization/STATUS.md

authority:
  executable_ui:
    repository: onedayonemasterpiece/events-bot-new
    branch: integration/ui-normalization-launch-20260902
  thin_sot_and_penpot_delivery:
    repository: onedayonemasterpiece/lovekgd-design-system
    branch: integration/launch-normalized-sot-penpot-20260902
  penpot:
    file_id: 40e06342-8830-80d6-8008-8fc8a3a4cd4f
    sole_writer: R0.PENPOT

execution_reality:
  chatgpt_turns_are_background_daemons: false
  completed_chatgpt_turn_self_resumes: false
  prompt_can_change_that_platform_fact: false
  stopped_chatgpt_windows_are_persistent_workers: false
  zero_touch_after_native_session_exit_requires_external_supervisor: true
  external_supervisor_currently_authorized: false
  current_true_persistent_worker_count: 1
  current_true_persistent_worker: R0_native_Codex
  full_parallel_persistence_requires:
    - multiple_native_Codex_sessions
    - or_an_authorized_external_supervisor
  K0_may_not_describe_burst_windows_as_always_on_workers: true

execution_surfaces:
  burst_specialists:
    K0: ChatGPT_GitHub
    N0: ChatGPT_GitHub
    F0: ChatGPT_GitHub
    M0: ChatGPT_GitHub
    A0: ChatGPT_GitHub
    V0: ChatGPT_GitHub_my_browser_bridge
  persistent_executor:
    R0: native_Codex_local_shell_git_gh
  codex_devcoveer_in_role_windows: forbidden

burst_specialist_contract:
  purpose:
    - deep_source_and_consumer_analysis
    - product_and_semantic_decisions
    - broad_bounded_direct_GitHub_batches
    - independent_review
    - browser_verdict_for_V0
  expected_behavior_inside_one_turn:
    - build_full_owned_backlog
    - process_multiple_distinct_items_when_available
    - checkpoint_without_treating_checkpoint_as_end
    - continue_until_context_tool_limit_or_true_frontier
  persistence_after_turn: none
  activation_policy:
    - initial_deep_batch
    - genuine_semantic_question_from_R0
    - independent_review_of_material_candidate
    - V0_exact_preview_trigger
  forbidden_process_assumption:
    - that_a_finished_chatgpt_window_will_keep_watching_GitHub
    - that_more_prompt_wording_creates_background_execution
    - that_owner_should_rewake_every_micro_step

R0_principal_executor:
  mission:
    - reach_first_exact_browser_testable_normalized_preview
    - close_ready_technical_backlog_until_ASTRO_NORMALIZATION_PASS
    - execute_thin_S_Penpot_and_release_mechanics_when_gates_open
  backlog_sources:
    - current_issue_621
    - current_integration_ref_and_ancestry
    - latest_role_branches_and_results
    - source_and_actual_consumer_census
    - failing_tests_builds_checks
    - local_browser_smoke
    - V0_DRIFT_and_available_role_fixes
    - thin_S_Penpot_release_requirements
  loop:
    - fresh_read_issue_refs_worktrees_contract
    - identify_nearest_unclosed_product_gate
    - recompute_ready_reversible_backlog
    - select_highest_value_item
    - freeze_SHAs_only_as_transaction_evidence
    - implement_merge_test_build_publish
    - fix_recoverable_tooling_and_regression_defects
    - checkpoint
    - fresh_read_and_continue
  may_decide_autonomously:
    - reversible_technical_implementation_details
    - refactor_and_API_details_determined_by_existing_product_behavior
    - component_and_consumer_migrations_required_by_canonical_invariants
    - ordinary_merge_resolution
    - regression_fixture_and_test_repairs
    - worktree_and_build_sequence
    - latest_accepted_ref_selection
    - local_browser_smoke_and_diagnostics
  may_not_decide_autonomously:
    - new_product_behavior
    - changed_user_facing_semantics
    - palette_or_visual_redesign
    - removal_of_intentional_route_composition
    - irreversible_production_or_data_mutation_without_authorization
    - Penpot_write_before_gate
    - final_independent_V0_verdict
  escalation_rule:
    - escalate_only_genuine_product_choice_irreconcilable_writer_conflict_or_irreversible_risk
    - continue_all_other_ready_backlog_while_question_is_routed
  stop_rule:
    - current_product_gate_reached
    - no_ready_work_after_short_active_watch
    - genuine_safety_or_semantic_boundary
    - actual_platform_context_or_runtime_limit
  forbidden_stop_reasons:
    - one_merge_completed
    - one_build_completed
    - one_RESULT_published
    - one_SHA_list_exhausted
    - missing_formal_packet
    - recoverable_tooling_defect
  waiting_policy:
    local_process:
      prefer: foreground_or_wait_PID_and_tail_log
      blind_sleep_seconds_over_15: forbidden
      polling_if_unavoidable_seconds: [5, 10, 15]
    remote_trigger:
      execute_other_ready_backlog_first: true
      poll_interval_seconds: [10, 15]
      maximum_minutes: 2
      repeated_indefinite_watch: forbidden

backlog_evidence:
  self_declared_backlog_is_proof: false
  self_declared_exhaustion_is_proof: false
  pass_requires_one_of:
    - multiple_distinct_ready_items_processed_in_one_run_when_available
    - actual_product_gate_reached
  stop_start_pattern_while_owned_work_exists: BACKLOG_NOT_FORMING
  standby_evidence:
    ready_owned_items: 0
    exact_external_trigger_required: true

current_product_path:
  - R0_integrate_latest_safe_accepted_work
  - R0_run_reproducible_same_data_and_fresh_data_builds
  - R0_publish_exact_reachable_normalized_preview
  - V0_one_independent_full_browser_audit
  - R0_and_owning_specialist_close_DRIFT
  - repeat_until_ASTRO_NORMALIZATION_PASS
  - thin_S_and_Penpot
  - checked_release_candidate

N0_policy:
  current_role: burst_acceptance_and_release_policy_owner
  persistent_execution_owner: R0
  chain:
    - candidate_acceptance_policy
    - baseline_acceptance_criteria
    - conditional_promotion_policy
    - fresh_generation_and_publication_policy
    - review_of_material_output_when_invoked
  dispatch_or_authorization_is_product_result: false

F0_policy:
  burst_role: foundations_semantic_review_and_large_direct_GitHub_batches
  persistent_implementation_fallback: R0_within_existing_invariants
  owns_intent:
    - typography
    - spacing_geometry
    - semantic_colors
    - exactly_four_icon_roles
    - canonical_SVG_identity

M0_policy:
  burst_role: component_family_semantic_review_and_large_direct_GitHub_batches
  persistent_implementation_fallback: R0_within_existing_invariants
  owns_intent:
    - component_identity
    - MediaFrame
    - EventCard_and_ListingEventCard
    - AdaptiveEventCardGrid
    - EventMediaRail

A0_policy:
  burst_role: route_composition_review_and_large_consumer_migration_batches
  persistent_implementation_fallback: R0_within_existing_invariants
  owns_intent:
    - shell
    - actual_routes
    - consumer_migration
    - intentional_composition_preservation

V0_policy:
  burst_role: independent_browser_DOM_computed_style_auditor
  persistent_background_watch: false
  trigger: exact_reachable_integrated_preview
  one_run_scope:
    - full_required_route_matrix
    - desktop_wide_compact_and_mobile
    - breakpoint_seams
    - DRIFT_routing
  R0_may_run_preflight_browser_smoke: true
  R0_may_issue_final_V0_PASS: false

actual_route_model:
  date_routes:
    - /segodnya/
    - /zavtra/
    - /date-YYYY-MM-DD/
    shared_surface: DateListingSurface
  weekend_routes:
    - /vyhodnye/
    - /vyhodnye/YYYY-MM-DD/
    shared_surface: WeekendListingSurface
  free_collection:
    route: /podborki/besplatnye-sobytiya/
    shared_surface: FreeCollectionSurface
  date_and_weekend_are_distinct_compositions: true

normalization_invariants:
  same_visual_behavior_means_one_family_root: true
  one_anatomy_and_CSS_owner: true
  one_canonical_SVG_per_semantic_action: true
  all_visible_colors_tokenized: true
  same_role_duplicates_merged: true
  icon_size_role_count: 4
  component_local_icon_dimensions: forbidden
  shared_MediaFrame_owns_framing: true
  one_AdaptiveEventCardGrid_for_applicable_surfaces: true
  actual_consumers_must_use_canonical_roots: true
  diagnostics_required:
    - data-ds-family
    - data-ds-version
    - data-ds-variant
    - data-ds-state_when_applicable
  product_UI_gap_and_redesign_before_ASTRO_NORMALIZATION_PASS: forbidden

owner_review:
  first_surface: first_normalized_fresh_real_data_preview
  entrypoint_template: /<buildId>/__preview/
  exact_clickable_url_required: true
  new_owner_facing_lab_pages: forbidden

normalization_gate:
  id: ASTRO_NORMALIZATION_PASS
  required:
    - reproducible_fresh_generation
    - tokenized_foundations_and_colors
    - four_icon_roles_across_consumers
    - single_component_roots
    - MediaFrame_browser_pass
    - AdaptiveEventCardGrid_across_applicable_consumers
    - actual_routes_migrated
    - no_critical_V0_DRIFT
  opens:
    - product_UI_gap_work
    - palette_exploration
    - interface_redesign

not_a_new_system:
  new_repository: forbidden
  second_Astro_implementation: forbidden
  new_owner_facing_lab: forbidden
  mandatory_packet_schema: forbidden
  owner_as_message_bus: forbidden
  owner_as_micro_task_scheduler: forbidden
  pretending_ChatGPT_windows_are_background_workers: forbidden
