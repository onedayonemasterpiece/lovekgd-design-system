    no_feasible_group: balanced_cover_target_minimizing_worst_crop_preserving_all_events
    prohibited_substitutes: [stretch, blur_padding, repeated_edges, dropped_events, fake_text_safety]
    missing_or_broken_resource: distinct_truthful_fallback_not_loaded_media_exception
    clarification:
      supersedes: proof_required_contain_fallback_and_hard_twenty_percent_veto
      approved_by: owner_CODE_continuation_2026_09_05_no_fields_final_crop
