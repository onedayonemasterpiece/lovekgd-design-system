    modal_focus_and_nonmodal_announcements_are_not_interchangeable: true
    shared_safe_area_keyboard_navigation_and_island_non_occlusion: true
    browser_OS_share_auth_and_permission_surfaces_are_not_reimplemented: true
    semantic_exceptions_do_not_exempt_app_owned_surfaces_from_visual_migration: true
  primary_navigation:
    decision_required: false
    status: OWNER_APPROVED_IMPLEMENTATION_PENDING
    decision_date: '2026-09-05'
    decision: shared_four_destination_bottom_floating_island_on_mobile_and_desktop
    owner_approval: explicit_followup_bottom_bar_also_in_floating_island_format
