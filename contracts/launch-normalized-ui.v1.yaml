    labels_include: [semantic_identity, variant_state, source_owner, actual_usage, active_or_disabled_or_deprecated]
    include_product_used_items_and_owner_existing_recoverable_materials: true
    obsolete_donors_are_not_active_runtime_authority: true
    restore_existing_pages_idempotently_not_duplicate: true
    preserve_existing_work_and_use_bounded_donor_recovery: true
    preliminary_current_source_catalog_must_be_marked_unaccepted: true
    refresh_changed_bindings_against_final_candidate: true
    native_exports_visual_review_and_exact_page_links_required: true
    product_feature_activation_authorized: false
    unrelated_full_page_materialization_required: false
    A_equals_S_equals_P_claim_authorized: false
  bottom_surfaces:
    status: REQUIRED_MIGRATION_NOT_IMPLEMENTED_BY_THIS_AMENDMENT
    all_app_owned_modal_and_notification_consumers_in_scope: true
    canonical_shared_visual_family_and_lifecycle: true
    placement: bottom_at_desktop_and_mobile_with_responsive_width
    reuse_existing_roots_and_timer_where_correct: true
    distinguish_semantics: [interactive_dialog, passive_notification]
    timed_notification_has_visible_remaining_time_and_manual_close: true
    form_confirmation_actionable_error_or_pending_operation_must_not_expire: true
    countdown_is_not_a_drag_handle: true
    timer_pauses_for_interaction_and_obscured_or_hidden_context: true
