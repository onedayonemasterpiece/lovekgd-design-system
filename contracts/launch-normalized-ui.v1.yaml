    preferred_total_area_fraction: 0.2
    preferred_budget_is_hard_veto: false
    preserve_important_text: use_best_available_current_evidence_without_fabricated_proof
    unproven_text_safety: explicit_minimal_cover_fallback_not_contain_fields
    loaded_media_letterboxing_allowed: false
    natural_ratio_contain_without_fields_allowed: true
    composition_order: [full_eligible_pool_grouping_before_first_page_limit, compatible_natural_ratio_grouping_with_visual_fillers, safest_proven_crop, minimal_cover_fallback]
    fallback_binding: {treatment: document-fallback-cover, permission: fallback-minimal, unproven_safety: unverified-text}
    joint_acceptance: [painted_image_bounds, truthful_crop_safety, all_admitted_ids, row_geometry, stable_visible_order]
