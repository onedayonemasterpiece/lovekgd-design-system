    same_user_job_and_state_share_visual_grammar: true
    different_entity_API_does_not_justify_a_visual_fork: true
    accepted_differences_require: owner_or_functional_accessibility_evidence_not_historical_existence
    exceptions_are_minimal_reviewable_and_not_the_default: true
    selected_existing_target_palette_not_new_brand_palette: true
    evidence: before_after_same_content_viewport_and_state_plus_remaining_named_differences
    same_role_mismatch_can_be_closed_by_a_marker_or_token_only: false
  retrospective:
    purpose: explain_the_actual_visual_delta_without_restarting_the_programme
    classify_delivered_work: [structural_only, implemented_visible_change, integrated, published, personally_verified]
    July_30_reference_requires_exact_resolved_source_or_artifact: true
    July_30_comparison_has_been_performed: false
    audit_output_must_not_delay_ready_fixes: true
  execution_assignment:
    owner_approved_scheme: CODE_with_VISUAL_DATA_and_independent_REVIEW
    CODE: primary_implementation_integration_and_real_candidate_owner
    VISUAL: bounded_product_role_decisions_and_visible_before_after_review
    DATA: bounded_source_fact_state_and_entity_adapter_analysis
    MATERIALS: one_assigned_ChatGPT_executor_of_existing_R0_PENPOT_writer_role
