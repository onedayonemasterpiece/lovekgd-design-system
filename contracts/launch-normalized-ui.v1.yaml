schema: kenigevents.launch-normalized-ui.v1
version: 1.8.0
status: ACTIVE
coordination_issue: onedayonemasterpiece/events-bot-new#621
parallel_roles_doc: docs/launch-normalization/PARALLEL-WINDOWS.md
consultant_doc: docs/launch-normalization/CONSULTANT-K0.md
status_doc: docs/launch-normalization/STATUS.md

authority:
  executable_ui:
    repository: onedayonemasterpiece/events-bot-new
    branch: integration/ui-normalization-launch-20260902
  thin_sot_and_penpot_delivery:
    repository: onedayonemasterpiece/lovekgd-design-system
    branch: integration/launch-normalized-sot-penpot-20260902
  penpot:
    file_id: 40e06342-8830-80d6-8008-8fc8a3a4cd4f
    sole_writer: R0.PENPOT

execution_reality:
  chatgpt_turns_are_background_daemons: false
  completed_turn_self_resumes: false
  active_turn_can_process_multiple_backlog_items: true
  active_turn_must_generate_next_items_from_owned_scope: true
  stopped_window_with_ready_owned_work_is_idle_capacity: true
  K0_must_allocate_ready_work_to_each_available_role_window: true
  K0_may_not_centralize_all_ready_specialist_work_into_R0: true
  external_supervisor_required_for_zero_touch_reactivation_after_turn: true
  external_supervisor_currently_authorized: false

operating_modes:
  DAY_PARALLEL:
    condition: multiple_role_windows_available
    objective: maximize_parallel_specialist_throughput_and_minimize_Codex_spend
    active_lanes: [N0, F0, M0, A0, V0, R0]
    R0_role: scarce_runtime_materialization_lane
    specialist_roles_do:
      - full_source_and_consumer_census
      - semantic_product_and_architecture_decisions
      - broad_direct_GitHub_implementation_batches
      - source_negative_probes_and_test_design
      - branch_diff_review
      - exact_merge_ready_acceptance_and_removal_boundaries
    R0_does:
      - cross_branch_candidate_construction
      - local_dependency_and_runtime_execution
      - tests_builds_and_checks
      - generation_and_publication
      - ordinary_merge_resolution
      - deterministic_bulk_mechanical_edits_only_when_materially_cheaper
      - local_browser_smoke
    R0_must_not_duplicate:
      - active_F0_semantic_or_foundation_work
      - active_M0_family_or_component_design_work
      - active_A0_consumer_migration_work
      - N0_candidate_or_acceptance_review
      - V0_independent_browser_verdict
  NIGHT_AUTONOMOUS:
    condition: role_windows_unavailable_or_intentionally_not_running
    objective: keep_product_path_moving_with_the_single_native_lane
    R0_role: broad_reversible_product_executor
    R0_may_expand_into:
      - reversible_implementation_and_migration_determined_by_existing_behavior
      - source_census_and_backlog_formation
      - regression_and_tooling_repair
    still_escalates:
      - new_product_behavior
      - changed_user_facing_semantics
      - palette_or_redesign
      - irreconcilable_writer_conflict
      - irreversible_risk

scarce_Codex_budget:
  Codex_is_scarce: true
  default_allocation_rule: use_role_windows_for_every_task_not_requiring_local_runtime_or_cross_branch_materialization
  R0_task_admission_requires_one_of:
    - local_shell_or_dependency_environment
    - cross_branch_merge_or_candidate_construction
    - executable_tests_build_or_generation
    - artifact_or_preview_publication
    - ordinary_merge_conflict_resolution
    - deterministic_high_volume_mechanical_change_materially_cheaper_than_GitHub_edits
    - no_available_specialist_and_reversible_work_on_critical_path
  R0_task_rejected_or_deferred_to_role_window_when:
    - repository_or_consumer_analysis_only
    - semantic_token_or_palette_decision
    - component_identity_or_route_composition_decision
    - ordinary_direct_GitHub_edit_owned_by_an_active_specialist
    - duplicate_review_already_being_done_by_N0_F0_M0_A0_or_V0
  before_R0_edits_role_owned_source:
    - resolve_latest_role_ref_and_recent_activity
    - prefer_integrating_or_testing_the_role_branch
    - avoid_parallel_duplicate_implementation
    - edit_only_if_purely_mechanical_or_required_to_unblock_current_gate
  R0_checkpoint_economy_fields:
    - local_runtime_work_completed
    - role_outputs_integrated_or_verified
    - Codex_only_implementation_and_why_it_was_not_suitable_for_a_role_window
    - blind_wait_seconds
    - duplicated_specialist_work
  required_values:
    blind_wait_seconds: 0
    duplicated_specialist_work: 0
  long_local_job_policy:
    - foreground_or_PID_wait_and_log_tail
    - use_idle_time_for_nonconflicting_candidate_inspection_or_next_runtime_preparation
    - never_blind_sleep_over_15_seconds

execution_surfaces:
  turn_bounded_autonomous_workers:
    K0: ChatGPT_GitHub
    N0: ChatGPT_GitHub
    F0: ChatGPT_GitHub
    M0: ChatGPT_GitHub
    A0: ChatGPT_GitHub
    V0: ChatGPT_GitHub_my_browser_bridge
  native_execution_worker:
    R0: native_Codex_local_shell_git_gh
  codex_devcoveer_in_role_windows: forbidden

worker_turn_contract:
  role_assignment_covers_full_owned_contour: true
  launch_or_resume_must_include:
    - current_product_gate
    - current_role_scope
    - at_least_one_concrete_seed_backlog_cluster
    - rule_to_recompute_and_extend_backlog_after_each_checkpoint
  seed_backlog_is_starting_point_not_limit: true
  after_each_item_or_checkpoint:
    - fresh_read_issue_current_refs_and_relevant_source
    - recompute_ready_owned_items
    - select_highest_value_safe_reversible_item
    - execute_and_review
    - continue
  when_seed_items_are_exhausted_generate_next_from:
    - normalization_invariants
    - actual_consumer_census
    - duplicate_family_or_style_owners
    - current_role_dependencies_and_new_refs
    - failing_tests_builds_and_checks
    - V0_findings
    - next_product_gate
  forbidden_turn_end_reasons:
    - one_item_completed
    - one_commit_completed
    - one_wave_completed
    - one_RESULT_published
    - one_seed_list_exhausted
    - task_dispatched
    - waiting_for_preview_while_other_owned_work_exists
    - waiting_for_integration_while_other_owned_work_exists
    - missing_formal_packet
  allowed_turn_end_only_for:
    OWNED_BACKLOG_EXHAUSTED:
      ready_owned_items: 0
      exact_external_trigger_required: true
    HARD_BOUNDARY:
      one_of:
        - genuine_product_decision
        - irreconcilable_writer_conflict
        - irreversible_or_destructive_risk
        - credential_exposure_risk
        - unauthorized_production_or_penpot_mutation
    PLATFORM_LIMIT:
      actual_context_tool_or_runtime_limit: true
  standby_self_report_is_sufficient: false
  standby_requires_source_and_ref_census: true
  stop_start_pattern_while_ready_work_exists: BACKLOG_NOT_FORMING

resource_saturation:
  on_owner_report_that_windows_are_stopped:
    - inspect_current_refs_issue_and_source
    - determine_ready_backlog_per_role
    - provide_resume_to_every_stopped_role_with_ready_work
    - preserve_non_overlapping_write_ownership
  zero_task_response_while_five_role_windows_have_ready_work: process_defect
  artificial_busywork_after_true_exhaustion: forbidden
  expected_parallel_lanes_before_first_preview:
    - N0_acceptance_generation_and_integration
    - F0_foundation_saturation
    - M0_family_and_media_saturation
    - A0_actual_consumer_migration
    - V0_source_harness_and_available_browser_baseline
    - R0_candidate_build_generation_and_publication

specialist_output_contract:
  purpose: unload_scarce_R0
  each_role_batch_should_be:
    - coherent_and_merge_ready
    - personally_reviewed_by_the_role
    - limited_to_owned_paths
    - accompanied_by_exact_invariants_and_negative_controls
    - explicit_about_required_local_tests_but_not_require_R0_to_repeat_semantic_analysis
  R0_consumes_outputs_by:
    - resolving_latest_accepted_role_head
    - reviewing_bounded_diff_for_integration_risk
    - merging_or_cherry_picking
    - running_local_verification
    - returning_only_material_failures_to_the_owner_role

R0_policy:
  role: scarce_native_materialization_and_release_engineering
  mission:
    - reach_first_exact_browser_testable_normalized_preview
    - integrate_and_verify_ready_role_outputs
    - close_ready_technical_and_V0_drift_backlog
    - execute_thin_S_Penpot_and_release_mechanics_when_gates_open
  backlog_sources:
    - current_issue_621
    - current_integration_ref_and_ancestry
    - latest_role_branches_and_results
    - source_and_actual_consumer_census
    - failing_tests_builds_checks
    - local_browser_smoke
    - V0_DRIFT_and_available_fixes
  loop:
    - fresh_read_issue_refs_worktrees_contract
    - identify_nearest_unclosed_product_gate
    - recompute_ready_reversible_backlog
    - prefer_ready_specialist_outputs_over_duplicate_implementation
    - select_highest_value_Codex_admissible_item
    - freeze_SHAs_as_transaction_evidence
    - implement_merge_test_build_publish
    - fix_recoverable_tooling_and_regression_defects
    - checkpoint
    - fresh_read_and_continue
  may_decide_autonomously:
    - reversible_implementation_details_determined_by_existing_behavior
    - ordinary_merge_resolution
    - regression_fixture_and_test_repairs
    - worktree_and_build_sequence
    - latest_accepted_ref_selection
    - local_browser_smoke_and_diagnostics
  escalate_only:
    - new_product_behavior
    - changed_user_facing_semantics
    - palette_or_visual_redesign
    - irreconcilable_writer_conflict
    - irreversible_production_data_or_Penpot_risk
    - final_independent_V0_verdict
  waiting_policy:
    local_process:
      prefer: foreground_or_wait_PID_and_tail_log
      blind_sleep_seconds_over_15: forbidden
      polling_if_unavoidable_seconds: [5, 10, 15]
    remote_trigger:
      execute_other_ready_backlog_first: true
      poll_interval_seconds: [10, 15]
      maximum_minutes: 2

role_contours:
  N0:
    owns:
      - candidate_acceptance_and_ancestry
      - generation_and_publication_policy
      - integration_and_release_decisions
      - review_of_R0_product_output
      - V0_trigger_and_verdict_review
    current_backlog_sources:
      - latest_F0_M0_A0_refs
      - current_integration_state
      - generation_scripts_and_publication_path
      - R0_results
  F0:
    owns:
      - typography
      - spacing_geometry
      - semantic_colors
      - exactly_four_icon_roles
      - canonical_SVG_identity
      - duplicate_style_owner_closure
    writable_paths:
      - site/src/styles/design-system.css
      - site/src/components/design-system/**
      - site/src/components/Icon.astro
      - site/src/components/SocialIcon.astro
      - site/src/components/brand/**
  M0:
    owns:
      - component_identity
      - MediaFrame
      - EventCard_and_ListingEventCard
      - AdaptiveEventCardGrid
      - EventMediaRail
    writable_paths:
      - site/src/lib/relatedCardLayout.mjs
      - site/src/components/OptimizedEventCardGrid.astro
      - site/src/components/AdaptiveEventCardGrid.astro
      - site/src/components/EventCard.astro
      - site/src/components/listings/ListingEventCard.astro
      - site/src/components/EventMediaRail.astro
  A0:
    owns:
      - shell
      - actual_routes
      - consumer_migration
      - intentional_composition_preservation
    must_not_edit_M0_roots: true
  V0:
    owns:
      - source_bound_browser_harness
      - current_production_before_baseline_when_reachable
      - independent_normalized_preview_DOM_computed_style_audit
      - DRIFT_routing
    may_continue_without_normalized_preview:
      - update_harness_for_new_role_refs
      - inspect_current_public_product_baseline
      - run_source_negative_probes
      - prepare_exact_before_after_measurements

product_path:
  - N0_F0_M0_A0_V0_process_independent_backlogs_in_parallel
  - R0_integrates_latest_safe_work_and_builds_fresh_preview
  - V0_runs_full_independent_browser_audit
  - owning_workers_close_DRIFT
  - repeat_until_ASTRO_NORMALIZATION_PASS
  - thin_S_and_Penpot
  - checked_release_candidate

normalization_invariants:
  same_visual_behavior_means_one_family_root: true
  one_anatomy_and_CSS_owner: true
  one_canonical_SVG_per_semantic_action: true
  all_visible_colors_tokenized: true
  same_role_duplicates_merged: true
  icon_size_role_count: 4
  component_local_icon_dimensions: forbidden
  shared_MediaFrame_owns_framing: true
  one_AdaptiveEventCardGrid_for_applicable_surfaces: true
  actual_consumers_must_use_canonical_roots: true
  date_and_weekend_remain_distinct_compositions: true
  product_UI_gap_and_redesign_before_ASTRO_NORMALIZATION_PASS: forbidden

owner_review:
  first_surface: first_normalized_fresh_real_data_preview
  entrypoint_template: /<buildId>/__preview/
  exact_clickable_url_required: true
  new_owner_facing_lab_pages: forbidden

not_a_new_system:
  new_repository: forbidden
  second_Astro_implementation: forbidden
  new_owner_facing_lab: forbidden
  mandatory_packet_schema: forbidden
  owner_as_message_bus: forbidden
  owner_as_micro_task_scheduler: forbidden
