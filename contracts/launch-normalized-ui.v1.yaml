schema: kenigevents.launch-normalized-ui.v1
version: 1.3.0
status: ACTIVE
coordination_issue: onedayonemasterpiece/events-bot-new#621
parallel_roles_doc: docs/launch-normalization/PARALLEL-WINDOWS.md

authority:
  executable_ui:
    repository: onedayonemasterpiece/events-bot-new
    branch: integration/ui-normalization-launch-20260902
    owns:
      - foundations_and_tokens
      - astro_component_roots_and_variants
      - actual_route_compositions
      - fresh_real_data_preview_and_release_generation
  thin_sot_and_penpot_delivery:
    repository: onedayonemasterpiece/lovekgd-design-system
    branch: integration/launch-normalized-sot-penpot-20260902
    owns:
      - stable_family_ids
      - component_variant_state_composition_decisions
      - astro_source_and_actual_consumer_bindings
      - exact_visible_asset_identities
      - internal_golden_fixture_and_route_bindings
      - penpot_master_and_route_board_placement
      - browser_and_visual_status
  penpot:
    file_id: 40e06342-8830-80d6-8008-8fc8a3a4cd4f
    role: native_component_identity_linked_reuse_and_visual_parity
    sole_writer: R0.PENPOT
    candidate_pages_replaceable_before_visual_acceptance: true

not_a_new_sot:
  new_repository: forbidden
  second_independently_edited_astro_implementation: forbidden
  package_extraction_before_launch: forbidden
  old_asp_issue_as_runtime_queue: forbidden
  new_orchestrator: forbidden

actual_route_model:
  current_date:
    route: /segodnya/
    implementation: site/src/pages/segodnya/index.astro
    shared_surface: site/src/components/listings/DateListingSurface.astro
    kind: today
  next_date:
    route: /zavtra/
    implementation: site/src/pages/zavtra/index.astro
    shared_surface: site/src/components/listings/DateListingSurface.astro
    kind: tomorrow
  arbitrary_date:
    route_template: /date-YYYY-MM-DD/
    implementation: site/src/pages/date-[date].astro
    shared_surface: site/src/components/listings/DateListingSurface.astro
    kind: date
  active_weekend:
    route: /vyhodnye/
    implementation: site/src/pages/vyhodnye/index.astro
    shared_surface: site/src/components/listings/WeekendListingSurface.astro
  selected_weekend:
    route_template: /vyhodnye/YYYY-MM-DD/
    implementation: site/src/pages/vyhodnye/[start].astro
    shared_surface: site/src/components/listings/WeekendListingSurface.astro
  free_collection:
    route: /podborki/besplatnye-sobytiya/
    implementation: site/src/pages/podborki/[slug]/index.astro
    shared_surface: site/src/components/FreeCollectionSurface.astro

execution_order:
  restore_existing_generation_first: true
  normalization_may_start_in_parallel_before_owner_preview: true
  technical_fresh_data_baseline_required: true
  technical_baseline_is_owner_review_requirement: false
  first_owner_preview_should_include_first_normalization_wave: true
  family_done_requires_fresh_real_data_build: true
  family_done_requires_browser_dom_audit: true
  sequence:
    - N0_restore_export_and_build
    - N0_capture_technical_fresh_data_baseline
    - F0_M0_A0_normalize_in_parallel
    - N0_integrate_first_wave
    - V0_browser_dom_and_computed_style_audit
    - close_critical_drift
    - publish_first_normalized_owner_preview
    - repeat_family_waves
    - thin_sot_and_penpot_follow_completed_waves
    - open_product_ui_gap_work_after_normalization_pass

owner_review:
  first_surface: first_normalized_fresh_real_data_preview
  entrypoint_template: /<buildId>/__preview/
  existing_implementation: site/src/pages/[preview]/index.astro
  exact_clickable_url_required: true
  actual_top_level_route_templates_required: true
  new_owner_facing_lab_pages: forbidden
  owner_golden_corpus_review_required: false
  review_focus:
    - framing
    - spacing_and_density
    - typography_and_heading_hierarchy
    - radii_and_surface_geometry
    - colours
    - icon_consistency_and_scale
    - adaptive_card_rows
    - responsive_composition
    - visible_page_specific_anomalies

golden_conformance:
  purpose: deterministic_internal_A_equals_S_equals_P
  owner_review_prerequisite: false
  timezone: Europe/Kaliningrad
  reference_clock:
    mode: frozen
    current_weekday: Friday
  actual_route_coverage:
    friday: /segodnya/
    saturday: /zavtra/
    sunday: /date-YYYY-MM-DD/
    weekend: /vyhodnye/
    free_collection: /podborki/besplatnye-sobytiya/
  target_occurrences: {friday: 5, saturday: 6, sunday: 5}
  minimum_occurrences: {friday: 4, saturday: 5, sunday: 4}
  weekend_reuses_same_saturday_sunday_occurrences: true
  update_policy: append_only
  stability_target_days: 14
  synthetic_fixture_policy:
    allowed_only_for_missing_stress_cell: true
    visibly_marked: true

normalization:
  current_astro_is_observed_A0_not_automatic_target: true
  unit: complete_component_family_in_actual_consumers
  family_decision_classes:
    - component
    - variant
    - state
    - composition
    - accidental_drift
  sequence:
    - bounded_consumer_and_drift_census
    - component_root_variant_state_composition_decision
    - normalize_central_astro_foundations_or_family
    - migrate_actual_launch_consumers
    - rebuild_fresh_real_data_preview
    - V0_browser_dom_and_computed_style_verdict
    - close_critical_drift
    - record_result_in_thin_sot
    - materialize_native_penpot_master_and_linked_route_instances
    - V0_internal_golden_visual_verdict
  preserve_intentional_page_composition_variants: true
  eliminate:
    - duplicated_foundation_values
    - alternate_visible_svg_glyphs_for_same_semantic_action
    - page_local_component_forks
    - forbidden_internal_style_overrides
    - framing_rule_duplicates
    - unexplained_card_grid_variants
  penpot_may_not_block_astro_normalization: true
  penpot_follows_completed_family_waves: true

component_identity:
  visually_and_behaviorally_same_means_one_family_root: true
  one_canonical_astro_root_or_variant_family: true
  one_family_css_owner: true
  one_canonical_svg_per_semantic_action: true
  actual_route_consumer_inventory_required: true
  page_local_copy_is_drift_even_if_pixels_match: true
  differences_allowed_only_as_named:
    - variant
    - state
    - composition
  diagnostics_required:
    - data-ds-family
    - data-ds-version
    - data-ds-variant
  diagnostics_when_applicable:
    - data-ds-state
  source_checks:
    actual_consumers_import_canonical_root: true
    duplicate_page_markup_for_family: forbidden
    forbidden_internal_overrides_detected: true
  browser_checks:
    normalized_dom_anatomy_signature: true
    invariant_computed_style_signature: true
  penpot_checks:
    one_native_master_or_variant_family: true
    route_boards_use_linked_instances: true
    detached_visual_copy_does_not_pass: true

colors:
  all_visible_ui_colors_tokenized: true
  raw_literals_allowed_only_in:
    - canonical_token_registry
    - image_or_media_data
    - documented_technical_exception
  exact_duplicates_merged: true
  near_duplicates_clustered: true
  near_duplicates_with_same_semantic_role_merged: true
  retained_near_duplicate_requires_semantic_or_contrast_reason: true
  palette_exploration_after_drift_normalization: true
  central_token_change_updates_all_consumers: true

iconography:
  canonical_svg_identity_required: true
  size_role_count: 4
  role_names_and_values: TO_BE_DECIDED_FROM_CURRENT_CONSUMER_CENSUS
  concrete_dimensions_owned_by_central_tokens_or_utilities: true
  individual_component_hardcoded_icon_sizes_forbidden: true
  global_role_value_change_updates_all_consumers: true

media_frame:
  shared_owner_required: true
  local_page_framing_override_forbidden: true
  required_rules:
    - media_role
    - frame_ratio
    - contain_or_cover
    - crop_permission
    - focal_or_object_position
    - clip_and_overflow
    - fallback_and_loading
    - responsive_resource_behavior
  mandatory_donors:
    - docs/features/static-site-pages/image-framing.md
    - site/src/lib/relatedCardLayout.mjs
    - site/src/components/OptimizedEventCardGrid.astro
  parallel_reimplementation_forbidden_without_proven_reuse_failure: true
  browser_bounds_and_object_fit_evidence_required: true

adaptive_event_card_grid:
  one_family_root_required: true
  existing_optimizer_reuse_required: true
  applicable_consumer_census_required: true
  required_behavior:
    container_uses_available_width: true
    row_occupancy_target: 100_percent_minus_declared_gaps
    column_count_uses_available_width_and_named_density_variant: true
    phantom_empty_column_forbidden: true
    final_remainder_uses_named_layout_variant: true
    cards_fill_row_width: true
    media_and_total_card_heights_equal_within_row: true
    local_grid_css_may_not_change_framing_policy: true
    mobile_and_compact_desktop_no_overflow: true
  known_consumers_to_census:
    - FreeCollectionSurface
    - search_collection_pages
    - UnusualListingSurface
    - GastronomyCollectionSurface
    - preview_hub_specimens
    - OptimizedEventCardGrid
    - related_and_discovery_rows
  browser_measurements:
    - row_bounds
    - card_bounds
    - declared_gap
    - occupancy_ratio
    - media_ratio
    - equal_height_delta

browser_validation:
  owner: V0
  required_connector: my-browser-bridge
  mode: read_only
  source_declaration_alone_is_not_pass: true
  minimum_routes:
    - /
    - /segodnya/
    - /zavtra/
    - /date-YYYY-MM-DD/
    - /vyhodnye/
    - /podborki/besplatnye-sobytiya/
    - /populyarnoe/
    - /vystavki/
    - /festivali/
    - /sobytiya/<real-slug>/
  viewport_classes:
    - desktop_wide
    - desktop_compact
    - mobile_390_to_430
  checks:
    - component_identity_markers
    - normalized_dom_anatomy
    - computed_typography
    - computed_spacing
    - computed_colors
    - computed_radii_and_borders
    - computed_icon_sizes
    - image_bounds_overflow_clip_and_object_fit
    - adaptive_row_occupancy_and_equal_heights
    - responsive_transitions
    - horizontal_overflow
  verdicts:
    PASS: family_or_route_matches_contract
    DRIFT: immediately_route_to_F0_M0_or_A0
    PRODUCT_GAP: backlog_after_normalization_gate
    BLOCKER: factual_browser_evidence_unavailable

normalization_gate:
  id: ASTRO_NORMALIZATION_PASS
  required:
    - fresh_data_generation_reproducible
    - foundations_and_colors_tokenized
    - four_icon_roles_applied_to_all_consumers
    - same_components_have_single_family_roots
    - media_frame_and_framing_pass
    - adaptive_event_card_grid_migrated_to_applicable_consumers
    - actual_routes_migrated
    - no_critical_V0_browser_drift
  opens:
    - product_UI_gap_work
    - palette_exploration
    - interface_redesign
  release_of_changed_family_requires_thin_sot_and_penpot_update: true

normalization_report:
  required:
    - font_families_and_weights
    - H1_H2_H3_H4_body_label_metadata_roles
    - spacing_sizing_container_and_breakpoint_scale
    - color_semantic_roles_and_merged_duplicates
    - radii_borders_elevation_layering
    - four_icon_size_roles_and_consumer_map
    - canonical_svg_identity_map
    - media_frame_roles_ratios_fit_crop_focal_clip_fallback
    - component_roots_variants_states_and_actual_consumer_map
    - adaptive_event_card_grid_variants_and_migrated_surfaces
    - removed_page_local_forks_and_overrides
    - bounded_remaining_deviations
    - fresh_real_data_preview_url
    - V0_browser_verdict
    - checks_run
    - penpot_master_linked_instance_and_ASP_status

roles:
  N0:
    owns: [generation, technical_baseline, integration, status, preview, release]
  F0:
    owns: [foundations, typography, spacing, colors, icon_roles, svg, brand]
  M0:
    owns: [component_roots, media_frame, cards, adaptive_event_card_grid]
  A0:
    owns: [shell, listings, routes, consumer_migration]
  V0:
    owns: [browser_dom_audit, computed_style_audit, later_golden_penpot_audit]
  K0:
    owns: [fresh_read_diagnosis, prompt_authoring]
  R0:
    owns: [bounded_code_worktrees, merge_test_support, sole_penpot_write]

status_values:
  - NOT_STARTED
  - SOURCE_CENSUS
  - ASTRO_BUILDING
  - FRESH_DATA_BUILD
  - DOM_AUDIT
  - DRIFT_REPAIR
  - ASTRO_NORMALIZED
  - PENPOT_VISIBLE
  - ASP_PASS
  - REAL_DATA_PASS
  - BLOCKED_EXTERNAL
  - BLOCKED_PRODUCT_DECISION

critical_path_exclusions:
  - new_global_decoder
  - new_sot_repository
  - extracted_component_package_before_launch
  - new_owner_facing_lab_pages
  - owner_golden_corpus_review
  - new_generation_or_lifecycle_system
  - mandatory_MAT_QA_INTEGRATE_PUBLISH_chain
  - full_penpot_tree_hash
  - bespoke_penpot_runner_per_family
  - empty_page_or_root_checkpoint
  - full_old_penpot_reconstruction
  - owner_as_message_bus
  - product_gap_implementation_before_normalization_pass
