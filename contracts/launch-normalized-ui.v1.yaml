    CODE_may_implement_beyond_old_R0_runtime_only_scope: true
    active_window_owning_paths_must_not_overlap: true
    historical_DAY_PARALLEL_R0_and_specialist_lanes_do_not_reassign_current_work: true
    no_new_orchestrator_or_registry: true
  penpot_catalogs:
    status: REQUIRED_NOT_RESTORED
    authorization: bounded_explicit_owner_request
    existing_file_only: true
    fresh_read_file_page_revision_and_active_writer_required: true
    identity_conflict_action: stop_mutation_resolve_current_file_not_guess_from_name
    one_page_per: [icons, medallions, artifacts, overlays]
