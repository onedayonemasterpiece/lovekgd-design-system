  preserve_withdrawn_or_tentative_item_disposition: true
  source_review_is_live_browser_evidence: false
  factory_probe_is_organic_feed_coverage: false
  changes_do_not_authorize_production_or_unbounded_Penpot_mutation: true
  amendment:
    before: finite_stage_complete_and_stretched_remainder
    after: reopened_bounded_owner_correction_with_regular_columns_and_text_safe_media
    reason: explicit_owner_rejection_and_three_voice_reviews
