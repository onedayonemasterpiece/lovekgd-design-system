<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Detached chrome and floating control islands anatomy</title>
  <desc id="desc">Editable anatomy board showing top control islands, context and utility surfaces, transient utilities, three distinct bottom architectures, design-system layers and validation gates.</desc>
  <style>
    .bg{fill:#0b1118}.panel{fill:#111a24;stroke:#2d3948;stroke-width:2}.phone{fill:#0d1218;stroke:#6d7887;stroke-width:2}.surface{fill:#28303a;stroke:#52606f;stroke-width:1.3}.surfaceStrong{fill:#343e4b;stroke:#607081;stroke-width:1.3}.line{fill:#737f8e}.lineStrong{fill:#9ca7b5}.blue{fill:#3f8df0}.amber{fill:#f0a62a}.white{fill:#eef3f8}.glyph{fill:none;stroke:#edf2f7;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.mutedGlyph{fill:none;stroke:#a9b4c2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.callBlue{fill:none;stroke:#4c9cf4;stroke-width:2}.callAmber{fill:none;stroke:#f0a62a;stroke-width:2}.dotBlue{fill:#4c9cf4}.dotAmber{fill:#f0a62a}.titleText{font-family:Inter,Arial,sans-serif;fill:#f4f7fb;font-size:30px;font-weight:760}.subText{font-family:Inter,Arial,sans-serif;fill:#95a2b2;font-size:14px}.labelBlue{font-family:Inter,Arial,sans-serif;fill:#55a6ff;font-size:15px;font-weight:740}.labelAmber{font-family:Inter,Arial,sans-serif;fill:#f0a62a;font-size:15px;font-weight:740}.body{font-family:Inter,Arial,sans-serif;fill:#a8b3c0;font-size:11.5px}.panelTitle{font-family:Inter,Arial,sans-serif;fill:#f4f7fb;font-size:17px;font-weight:740}.panelBody{font-family:Inter,Arial,sans-serif;fill:#aab5c2;font-size:11px}.micro{font-family:Inter,Arial,sans-serif;fill:#8e9baa;font-size:10px}.strong{font-family:Inter,Arial,sans-serif;fill:#f4f7fb;font-size:12px;font-weight:720}.archTitle{font-family:Inter,Arial,sans-serif;fill:#f4f7fb;font-size:9.6px;font-weight:720}.archNote{font-family:Inter,Arial,sans-serif;fill:#8e9baa;font-size:8.8px}.divider{stroke:#364250;stroke-width:1.3}
  </style>
  <rect class="bg" width="1200" height="850"/>
  <rect class="panel" x="24" y="24" width="1152" height="802" rx="26"/>
  <text class="titleText" x="52" y="68">Detached chrome / floating control islands</text>
  <text class="subText" x="52" y="94">Source-informed anatomy · geometry is not component identity · exploration input only</text>

  <!-- central anatomy phone -->
  <g id="central-anatomy" transform="translate(450 118)">
    <rect class="phone" width="300" height="450" rx="34"/>
    <circle class="surface" cx="40" cy="48" r="23"/><path class="glyph" d="M30 40h20M30 48h20M30 56h20"/>
    <rect class="surface" x="82" y="25" width="136" height="46" rx="23"/><rect class="lineStrong" x="117" y="43" width="66" height="10" rx="5"/>
    <rect class="surface" x="226" y="25" width="62" height="46" rx="23"/><circle class="white" cx="244" cy="48" r="3"/><circle class="white" cx="256" cy="48" r="3"/><circle class="white" cx="268" cy="48" r="3"/>

    <rect class="surfaceStrong" x="24" y="92" width="252" height="58" rx="18"/><rect class="blue" x="39" y="105" width="7" height="32" rx="3.5"/><rect class="lineStrong" x="61" y="106" width="164" height="8" rx="4"/><rect class="line" x="61" y="126" width="126" height="7" rx="3.5"/>

    <rect class="lineStrong" x="52" y="184" width="196" height="9" rx="4.5"/><rect class="line" x="72" y="207" width="156" height="7" rx="3.5"/>
    <rect class="surface" x="30" y="244" width="240" height="72" rx="20"/><rect class="lineStrong" x="50" y="260" width="168" height="8" rx="4"/><rect class="line" x="50" y="280" width="126" height="7" rx="3.5"/>

    <circle class="surfaceStrong" cx="252" cy="350" r="23"/><path class="glyph" d="M252 337v21M244 350l8 8 8-8"/>

    <rect class="surfaceStrong" x="18" y="382" width="264" height="52" rx="26"/><circle class="line" cx="48" cy="408" r="18"/><path class="mutedGlyph" d="M42 408h12M48 402v12"/><rect class="line" x="78" y="402" width="132" height="12" rx="6"/><circle class="line" cx="246" cy="408" r="18"/>
  </g>

  <!-- left callouts -->
  <path class="callBlue" d="M450 166H270"/><circle class="dotBlue" cx="450" cy="166" r="4"/>
  <text class="labelBlue" x="52" y="157">Detached top islands</text>
  <text class="body" x="52" y="180">leading, center and trailing roles can</text><text class="body" x="52" y="196">float without one full-width app bar</text>

  <path class="callBlue" d="M532 166L328 264H270"/><circle class="dotBlue" cx="532" cy="166" r="4"/>
  <text class="labelBlue" x="52" y="254">Centered context capsule</text>
  <text class="body" x="52" y="277">mode, scope or page identity</text>

  <path class="callBlue" d="M474 238L330 350H270"/><circle class="dotBlue" cx="474" cy="238" r="4"/>
  <text class="labelBlue" x="52" y="342">Pinned context banner</text>
  <text class="body" x="52" y="365">persistent context is a separate surface</text>

  <path class="callBlue" d="M468 526H270"/><circle class="dotBlue" cx="468" cy="526" r="4"/>
  <text class="labelBlue" x="52" y="512">Floating bottom composer</text>
  <text class="body" x="52" y="535">task input, inset above the system edge</text>

  <!-- right callouts -->
  <path class="callAmber" d="M738 166H924"/><circle class="dotAmber" cx="738" cy="166" r="4"/>
  <text class="labelAmber" x="938" y="157">Grouped utility actions</text>
  <text class="body" x="938" y="180">related controls share one utility island</text>

  <path class="callAmber" d="M702 468H924"/><circle class="dotAmber" cx="702" cy="468" r="4"/>
  <text class="labelAmber" x="938" y="458">Transient scroll/FAB utility</text>
  <text class="body" x="938" y="481">floats over content and can disappear</text>

  <text class="labelAmber" x="938" y="342">Content-first canvas</text>
  <text class="body" x="938" y="365">chrome can overlay content; compensate</text><text class="body" x="938" y="381">for occlusion and last-item reachability</text>

  <!-- bottom architectures -->
  <g id="bottom-architectures">
    <rect class="panel" x="44" y="602" width="516" height="196" rx="18"/>
    <text class="panelTitle" x="66" y="632">Three distinct bottom architectures</text>

    <g transform="translate(66 654)">
      <rect class="phone" width="144" height="112" rx="16"/>
      <rect class="surfaceStrong" x="10" y="68" width="124" height="30" rx="15"/><circle class="line" cx="28" cy="83" r="10"/><rect class="line" x="45" y="78" width="62" height="10" rx="5"/><circle class="line" cx="120" cy="83" r="10"/>
      <text class="archTitle" x="72" y="124" text-anchor="middle">composer — task input</text>
    </g>

    <g transform="translate(226 654)">
      <rect class="phone" width="144" height="112" rx="16"/>
      <rect class="surfaceStrong" x="10" y="68" width="124" height="30" rx="15"/><circle class="blue" cx="30" cy="83" r="4"/><circle class="line" cx="58" cy="83" r="4"/><circle class="line" cx="86" cy="83" r="4"/><circle class="line" cx="114" cy="83" r="4"/>
      <text class="archTitle" x="72" y="122" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">floating navigation dock</text>
      <text class="archNote" x="72" y="136" text-anchor="middle">core destinations</text>
    </g>

    <g transform="translate(386 654)">
      <rect class="phone" width="144" height="112" rx="16"/>
      <rect class="surfaceStrong" x="10" y="48" width="124" height="28" rx="10"/><rect class="line" x="18" y="55" width="18" height="14" rx="4"/><rect class="white" x="44" y="55" width="48" height="6" rx="3"/><path class="glyph" d="M113 54l12 8-12 8z"/>
      <rect class="surface" x="10" y="80" width="124" height="18" rx="9"/><circle class="line" cx="30" cy="89" r="3"/><circle class="line" cx="58" cy="89" r="3"/><circle class="line" cx="86" cy="89" r="3"/><circle class="blue" cx="114" cy="89" r="3"/>
      <text class="archTitle" x="72" y="118" text-anchor="middle">persistent state /</text>
      <text class="archTitle" x="72" y="130" text-anchor="middle">mini-player dock + nav</text>
      <text class="archNote" x="72" y="143" text-anchor="middle">persistent state stack</text>
    </g>
  </g>

  <!-- semantic levels -->
  <g id="semantic-levels">
    <rect class="panel" x="578" y="602" width="274" height="196" rx="18"/>
    <text class="panelTitle" x="598" y="632" textLength="234" lengthAdjust="spacingAndGlyphs">Do not make one universal pill component</text>
    <line class="divider" x1="598" y1="644" x2="832" y2="644"/>
    <text class="strong" x="598" y="668">1. surface primitive</text><text class="panelBody" x="614" y="684">material · radius · border · elevation</text>
    <text class="strong" x="598" y="706">2. composition</text><text class="panelBody" x="614" y="722">app bar · composer · nav · mini-player</text>
    <text class="strong" x="598" y="744">3. control semantics</text><text class="panelBody" x="614" y="760">button · chip · input · destination</text>
    <text class="strong" x="598" y="782">4. runtime/layout behavior</text>
  </g>

  <!-- validation gates -->
  <g id="validation-gates">
    <rect class="panel" x="870" y="602" width="286" height="196" rx="18"/>
    <text class="panelTitle" x="890" y="632">Validation gates</text>
    <text class="panelBody" x="890" y="656">• plain / photo / poster / saturated underlays</text>
    <text class="panelBody" x="890" y="677">• expanded / compact / scrolled states</text>
    <text class="panelBody" x="890" y="698">• keyboard open / closed</text>
    <text class="panelBody" x="890" y="719">• safe areas</text>
    <text class="panelBody" x="890" y="740">• narrow viewport / landscape</text>
    <text class="panelBody" x="890" y="761">• content occlusion + last-item reachability</text>
    <text class="panelBody" x="890" y="782">• reduced motion / high contrast</text>
  </g>
</svg>
