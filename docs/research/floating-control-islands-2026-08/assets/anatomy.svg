<path class="glyph-on-dark" d="M 344 802 H 358 M 351 795 V 809"/></g>
<path class="callout" d="M 353 203 H 112 V 236"/><circle class="dot" cx="353" cy="203" r="4"/>
<text class="label" x="78" y="266">1 · Top-leading island</text>
<text class="small" x="78" y="290">Контекст: back, close, scope.</text>
<path class="callout" d="M 545 203 H 690 V 236"/><circle class="dot" cx="545" cy="203" r="4"/>
<text class="label" x="520" y="266">2 · Utility toolbar island</text>
<text class="small" x="520" y="290">Родственные действия в одной поверхности.</text>
<path class="callout" d="M 382 760 H 112 V 820"/><circle class="dot" cx="382" cy="760" r="4"/>
<text class="label" x="78" y="850">3 · Floating navigation dock</text>
<text class="small" x="78" y="874">Группа destinations остаётся цельной.</text>
<path class="callout" d="M 548 760 H 690 V 900"/><circle class="dot" cx="548" cy="760" r="4"/>
<text class="label" x="520" y="930">4 · Detached action</text>
<text class="small" x="520" y="954">Отдельно только при другой семантической роли.</text>
<rect class="control" x="820" y="214" width="666" height="126" rx="22"/>
<text class="label" x="852" y="254">5 · Control surface, не chip</text>
<text class="small" x="852" y="284">Capsule — форма. Container — поверхность.</text>
<text class="small" x="852" y="307">Chip — input/filter/select/suggestion pattern.</text>
<rect class="control" x="820" y="364" width="666" height="148" rx="22"/>
<text class="label" x="852" y="404">6 · Edge detachment + safe-area anchor</text>
<text class="small" x="852" y="434">Chrome отделён от края viewport; anchor и отступы принадлежат</text>
<text class="small" x="852" y="458">layout/runtime, а не внутренней геометрии кнопок.</text>
<text class="small" x="852" y="482">Keyboard avoidance и scroll compaction проверяются отдельно.</text>
<rect class="control" x="820" y="536" width="666" height="148" rx="22"/>
<text class="label" x="852" y="576">7 · Occlusion zone</text>
<text class="small" x="852" y="606">Контент проходит под floating chrome только при гарантированном</text>
<text class="small" x="852" y="630">contrast, scroll reachability и корректном last-item inset.</text>
<text class="small" x="852" y="654">Underlay fixtures обязательны до выбора material.</text>
<rect class="control" x="820" y="708" width="666" height="170" rx="22"/>
<text class="label" x="852" y="748">8 · Semantic grouping before geometry</text>
<text class="small" x="852" y="778">Сначала owner, role и action density; затем количество островов,</text>
<text class="small" x="852" y="802">размер, shape и material.</text>
<text class="small" x="852" y="836">Не дробить каждую кнопку в отдельную капсулу ради визуального эффекта.</text>
<text class="micro" x="78" y="1022">EXPLORATION INPUT · SOURCE PIXELS UNAVAILABLE · NO COMPONENT PROMOTION AUTHORITY</text>
</svg>