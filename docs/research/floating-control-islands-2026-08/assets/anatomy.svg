<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
  .bg { fill: #f2f2ef; }
  .board { fill: #fbfbf9; stroke: #d7d7d1; stroke-width: 2; }
  .screen { fill: #f8f8f5; stroke: #bdbdb6; stroke-width: 2; }
  .device { fill: #232322; }
  .skeleton { fill: #e2e2dd; }
  .skeleton-strong { fill: #cecec7; }
  .control { fill: #ffffff; stroke: #c6c6bf; stroke-width: 1.5; }
  .control-active { fill: #2d2d2b; }
  .glyph { fill: none; stroke: #343432; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .glyph-on-dark { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .divider { stroke: #deded8; stroke-width: 1.5; }
  .safe { fill: none; stroke: #a6a69f; stroke-width: 1.5; stroke-dasharray: 7 7; }
  .occlusion { fill: #d7d7d1; fill-opacity: .28; stroke: #a7a79f; stroke-width: 1.25; stroke-dasharray: 5 5; }
  .callout { fill: none; stroke: #777770; stroke-width: 1.5; }
  .dot { fill: #777770; }
  .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #252523; }
  .subtitle { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 450; fill: #686862; }
  .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 650; fill: #333330; }
  .small { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 450; fill: #6c6c66; }
  .micro { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #75756e; letter-spacing: .7px; }
</style>
<rect class="bg" width="1600" height="1100"/>
<rect class="board" x="36" y="36" width="1528" height="1028" rx="30"/>
<text class="title" x="78" y="98">Anatomy · floating control islands</text>
<text class="subtitle" x="78" y="132">Рабочая терминология для дальнейшей проверки в дизайн-системе</text>
<g transform="translate(190,156) scale(.75)"><rect class="device" x="0" y="0" width="414" height="868" rx="48"/>
<rect class="screen" x="12" y="12" width="390" height="844" rx="38"/>
