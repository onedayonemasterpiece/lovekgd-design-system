<rect class="skeleton" x="34" y="348.0" width="314.9" height="12" rx="6"/>
<rect class="skeleton" x="34" y="368.0" width="269.9" height="12" rx="6"/>
<rect class="skeleton" x="34" y="404.0" width="346" height="108" rx="18"/>
