<rect class="skeleton-strong" x="138" y="471.0" width="118.8" height="10" rx="5"/>
<rect class="skeleton" x="34" y="532.0" width="346" height="108" rx="18"/>
<rect class="skeleton-strong" x="50" y="549.0" width="72" height="72" rx="14"/>
<rect class="skeleton-strong" x="138" y="554.0" width="216.0" height="13" rx="6.5"/>
<rect class="skeleton-strong" x="138" y="579.0" width="155.5" height="10" rx="5"/>
<rect class="skeleton-strong" x="138" y="599.0" width="118.8" height="10" rx="5"/>
<rect class="control" x="32" y="40" width="92" height="48" rx="24"/>
<path class="glyph" d="M 65 56 L 57 64 L 65 72 M 58 64 H 70"/>
<rect class="skeleton-strong" x="81" y="59" width="25" height="10" rx="5"/>
<rect class="control" x="256" y="40" width="126" height="48" rx="24"/>
<circle class="glyph" cx="288" cy="62" r="7"/><path class="glyph" d="M 293 67 L 299 73"/>
<line class="divider" x1="319" y1="50" x2="319" y2="78"/>
<circle class="glyph" cx="344" cy="64" r="1.5"/><circle class="glyph" cx="351" cy="64" r="1.5"/><circle class="glyph" cx="358" cy="64" r="1.5"/>
<rect class="occlusion" x="24" y="740" width="366" height="88" rx="34"/>
<rect class="control" x="32" y="772" width="270" height="58" rx="29"/>
<circle fill="#4a4a46" cx="86.0" cy="800" r="5"/>
