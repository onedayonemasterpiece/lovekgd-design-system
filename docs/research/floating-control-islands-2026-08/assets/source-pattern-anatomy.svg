<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<style>
.bg{fill:#0b1017}.panel{fill:#111923;stroke:#2b3745;stroke-width:2}.ph{fill:#0c0f14;stroke:#687381;stroke-width:2}.s{fill:#2a3038;stroke:#505965;stroke-width:1.4}.m{fill:#6a7380}.a{fill:#2f80ed}.o{stroke:#dce3eb;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.bl{stroke:#2f80ed;stroke-width:2;fill:none}.am{stroke:#f0a427;stroke-width:2;fill:none}.t{font-family:Inter,Arial,sans-serif}.h{fill:#f4f7fb;font-size:30px;font-weight:760}.sub{fill:#93a0b0;font-size:14px}.bh{fill:#4aa0ff;font-size:16px;font-weight:730}.ah{fill:#f0a427;font-size:16px;font-weight:730}.body{fill:#9aa6b5;font-size:12px}.boxh{fill:#f4f7fb;font-size:18px;font-weight:730}.boxb{fill:#a4afbd;font-size:12px}.white{fill:#e8edf3}
</style>
<rect class="bg" width="1200" height="850"/><rect class="panel" x="24" y="24" width="1152" height="802" rx="26"/>
<text class="t h" x="54" y="72">Detached chrome / floating control islands</text><text class="t sub" x="54" y="98">Anatomy and design-system implications from the six reviewed screens</text>
<g transform="translate(455 130)"><rect class="ph" width="290" height="470" rx="32"/>
<circle class="s" cx="38" cy="50" r="23"/><path class="o" d="M28 43h20M28 50h20M28 57h20"/>
<rect class="s" x="78" y="27" width="134" height="46" rx="23"/><rect class="m" x="112" y="45" width="66" height="10" rx="5"/>
<rect class="s" x="220" y="27" width="58" height="46" rx="23"/><circle class="white" cx="238" cy="50" r="3"/><circle class="white" cx="250" cy="50" r="3"/><circle class="white" cx="262" cy="50" r="3"/>
<rect class="m" x="54" y="130" width="182" height="9" rx="4.5"/><rect class="m" x="74" y="151" width="142" height="7" rx="3.5"/>
<rect class="s" x="30" y="205" width="230" height="64" rx="20"/><rect class="a" x="46" y="219" width="7" height="36" rx="3.5"/><rect class="m" x="68" y="221" width="148" height="8" rx="4"/><rect class="m" x="68" y="241" width="112" height="7" rx="3.5"/>
<circle class="s" cx="244" cy="318" r="22"/><path class="o" d="M244 306v20M236 319l8 8 8-8"/>
<rect class="s" x="18" y="382" width="254" height="52" rx="26"/><circle class="m" cx="48" cy="408" r="18"/><rect class="m" x="78" y="402" width="132" height="12" rx="6"/><circle class="m" cx="242" cy="408" r="18"/>
</g>
<path class="bl" d="M455 180H260"/><text class="t bh" x="54" y="174">Detached top islands</text><text class="t body" x="54" y="197">leading, context and trailing roles</text><text class="t body" x="54" y="214">do not require one full-width bar</text>
<path class="bl" d="M533 180L310 295H260"/><text class="t bh" x="54" y="290">Centered context capsule</text><text class="t body" x="54" y="313">mode, scope or page identity</text>
<path class="bl" d="M473 538H260"/><text class="t bh" x="54" y="532">Floating bottom composer</text><text class="t body" x="54" y="555">inset input surface above system edge</text>
<path class="am" d="M745 180H940"/><text class="t ah" x="956" y="174">Keep related actions grouped</text><text class="t body" x="956" y="197">utility actions stay in one island</text>
<path class="bl" d="M715 366H940"/><text class="t bh" x="956" y="360">Pinned context banner</text><text class="t body" x="956" y="383">persistent context can be a second surface</text>
<path class="am" d="M699 538H940"/><text class="t ah" x="956" y="532">Transient utility</text><text class="t body" x="956" y="555">scroll/FAB can float and disappear</text>
<rect class="s" x="54" y="640" width="340" height="142" rx="20"/><text class="t boxh" x="78" y="674">Three bottom architectures</text>
<text class="t boxb" x="78" y="706">1. composer — task input</text><text class="t boxb" x="78" y="730">2. navigation dock — core destinations</text><text class="t boxb" x="78" y="754">3. mini-player + nav — persistent state stack</text>
<rect class="s" x="430" y="640" width="340" height="142" rx="20"/><text class="t boxh" x="454" y="674">Do not make one “pill” component</text>
<text class="t boxb" x="454" y="706">surface primitive ≠ composition</text><text class="t boxb" x="454" y="730">composition ≠ control semantics</text><text class="t boxb" x="454" y="754">runtime anchor/state is a separate contract</text>
<rect class="s" x="806" y="640" width="340" height="142" rx="20"/><text class="t boxh" x="830" y="674">Validation gates</text>
<text class="t boxb" x="830" y="706">underlays · keyboard · scroll states</text><text class="t boxb" x="830" y="730">safe areas · landscape · occlusion</text><text class="t boxb" x="830" y="754">family mapping before Penpot promotion</text>
</svg>