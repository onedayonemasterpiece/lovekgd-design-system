    depends_on: [L1, L2, L3, L4]
    execution_mode: serial_after_dependency
    branch: normalization/apply-component-synthesis-v0-1
    worktree: /home/dev/.codex/worktrees/lovekgd-design-system/apply-component-synthesis-v0-1
    writable_files: [manifest.json, README.md, .codex/integration/**, receipts/**, Penpot live files]
