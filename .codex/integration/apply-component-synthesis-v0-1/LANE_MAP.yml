mode: worktree_worker_then_serial_integrator
repo: onedayonemasterpiece/lovekgd-design-system
base_ref: c59a3576c7361c1953b31ad9b98ed096640e92c7
base_branch: main
integration_branch: normalization/apply-component-synthesis-v0-1
global_constraints:
  - events-bot-new read-only
  - canonical=false accepted=false promotion_ready=false
  - experiments NOT_MERGED
  - no taxonomy redesign or broad decoder
  - no PR merge
verification_owner: L0-integrator
stop_conditions:
